<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
"use strict";
// ================== PARAMS ==================
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const FPS = 30, DUR = 10;
const canvas = document.getElementById('c'); canvas.width = W; canvas.height = H;
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');

// ================== GLSL COMMON ==================
const DEFORM = `
mat3 rotZ(float a){ float c=cos(a),s=sin(a); return mat3(c,s,0, -s,c,0, 0,0,1); }
mat3 rotX(float a){ float c=cos(a),s=sin(a); return mat3(1,0,0, 0,c,s, 0,-s,c); }
`;
const VS_BODY = `
in vec3 aV; in vec3 aN; in vec2 aF;
in vec3 aPos; in vec2 aSize; in vec3 aColor; in vec4 aParam; in vec4 aTilt;
out vec3 vN; out vec3 vW; out vec3 vC; out vec2 vF; out float vK;
void main(){
  vec3 p = aV; p.xz *= aSize.x*aTilt.z; p.y *= aSize.y*aTilt.w;
  mat3 R = rotX(aTilt.y)*rotZ(-aTilt.x);
  vec3 w = aPos + R*p; vec3 n = R*aN;
  vW = w; vN = n; vC = aColor; vF = aF; vK = aParam.x;
  gl_Position = uVP * vec4(w,1.0);
}`;
const FS_MAIN = `#version 300 es
precision highp float; precision highp sampler2DShadow;
in vec3 vN; in vec3 vW; in vec3 vC; in vec2 vF; in float vK;
uniform vec3 uCam; uniform vec3 uSun; uniform vec3 uSunCol; uniform mat4 uLVP; uniform sampler2DShadow uShadow; uniform vec3 uFog;
out vec4 o;
float shadow(vec3 w, vec3 n){
  vec4 lp = uLVP*vec4(w + n*0.12, 1.0); vec3 c = lp.xyz*0.5+0.5;
  if(c.x<0.0||c.x>1.0||c.y<0.0||c.y>1.0||c.z>1.0) return 1.0;
  float s=0.0; float px = 1.0/2048.0;
  s += texture(uShadow, vec3(c.xy, c.z-0.0015)); s += texture(uShadow, vec3(c.xy+vec2(px*1.3,0), c.z-0.0015)); s += texture(uShadow, vec3(c.xy-vec2(px*1.3,0), c.z-0.0015)); s += texture(uShadow, vec3(c.xy+vec2(0,px*1.3), c.z-0.0015)); s += texture(uShadow, vec3(c.xy-vec2(0,px*1.3), c.z-0.0015));
  return s/5.0; }
void main(){
  vec3 n = normalize(vN); vec3 v = normalize(uCam - vW); vec3 l = normalize(uSun);
  float sh = shadow(vW, n);
  float ndl = dot(n,l); float dif = clamp((ndl+0.3)/1.3, 0.0, 1.0);
  vec3 skyC = vec3(0.45,0.62,0.95), gndC = vec3(0.55,0.42,0.22);
  vec3 amb = mix(gndC, skyC, n.y*0.5+0.5)*0.34;
  vec3 h = normalize(l+v); float spec = pow(max(dot(n,h),0.0), 48.0)*0.35;
  float fr = pow(1.0-max(dot(n,v),0.0), 3.0);
  vec3 alb = vC;
  float ao = 1.0;
  if(vF.x > 1.5) ao = mix(0.5, 1.0, vF.y)*0.8; else if(vF.x>0.5) ao = 0.88;
  float sss = pow(clamp(dot(v,-l),0.0,1.0), 5.0)*0.35*(vF.x<0.5?1.0:0.3);
  vec3 col = alb*(uSunCol*dif*sh*1.55 + amb)*ao + uSunCol*spec*sh*max(ndl,0.0) + fr*skyC*0.18 + alb*sss*uSunCol;
  float d = length(uCam - vW); float f = 1.0 - exp(-d*d*0.00003);
  float sunAmt = pow(max(dot(-v, l),0.0), 6.0);
  vec3 fogC = mix(uFog, uSunCol*0.9+vec3(0.1), sunAmt*0.6);
  if(vK>4.5) col = vC*2.2; else if(vK>3.5) col = vC*(0.55+0.6*dif*sh) + vC*0.3*max(0.0,-ndl);
  col = mix(col, fogC, f);
  o = vec4(col, 1.0);
}`;
const VS_SHADOW_SUFFIX = ``;
const FS_SHADOW = `#version 300 es
precision highp float; in vec3 vN; in vec3 vW; in vec3 vC; in vec2 vF; in float vK; out vec4 o; void main(){ o=vec4(1.0); }`;
const VS_QUAD = `#version 300 es
const vec2 P[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3)); out vec2 uv; void main(){ uv=P[gl_VertexID]*0.5+0.5; gl_Position=vec4(P[gl_VertexID],0,1); }`;
const FS_SKY = `#version 300 es
precision highp float; in vec2 uv; uniform mat4 uInvVP; uniform vec3 uSun; uniform vec3 uSunCol; out vec4 o;
void main(){
  vec4 a = uInvVP*vec4(uv*2.0-1.0, 1.0, 1.0); vec4 b = uInvVP*vec4(uv*2.0-1.0, -1.0, 1.0);
  vec3 d = normalize(a.xyz/a.w - b.xyz/b.w);
  vec3 zen = vec3(0.22,0.45,0.9), hor = vec3(0.95,0.72,0.5);
  float y = max(d.y, 0.0);
  vec3 c = mix(hor, zen, pow(y, 0.5));
  if(d.y<0.0) c = mix(hor, vec3(0.5,0.38,0.22), clamp(-d.y*6.0,0.0,1.0));
  float s = max(dot(d, normalize(uSun)), 0.0);
  c += uSunCol*(pow(s,1200.0)*12.0 + pow(s,40.0)*0.55 + pow(s,5.0)*0.12);
  o = vec4(c,1.0);
}`;
const FS_BRIGHT = `#version 300 es
precision highp float; in vec2 uv; uniform sampler2D uT; out vec4 o;
void main(){ vec3 c = texture(uT, uv).rgb; float l = dot(c, vec3(0.3,0.59,0.11)); o = vec4(c*smoothstep(0.85,1.6,l), 1.0); }`;
const FS_BLUR = `#version 300 es
precision highp float; in vec2 uv; uniform sampler2D uT; uniform vec2 uDir; out vec4 o;
void main(){ float w[5]=float[5](0.227,0.194,0.121,0.054,0.016); vec3 c=texture(uT,uv).rgb*w[0];
 for(int i=1;i<5;i++){ c+=texture(uT,uv+uDir*float(i)).rgb*w[i]; c+=texture(uT,uv-uDir*float(i)).rgb*w[i]; } o=vec4(c,1.0); }`;
const FS_POST = `#version 300 es
precision highp float; in vec2 uv; uniform sampler2D uT; uniform sampler2D uB; out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
void main(){ vec3 c = texture(uT,uv).rgb + texture(uB,uv).rgb*0.55;
  vec2 q = uv-0.5; float vig = 1.0 - dot(q,q)*0.55; c *= vig;
  c = aces(c*0.9); c = pow(c, vec3(1.0/2.2));
  o = vec4(c,1.0); }`;

function prog(vs, fs){ const p=gl.createProgram(); for(const [t,s] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh); if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)+'\n'+s); gl.attachShader(p,sh);} gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
const vsBody = `#version 300 es\nprecision highp float; uniform mat4 uVP;\n` + DEFORM + VS_BODY;
const P_MAIN = prog(vsBody, FS_MAIN), P_SH = prog(vsBody, FS_SHADOW), P_SKY = prog(VS_QUAD, FS_SKY), P_BR = prog(VS_QUAD, FS_BRIGHT), P_BL = prog(VS_QUAD, FS_BLUR), P_POST = prog(VS_QUAD, FS_POST);
const U = (p,n)=>gl.getUniformLocation(p,n);

// ================== GEOMETRY: pointy-top hex prism with bevel ==================
function hexGeom(){
  const V=[], I=[]; let vi=0;
  const ring=(r,y)=>{ const a=[]; for(let k=0;k<6;k++){ const an=Math.PI/6+k*Math.PI/3; a.push([r*Math.cos(an), y, r*Math.sin(an)]); } return a; };
  const bot=ring(1,0), outTop=ring(1,0.9), inTop=ring(0.8,1);
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  // quad a,b,c,d (a,b lower edge; d,c upper edge above a,b). Outward = away from axis.
  const quad=(a,b,c,d,ft,ha,hb)=>{
    let n=norm(cross(sub(b,a),sub(d,a))); const mid=[(a[0]+c[0])/2,0,(a[2]+c[2])/2];
    let flip=false; if(dot(n,[mid[0],0,mid[2]])<0 && (Math.abs(mid[0])+Math.abs(mid[2]))>1e-6){ n=[-n[0],-n[1],-n[2]]; flip=true; }
    if(n[1]<-0.5){ n=[-n[0],-n[1],-n[2]]; flip=!flip; }
    for(const [p,h] of [[a,ha],[b,ha],[c,hb],[d,hb]]) V.push(...p,...n,ft,h);
    if(!flip) I.push(vi,vi+1,vi+2, vi,vi+2,vi+3); else I.push(vi,vi+2,vi+1, vi,vi+3,vi+2); vi+=4; };
  for(let k=0;k<6;k++){ const k2=(k+1)%6;
    quad(bot[k],bot[k2],outTop[k2],outTop[k],2,0,0.9);
    quad(outTop[k],outTop[k2],inTop[k2],inTop[k],1,0.9,1);
  }
  // top cap: fan of inTop, winding so geometric normal is +y
  const c0=vi; for(const p of inTop){ V.push(...p,0,1,0,0,1); vi++; }
  for(let k=1;k<5;k++){ const a=inTop[0],b=inTop[k],c=inTop[k+1]; const n=cross(sub(b,a),sub(c,a)); if(n[1]>0) I.push(c0,c0+k,c0+k+1); else I.push(c0,c0+k+1,c0+k); }
  // bottom cap not needed
  return {v:new Float32Array(V), i:new Uint16Array(I)};
}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], norm=a=>{const l=Math.hypot(...a)||1; return [a[0]/l,a[1]/l,a[2]/l];};
const G = hexGeom();
// orientation check: winding should face outward; we disable culling for safety.

// ================== INSTANCES ==================
function hstat(x,z){ return 1.1*Math.sin(0.09*x+0.3)*Math.cos(0.07*z) + 0.55*Math.sin(0.17*x-0.11*z+1.0) + 0.28*Math.sin(0.31*x+0.23*z+2.0) + 0.0022*Math.max(0,-z-14)*Math.max(0,-z-14); }
let seed=7; const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
const inst=[]; // each: [x,y,z, r,h, cr,cg,cb, kind,phase,amp,seed, tx,tz,sxz,sy]
function add(x,y,z,r,h,c,kind=0,phase=0,amp=0,tx=0,tz=0,sxz=1,sy=1){ inst.push(x,y,z,r,h,c[0],c[1],c[2],kind,phase,amp,rnd(),tx,tz,sxz,sy); }
const HR=0.8, HX=Math.sqrt(3)*HR, HZ=1.5*HR;
// terrain
for(let row=-48; row<=26; row++){ for(let col=-34; col<=72; col++){
  const x = col*HX + (row&1 ? HX/2 : 0), z = row*HZ; const hs = hstat(x,z);
  const t = Math.min(1, Math.max(0, (hs+1.2)/3.0));
  let c = [0.42+0.5*t, 0.6-0.03*t+0.1*(1-t), 0.18+0.02*t]; // green-gold -> amber
  c = [c[0]*(0.94+0.12*rnd()), c[1]*(0.94+0.12*rnd()), c[2]*(0.9+0.2*rnd())];
  let extra=0; const fl=rnd();
  if(fl<0.035){ c=[0.98,0.45,0.6]; extra=0.12; } else if(fl<0.055){ c=[0.98,0.96,0.9]; extra=0.1; } else if(fl<0.07){ c=[0.7,0.5,0.95]; extra=0.1; }
  add(x, hs-3.0+extra, z, HR*0.96, 3.0, c, 0);
}}
// trees
const heroDir=[Math.cos(-0.3),Math.sin(-0.3)];
function nearPath(x,z){ const px=x+8, pz=z+2; const along=px*heroDir[0]+pz*heroDir[1]; const side=-px*heroDir[1]+pz*heroDir[0]; // side>0 = camera side (+z-ish)
  if(along>-10 && along<60 && Math.abs(side)<7.5) return true;
  // camera corridor: camera sits ahead/right at ~(+5.5,+6.5) early and (+13,+14) late relative to hero
  for(const o of [[7,4.5],[8.5,8],[10,11],[4,3]]){ const cs=-o[0]*heroDir[1]+o[1]*heroDir[0], ca=o[0]*heroDir[0]+o[1]*heroDir[1]; if(along>ca-10 && along<ca+58 && Math.abs(side-cs)<8) return true; }
  return false; }
function tree(x,z,scale){
  const hs=hstat(x,z); const th=(2.6+2.2*rnd())*scale; const ph=rnd()*6.28; const amp=0.03+0.03*rnd();
  add(x,hs,z,0.28*scale,th,[0.42,0.26,0.14],2,ph,amp*0.5);
  const rc=(0.8+0.5*rnd())*scale; const hue=rnd();
  const basec = hue<0.65? [0.22+0.2*rnd(),0.5+0.25*rnd(),0.2+0.1*rnd()] : hue<0.85 ? [0.55+0.2*rnd(),0.7,0.18] : [0.92,0.5+0.15*rnd(),0.15];
  const cells=[[0,0]]; for(let k=0;k<6;k++){ const an=k*Math.PI/3; cells.push([Math.cos(an)*rc*1.05*1.0, Math.sin(an)*rc*1.05]); }
  if(rnd()<0.5) cells.push([0,0,1]);
  cells.forEach((cp,idx)=>{ const top = idx===cells.length-1 && cp[2] ? 1 : 0; const ch=(1.0+1.1*rnd())*scale*(idx===0?1.3:1); const cy = hs + th - 0.6*scale + (top? ch*0.9 : 0) + (idx?-0.3*rnd()*scale:0);
    const cc=[basec[0]*(0.9+0.2*rnd()),basec[1]*(0.9+0.2*rnd()),basec[2]*(0.9+0.2*rnd())];
    add(x+cp[0], cy, z+cp[1], rc*(idx===0?1.0:0.78)*(top?0.7:1), ch, cc, 1, ph+idx*0.4, amp*(1+0.3*idx)); });
}
for(let i=0;i<150;i++){ const x=-40+120*rnd(), z=-70+42*rnd(); if(nearPath(x,z)) continue; tree(x,z,0.9+0.6*rnd()); }
for(let i=0;i<22;i++){ const x=-30+80*rnd(), z=-26+40*rnd(); if(nearPath(x,z)) continue; tree(x,z,0.8+0.5*rnd()); }
// clouds
for(let i=0;i<14;i++){ const cx=-60+150*rnd(), cz=-95+70*rnd(), cy=15+10*rnd(); const n=5+Math.floor(rnd()*6); const ph=rnd()*6.28;
  for(let k=0;k<n;k++){ const r=1.4+1.4*rnd(); add(cx+(rnd()-0.5)*7, cy+(rnd()-0.5)*1.2, cz+(rnd()-0.5)*4, r, 0.5+0.5*rnd(), [0.99,0.97,0.95], 4, ph, 0); } }
// pollen
for(let i=0;i<260;i++){ const x=-20+70*rnd(), z=-30+40*rnd(); add(x, hstat(x,z)+0.5+3.5*rnd(), z, 0.03+0.04*rnd(), 0.06, [1.0,0.85,0.35], 5, rnd()*6.28, 0); }
const NSTATIC = inst.length/16;
// hero: reserve 40 instances
const HERO_N=40, heroBase = inst.length; for(let i=0;i<HERO_N;i++) add(0,-100,0,0.01,0.01,[1,1,1],3,0,0);
const instArr = new Float32Array(inst); const baseArr = new Float32Array(inst);

// buffers
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,G.v,gl.STATIC_DRAW);
const ib=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,G.i,gl.STATIC_DRAW);
const A=(p,n,sz,stride,off,div)=>{ const l=gl.getAttribLocation(p,n); if(l<0) return; gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l,sz,gl.FLOAT,false,stride,off); gl.vertexAttribDivisor(l,div); };
function setupVAO(p){ gl.bindBuffer(gl.ARRAY_BUFFER,vb); A(p,'aV',3,32,0,0); A(p,'aN',3,32,12,0); A(p,'aF',2,32,24,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,instB); A(p,'aPos',3,64,0,1); A(p,'aSize',2,64,12,1); A(p,'aColor',3,64,20,1); A(p,'aParam',4,64,32,1); A(p,'aTilt',4,64,48,1); }
const instB=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,instB); gl.bufferData(gl.ARRAY_BUFFER,instArr,gl.DYNAMIC_DRAW);
setupVAO(P_MAIN); // same attribute locations assumed? ensure by binding locations: use same names -> may differ. Build VAO per program.
const vaoSh=gl.createVertexArray(); gl.bindVertexArray(vaoSh); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib); setupVAO(P_SH);
const vaoEmpty=gl.createVertexArray();

// ================== FBOs ==================
function tex(w,h,ifmt,fmt,type,filter){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t); gl.texImage2D(gl.TEXTURE_2D,0,ifmt,w,h,0,fmt,type,null); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t; }
const SM=2048; const shTex=tex(SM,SM,gl.DEPTH_COMPONENT24,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
const shFB=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,shFB); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,shTex,0); gl.drawBuffers([gl.NONE]);
const sceneTex=tex(W,H,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,gl.LINEAR); const sceneFB=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFB); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,sceneTex,0);
const depthRB=gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER,depthRB); gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,W,H); gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,depthRB);
const BW=W>>2, BH=H>>2; const bTex=[0,1].map(()=>tex(BW,BH,gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT,gl.LINEAR)); const bFB=bTex.map(t=>{ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0); return f; });
if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) throw new Error('fbo');

// ================== MATH ==================
function persp(fov,asp,n,f){ const t=1/Math.tan(fov/2); return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0]; }
function ortho(l,r,b,t,n,f){ return [2/(r-l),0,0,0, 0,2/(t-b),0,0, 0,0,-2/(f-n),0, -(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1]; }
function lookAt(e,c,up){ const z=norm(sub(e,c)); const x=norm(cross(up,z)); const y=cross(z,x); return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]), -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]), -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]; }
function mul(a,b){ const o=new Array(16).fill(0); for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++) o[j*4+i]+=a[k*4+i]*b[j*4+k]; return o; }
function inv(m){ const a=m, o=new Array(16); const [a00,a01,a02,a03,a10,a11,a12,a13,a20,a21,a22,a23,a30,a31,a32,a33]=a;
 const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
 let det=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06; det=1/det;

const smooth=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };

// ================== HERO MOTION ==================
const YAW=-0.3, FD=[Math.cos(YAW),Math.sin(YAW)];
const hops=[]; { let t=0.15; while(t<7.0){ hops.push({t0:t,dur:0.56,h:1.15,v:3.2}); t+=0.56+0.12; } hops.push({t0:7.3,dur:1.15,h:3.2,v:4.0}); }

// fill ripple positions

const rot2=(x,z,yaw)=>[x*Math.cos(yaw)-z*Math.sin(yaw), x*Math.sin(yaw)+z*Math.cos(yaw)];

// ================== RENDER ==================
