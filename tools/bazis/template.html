:root{

#app{position:relative;height:100%;display:flex;flex-direction:column}

#stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

@media (max-width:600px){#info{top:auto;bottom:8px;right:8px;max-height:32%;font-size:12px}}
#info h2{font-size:14px;margin:0 0 4px;font-weight:600}
#info .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
#info .v{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#info table{border-collapse:collapse;width:100%;margin-top:6px}
#info td{padding:3px 0;border-top:1px solid var(--line);vertical-align:top}
#info td.v{text-align:right;padding-left:10px;white-space:nowrap}
#hint{position:absolute;right:16px;bottom:16px;font-size:12px;color:var(--muted);text-align:right;pointer-events:none}
@media (max-width:600px){#hint{display:none} header{padding:8px 12px}}

  const fastG=new THREE.Group(); scene.add(fastG); fastG.visible=false;
