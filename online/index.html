<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Flagball Arena</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2d6e;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #join{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,17,60,.92);z-index:5;touch-action:auto}
  .box{width:min(92vw,480px);max-height:94vh;overflow:auto;background:#221d45;border-radius:24px;padding:20px 18px;color:#fff;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);box-sizing:border-box}
  h1{margin:0 0 12px;font-size:26px}
  input{width:100%;box-sizing:border-box;background:#14112b;border:2px solid #4a4380;color:#fff;border-radius:14px;padding:12px;font-size:20px;text-align:center;font-family:inherit;user-select:text;-webkit-user-select:text}
  #flags{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:14px 0}
  #flags img{width:100%;aspect-ratio:3/2;border-radius:6px;border:3px solid transparent;cursor:pointer;box-sizing:border-box}
  #flags img.on{border-color:#ffeb3b;transform:scale(1.08)}
  #cn{min-height:22px;margin:-4px 0 12px;color:#ffeb3b;font-size:17px;font-weight:700}
  button{width:100%;border:0;border-radius:16px;padding:15px;font-size:22px;font-weight:800;color:#fff;background:#43a047;cursor:pointer;font-family:inherit}
  .hint{font-size:13px;color:#9a94bf;margin-top:12px;line-height:1.4}
  @media (max-height:520px){ .box{padding:12px 14px} h1{font-size:20px;margin-bottom:6px} #flags{grid-template-columns:repeat(12,1fr);margin:8px 0} button{padding:10px} .hint{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="join"><div class="box">
  <h1 id="jt">Flagball Arena</h1>
  <input id="nick" maxlength="14" autocomplete="off">
  <div id="flags"></div>
  <div id="cn"></div>
  <button id="go">Play</button>
  <div class="hint" id="hint"></div>
</div></div>
<script>
// окно имени и страны: в первый раз на своём сайте и по кнопке «Страна» между жизнями
(function () {
  let built = false, pick = 'US', names = {};
  window.__showJoin = function (o) {
    const C = window.Core, el = (id) => document.getElementById(id);
    const T = o.T; pick = o.skin;
    el('jt').textContent = o.first ? T.title : T.change;
    el('nick').placeholder = T.name; el('nick').value = o.nick || '';
    el('go').textContent = T.play; el('hint').textContent = o.first ? T.hint : '';
    const box = el('flags');
    const mark = () => { box.querySelectorAll('img').forEach((x) => { x.className = x.alt === pick ? 'on' : ''; }); el('cn').textContent = names[pick] || pick; };
    if (!built) {
      built = true;
      o.flags.forEach((id) => { const im = document.createElement('img'); try { im.src = C.flagTex(id).toDataURL(); } catch (e) { /* */ } im.alt = id; im.onclick = () => { pick = id; mark(); }; box.appendChild(im); });
      const go = () => { const n = el('nick').value.trim().slice(0, 14) || o.nick || ''; el('join').style.display = 'none'; window.__join(n || ((T === undefined) ? 'Player' : (T.change === 'Страна' ? 'Игрок' : 'Player')), pick); };
      el('go').onclick = go;
      el('nick').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    }
    names = o.names || {};
    mark();
    el('join').style.display = 'flex';
  };
})();
</script>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
