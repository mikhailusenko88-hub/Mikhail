name: Zamer3D
options:
  bundleIdPrefix: ru.usenko
  deploymentTarget:
    iOS: "17.0"
targets:
  Zamer3D:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Mebel
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Замер 3D"
        CFBundleShortVersionString: "2.1"
        CFBundleVersion: "24"
        NSCameraUsageDescription: "Камера и LiDAR нужны для 3D-скана помещения."
        NSMicrophoneUsageDescription: "Микрофон нужен, чтобы описывать персонажей мультиков голосом."
        NSSpeechRecognitionUsageDescription: "Распознавание речи превращает голосовое описание персонажа в текст."
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: ru.usenko.zamer3d.bazis
            UTTypeDescription: "Базис-Мебельщик"
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [b3d, fr3d, B3D, FR3D]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Базис-Мебельщик"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [ru.usenko.zamer3d.bazis]
          - CFBundleTypeName: "ZIP"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.usenko.zamer3d
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
