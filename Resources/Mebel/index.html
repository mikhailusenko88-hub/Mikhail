<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Мебель</title>
<style>
  :root { --bg:#1c1d20; --panel:rgba(30,31,35,.95); --line:#3a3c42; --text:#f2f2f2; --dim:#9a9ca3; --acc:#ff9f0a; --blue:#0a84ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px -apple-system,system-ui,sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #view { position:fixed; inset:0; touch-action:none; }
  .bar { position:fixed; left:0; right:0; display:flex; gap:6px; padding:8px 10px; overflow-x:auto; }
  #top { top:env(safe-area-inset-top); }
  #bottom { bottom:0; padding-bottom:calc(8px + env(safe-area-inset-bottom)); flex-direction:column; background:var(--panel); border-top:1px solid var(--line); }
  button, select { background:#2c2e33; color:var(--text); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; font:inherit; font-weight:600; white-space:nowrap; }
  button.acc { background:var(--acc); color:#000; border-color:var(--acc); }
  button.blue { background:var(--blue); border-color:var(--blue); }
  button.on { background:var(--acc); color:#000; }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:6px; overflow-x:auto; align-items:flex-end; flex-shrink:0; }
  label { display:flex; flex-direction:column; font-size:11px; color:var(--dim); gap:2px; }
  input { width:64px; background:#111; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px; font:inherit; }
  input[type=color] { width:44px; height:34px; padding:2px; }
  select { padding:7px; }
  #sel { font-weight:700; min-width:40px; align-self:center; }
  #msg { position:fixed; top:calc(56px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:var(--panel); padding:6px 12px; border-radius:20px; font-size:13px; pointer-events:none; transition:opacity .3s; max-width:90%; text-align:center; }
  .hide { display:none !important; }
  #hw { position:fixed; left:10px; right:10px; top:calc(60px + env(safe-area-inset-top)); bottom:45%; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; font-size:14px; z-index:5; }
  #hw h3 { margin:10px 0 4px; font-size:15px; } #hw li { margin:2px 0; }
  .sep { width:1px; align-self:stretch; background:var(--line); flex-shrink:0; }
</style>
</head>
<body>
<div id="view"></div>
<div id="top" class="bar">
  <button id="close">✕</button>
  <button id="undo">↶</button>
  <select id="addSel">
    <option value="">+ Модуль…</option>
    <option value="base">Тумба (Н)</option>
    <option value="drawers">Тумба с ящиками (Я)</option>
    <option value="sink">Под мойку (М)</option>
    <option value="wall">Верхний (В)</option>
    <option value="tall">Пенал (П)</option>
    <option value="wardrobe">Шкаф (Ш)</option>
    <option value="shelf">Открытая полка (О)</option>
    <option value="panel">Панель / боковина (Б)</option>
    <option value="countertop">Столешница (Ст)</option>
    <option value="filler">Фальш-панель (Ф)</option>
  </select>
  <button id="multi">Выбор нескольких</button>
  <button id="move">✋ Двигать</button>
  <button id="slideAll">Выдвинуть</button>
  <button id="bzBtn">Базис…</button>
  <input id="bzFile" type="file" class="hide">
  <button id="save" class="acc">Сохранить</button>
  <button id="publish" class="blue">Ссылка клиенту</button>
</div>
<div id="msg"></div>
<div id="hw" class="hide"></div>
<div id="bottom" class="bar">
  <div class="row" id="list"></div>
  <div class="row" id="edit">
    <span id="sel">—</span>
    <label>Ш, мм<input id="w" type="number" inputmode="numeric"></label>
    <label>В, мм<input id="h" type="number" inputmode="numeric"></label>
    <label>Г, мм<input id="d" type="number" inputmode="numeric"></label>
    <label>X, мм<input id="x" type="number" inputmode="numeric"></label>
    <label>Z, мм<input id="z" type="number" inputmode="numeric"></label>
    <label>От пола<input id="y0" type="number" inputmode="numeric"></label>
    <label>Поворот°<input id="r" type="number" inputmode="numeric"></label>
    <label>Цвет<input id="c" type="color"></label>
    <label>Свой цвет<input id="cn" type="text" placeholder="Egger U702…" style="width:104px"></label>
  </div>
  <div class="row">
    <button id="snap">⟂ К стене</button>
    <button id="group">Объединить</button>
    <button id="ungroup">Разъединить</button>
    <button id="top2">Столешница сверху</button>
    <button id="fill">Фальш-панели</button>
    <button id="hwBtn">Крепёж</button>
    <button id="dup">Копия</button>
    <button id="mirror">Зеркально</button>
    <button id="del">Удалить</button>
    <button id="optsBtn">⚙ Настройки</button>
  </div>
  <div class="row hide" id="opts">
    <label>Двери<input id="o_doors" type="number" min="0" max="6"></label>
    <label>Ящики<input id="o_drawers" type="number" min="0" max="8"></label>
    <label>Полки<input id="o_shelves" type="number" min="0" max="12"></label>
    <label>Фасад<select id="o_front"><option value="blind">глухой</option><option value="glass">стекло</option><option value="open">открытый</option></select></label>
    <label>Петли<select id="o_hinge"><option value="L">слева</option><option value="R">справа</option></select></label>
    <label>Ручки<select id="o_handle"><option value="bar">рейлинг</option><option value="profile">профиль</option><option value="none">без ручек</option></select></label>
    <label>Цоколь, мм<input id="o_plinth" type="number"></label>
    <label>Плита, мм<input id="o_thick" type="number"></label>
    <label>Шаг, мм<input id="o_step" type="number"></label>
    <span class="sep"></span>
    <label>Крепление<select id="o_mount"><option value="rebro">ребро ЛДСП + уголки</option><option value="ugolok">мебельные уголки</option><option value="brusok">брусок 20×40</option></select></label>
    <label>До потолка, мм<input id="o_gapTop" type="number"></label>
    <label>До стены, мм<input id="o_gapSide" type="number"></label>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './OrbitControls.js';

// ===== Общие функции рисования: эти же функции уходят в клиентскую страницу (toString) =====
function labelSprite(T, text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;

}
/// Материал плиты: декор «дерево» (Egger H…, Дуб, Орех…) — текстура с волокном вдоль длинной стороны детали,

        const y0 = rnd() * H, k = 1 + Math.floor(rnd() * 3), ph = rnd() * 6.28, amp = 1 + rnd() * 5, dark = rnd() > 0.35;

/// Выдвижные элементы внутри модуля (локально: x — ширина, y — высота, z — глубина, фасад на +D/2).
/// Ящик, корзина и брючница — группа, которая едет вперёд на it.travel мм.

    const bw = it.boxW ? mm(it.boxW) : iw - 0.026, bd = Math.min(mm(it.depth || 450), D - t - 0.02), bh = mm(it.boxH || it.h - 30), by = y0 + mm(it.boxY ?? 10), z1 = front - t, z0 = z1 - bd, s = 0.016;

    box(0.012, 0.014, bd - 0.05, -fx, top - 0.037, zc, zn); box(0.012, 0.014, bd - 0.05, fx, top - 0.037, zc, zn);
    box(2 * fx - 0.024, 0.026, 0.026, 0, top - 0.013, z1 - 0.013, gr); box(2 * fx - 0.024, 0.026, 0.026, 0, top - 0.013, z0 + 0.013, gr);
    const wm = new T.MeshStandardMaterial({ color:0x2f3134, metalness:0.4, roughness:0.5 });

      const dx = x1 - x0, dy = y1 - y0_, dz = zB - zA, L = Math.hypot(dx, dy, dz);
      const b = new T.Mesh(new T.BoxGeometry(Math.abs(dx) > 1e-6 ? L : r, Math.abs(dy) > 1e-6 ? L : r, Math.abs(dz) > 1e-6 ? L : r), wm);
      b.position.set((x0 + x1) / 2, (y0_ + y1) / 2, (zA + zB) / 2); g.add(b);
    };

      for (let i = 0; i <= nz; i++) { const z = za + (zb - za) * i / nz; rod(x0, yb, z, x1, yb, z, 0.003); rod(x0, yb, z, x0, yt, z, 0.003); rod(x1, yb, z, x1, yt, z, 0.003); }
      for (let k = 1; k <= 3; k++) { const y = yb + (yt - yb) * k / 3; rod(x0, y, za, x1, y, za, 0.003); rod(x0, y, zb, x1, y, zb, 0.003); rod(x0, y, za, x0, y, zb, 0.003); rod(x1, y, za, x1, y, zb, 0.003); }
      rod(x0, yt, (za + zb) / 2, -fx, yt, (za + zb) / 2, 0.005); rod(x1, yt, (za + zb) / 2, fx, yt, (za + zb) / 2, 0.005);

      rod(-fx, yl, z0 + 0.06, fx, yl, z0 + 0.06, 0.004); rod(-fx, yl, (z0 + z1) / 2, fx, yl, (z0 + z1) / 2, 0.004);

/// Плавное выдвижение: SLIDE[ключ] = { v:текущее 0..1, t:цель }.
function stepSlides(root) {
  root.traverse(o => {
    const s = o.userData.slide; if (!s) return;
    const st = SLIDE[s.key]; if (!st || st.v === st.t) return;
    st.v += Math.sign(st.t - st.v) * Math.min(Math.abs(st.t - st.v), 0.05);

function buildModule(T, m, on) {

    new T.MeshStandardMaterial({ color:m.color || '#e8e2d6', emissive: on ? 0x553300 : 0x000000,

    const t = (o.thick || 16) / 1000, cm = new T.MeshStandardMaterial({ color:m.color || '#e8e2d6', emissive: on ? 0x332000 : 0x000000 });

    const pl = (w, h, d, x, y, z, mat) => { const b = new T.Mesh(new T.BoxGeometry(w, h, d), mat || panelMat(T, m.color, m.colorName, w, h, d, on)); b.position.set(x, y, z); b.userData.code = m.code;
      b.add(new T.LineSegments(new T.EdgesGeometry(b.geometry), em)); root.add(b); };
    const bt = (o.backTh ?? 3) / 1000, cd = D - bt, cz = bt / 2;          // задняя стенка накладная: корпус глубиной D − bt, стенка за ним
    pl(t, H, cd, -W / 2 + t / 2, 0, cz); pl(t, H, cd, W / 2 - t / 2, 0, cz);

    if (bt > 0) pl(W - 0.002, H - 0.002, bt, 0, 0, -D / 2 + bt / 2, new T.MeshStandardMaterial({ color:o.backColor || '#e4d6bf', roughness:0.9 }));

      const key = m.code + ':' + i, st = (typeof SLIDE !== 'undefined') && SLIDE[key];
      g.userData.slide = { key, dist:(it.travel || 400) / 1000 };

    new T.LineBasicMaterial({ color: on ? 0xff9f0a : 0x222222 })));
  const line = new T.LineBasicMaterial({ color:0x333333 });
  const fz = D / 2 + 0.001;
  const seg = (x1, y1, x2, y2) => {
    const g = new T.BufferGeometry().setFromPoints([new T.Vector3(x1, y1, fz), new T.Vector3(x2, y2, fz)]);

    const top = H / 2, bot = -H / 2;
    const split = dr && dn ? top - H * 0.3 : bot;
    if (dr) { const step = (top - split) / dr; for (let i = 1; i <= dr; i++) seg(-W / 2, top - step * i, W / 2, top - step * i); }
    if (dn) {
      const dtop = dr ? split : top, step = W / dn;
      for (let i = 1; i < dn; i++) seg(-W / 2 + step * i, bot, -W / 2 + step * i, dtop);
      if (o.handle === 'bar') for (let i = 0; i < dn; i++) {
        const left = (dn === 1 ? o.hinge === 'R' : i % 2 === 1);
        const hx = left ? -W / 2 + step * i + 0.04 : -W / 2 + step * (i + 1) - 0.04;

      const s = new T.Mesh(new T.BoxGeometry(W - 2 * t, t, D - gf - gb), panelMat(T, o.shelfColor || m.color, o.shelfName || m.colorName, W - 2 * t, t, D - gf - gb)); s.position.z = (gb - gf) / 2;
      s.add(new T.LineSegments(new T.EdgesGeometry(s.geometry), new T.LineBasicMaterial({ color:0x5a4a38, transparent:true, opacity:0.3 })));
      s.position.y = at ? -H / 2 + at[i - 1] / 1000 + t / 2 : -H / 2 + H * i / (n + 1); s.userData.code = m.code; root.add(s);
    }
  }
  const lab = labelSprite(T, m.code); lab.position.y = H / 2 + 0.08; root.add(lab);
  root.userData.code = m.code;

}
function buildRoom(T, walls) {

    const mx = new T.Matrix4().fromArray(s.transform);
    const w = s.widthMm / 1000, h = s.heightMm / 1000, isWall = s.kind === 'wall';
    const mesh = new T.Mesh(new T.BoxGeometry(w, h, isWall ? 0.02 : 0.04),
      new T.MeshStandardMaterial({ color: isWall ? 0xd9d6cf : (s.kind === 'window' ? 0x7fd3ff : 0xffd34d),
        transparent:true, opacity: isWall ? 0.5 : 0.8, side:T.DoubleSide }));
    mesh.applyMatrix4(mx); g.add(mesh);

}

let msgT;

  clearTimeout(msgT); if (t) msgT = setTimeout(() => m.style.opacity = 0, ms); };

let camFrom = null;
function drawRoom() {
  camFrom = null;
  scene.remove(roomGroup);
  roomGroup = buildRoom(THREE, state.walls);
  for (const s of state.walls) {
    const mx = new THREE.Matrix4().fromArray(s.transform);
    const lab = labelSprite(THREE, s.code); lab.applyMatrix4(mx); lab.position.y += s.heightMm / 2000 + 0.08; roomGroup.add(lab);
  }
  scene.add(roomGroup);
  const ws = state.walls.filter(s => s.kind === 'wall');
  if (ws.length) {
    state.floorY = Math.round(Math.min(...ws.map(s => s.transform[13] * 1000 - s.heightMm / 2)));
    grid.position.y = state.floorY / 1000;
    const fb = new THREE.Box3(); ws.forEach(s => { const t = s.transform, hw = s.widthMm / 2000;   // пол комнаты: по концам стен
      for (const k of [-1, 1]) fb.expandByPoint(new THREE.Vector3(t[12] + t[0] * hw * k, 0, t[14] + t[2] * hw * k)); });
    const fs = fb.getSize(new THREE.Vector3()), fc = fb.getCenter(new THREE.Vector3());
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(fs.x, 0.5) + 0.2, Math.max(fs.z, 0.5) + 0.2),
      new THREE.MeshStandardMaterial({ color:0xcfc8bd, roughness:0.95 }));
    floor.rotation.x = -Math.PI / 2; floor.position.set(fc.x, state.floorY / 1000 - 0.001, fc.z); roomGroup.add(floor);
    grid.visible = false;
    // камера со стороны, где нет стены (вход), чуть сбоку и сверху
    const near = (k, v) => ws.some(s => Math.abs(s.transform[k] - v) < 0.2 && Math.abs(s.transform[k === 12 ? 2 : 0]) > 0.5);
    const dirs = [[0, 1, fb.max.z], [0, -1, fb.min.z], [1, 0, fb.max.x], [-1, 0, fb.min.x]];
    const free = dirs.find(([dx, dz, v]) => !near(dx ? 12 : 14, v)) || dirs[0];
    // отступ, чтобы вся ширина комнаты влезла в кадр (на телефоне кадр узкий)
    const span = (free[0] ? fs.z : fs.x) / 2 + 0.35, vf = camera.fov * Math.PI / 360, hf = Math.atan(Math.tan(vf) * Math.max(camera.aspect, 0.3));
    const dist = Math.max(2.0, span / Math.tan(hf) * 0.8) + (free[0] ? fs.x : fs.z) / 2, side = span * 0.55;   // чуть сбоку — видно нутро боковых рядов
    camFrom = { x:fc.x + free[0] * dist + free[1] * side, y:state.floorY / 1000 + 2.5, z:fc.z + free[1] * dist - free[0] * side };
    const c = new THREE.Box3().setFromObject(roomGroup).getCenter(new THREE.Vector3());
    controls.target.set(c.x, state.floorY / 1000 + 1.1, c.z);
    if (camFrom) camera.position.set(camFrom.x, camFrom.y, camFrom.z); else camera.position.set(c.x + 3, c.y + 3, c.z + 3);
  }
}

// ----- модули -----
function nextCode(letter) { let n = 1; while (state.modules.some(m => m.code === letter + n)) n++; return letter + n; }
const byCode = c => state.modules.find(m => m.code === c);
const selected = () => state.sel.map(byCode).filter(Boolean);
const first = () => selected()[0];

function add(type) {
  const p = PRESETS[type], t = controls.target;
  snapshot();
  const m = { code:nextCode(p.letter), name:p.name, type, w:p.w, h:p.h, d:p.d,
    x:Math.round(t.x * 1000), z:Math.round(t.z * 1000), y:state.floorY + p.y0 + p.h / 2, rotY:0,
    color:'#e8e2d6', colorName:'', opts:{ ...DEF_OPTS, ...p.opts } };
  state.modules.push(m); select([m.code]);
}
function draw() {
  modGroup.clear();
  for (const m of state.modules) {
    const g = buildModule(THREE, m, state.sel.includes(m.code));
    if (m.type === 'filler') addHardware3D(g, m);
    modGroup.add(g);
  }
  const list = document.getElementById('list'); list.innerHTML = '';
  for (const m of state.modules) {
    const b = document.createElement('button');
    if (state.sel.includes(m.code)) b.className = 'on';
    b.textContent = `${m.code}${m.group ? '·' + m.group : ''} ${m.w}×${m.h}×${m.d}`;
    b.onclick = () => pick(m.code);
    list.appendChild(b);
  }
}
/// Выбор: группа выбирается целиком; в режиме «Выбор нескольких» касание добавляет / убирает.
function pick(code) {
  const m = byCode(code); if (!m) return;
  const codes = m.group ? state.modules.filter(x => x.group === m.group).map(x => x.code) : [code];
  if (state.multi) {
    const has = codes.every(c => state.sel.includes(c));
    select(has ? state.sel.filter(c => !codes.includes(c)) : [...new Set([...state.sel, ...codes])]);
  } else select(codes);
}
const F = ['w','h','d','x','z','y0','r','c','cn'];
const O = ['doors','drawers','shelves','front','hinge','handle','plinth','thick','step','mount','gapTop','gapSide'];
function select(codes) {
  state.sel = codes; const m = first(), n = state.sel.length;
  document.getElementById('sel').textContent = !m ? '—' : (n > 1 ? `${n} шт.` : m.code);
  if (m) {
    const v = { w:m.w, h:m.h, d:m.d, x:m.x, z:m.z, y0:Math.round(m.y - m.h / 2 - state.floorY), r:m.rotY || 0, c:m.color, cn:m.colorName || '' };
    for (const k of F) document.getElementById(k).value = v[k];
    const o = { ...DEF_OPTS, ...(m.opts || {}) };
    for (const k of O) document.getElementById('o_' + k).value = o[k];
  }
  for (const k of ['w','h','d']) document.getElementById(k).disabled = n > 1;
  draw();
}
const num = id => Number(document.getElementById(id).value) || 0;
const step = () => Math.max(1, (first() && first().opts && first().opts.step) || 10);
const snapV = v => Math.round(v / step()) * step();

function rotateAround(mods, deg, cx, cz) {
  const a = -deg * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
  for (const m of mods) {
    const dx = m.x - cx, dz = m.z - cz;
    m.x = Math.round(cx + dx * cs - dz * sn); m.z = Math.round(cz + dx * sn + dz * cs);
    m.rotY = ((m.rotY || 0) + deg) % 360;
  }
}
const centroid = mods => ({ x: mods.reduce((s, m) => s + m.x, 0) / mods.length, z: mods.reduce((s, m) => s + m.z, 0) / mods.length });

for (const k of F) document.getElementById(k).addEventListener('change', () => {
  const mods = selected(), m = mods[0]; if (!m) return;
  snapshot();
  if (mods.length === 1) { m.w = num('w'); m.h = num('h'); m.d = num('d'); }
  const dx = num('x') - m.x, dz = num('z') - m.z, dy = num('y0') - (m.y - m.h / 2 - state.floorY), dr = num('r') - (m.rotY || 0);
  for (const q of mods) { q.x += dx; q.z += dz; q.y += dy; }
  if (mods.length === 1) m.y = state.floorY + num('y0') + m.h / 2;
  if (dr) { const c = centroid(mods); rotateAround(mods, dr, c.x, c.z); }
  if (k === 'c' || k === 'cn') for (const q of mods) { q.color = document.getElementById('c').value; q.colorName = document.getElementById('cn').value.trim(); }
  select(state.sel);
});
for (const k of O) document.getElementById('o_' + k).addEventListener('change', () => {
  const mods = selected(); if (!mods.length) return;
  snapshot();
  const el = document.getElementById('o_' + k), v = el.tagName === 'SELECT' ? el.value : Number(el.value) || 0;
  for (const m of mods) {
    const old = (m.opts || {}).plinth;
    m.opts = { ...DEF_OPTS, ...(m.opts || {}), [k]: v };
    if (k === 'shelves') delete m.opts.shelvesAt;   // число полок поменяли руками — расставляем равномерно
    if (k === 'plinth' && ['base','drawers','sink','tall'].includes(m.type)) m.y += v - (old ?? DEF_OPTS.plinth);
  }
  select(state.sel);
});

const $ = id => document.getElementById(id);
$('addSel').onchange = e => { if (e.target.value) add(e.target.value); e.target.value = ''; };
$('undo').onclick = () => { const s = undoStack.pop(); if (s) { state.modules = JSON.parse(s); select(state.sel.filter(byCode)); } };

  msg(state.move ? 'Тяни выбранный модуль пальцем' : ''); };

$('dup').onclick = () => {
  const mods = selected(); if (!mods.length) return; snapshot();
  const span = Math.max(...mods.map(m => m.w)), c = [];
  const g = mods[0].group ? nextGroup() : undefined;
  for (const m of mods) {
    const a = (m.rotY || 0) * Math.PI / 180;
    const q = JSON.parse(JSON.stringify(m));
    q.code = nextCode(m.code.replace(/\d+$/, '')); q.group = g;
    q.x = Math.round(m.x + Math.cos(a) * span); q.z = Math.round(m.z - Math.sin(a) * span);
    state.modules.push(q); c.push(q.code);
  }
  select(c);
};
$('mirror').onclick = () => {   // зеркально по ширине выбранного: петли и порядок модулей
  const mods = selected(); if (!mods.length) return; snapshot();
  const c = centroid(mods), a = (mods[0].rotY || 0) * Math.PI / 180, ax = Math.cos(a), az = -Math.sin(a);
  for (const m of mods) {
    const t = (m.x - c.x) * ax + (m.z - c.z) * az;
    m.x = Math.round(m.x - 2 * t * ax); m.z = Math.round(m.z - 2 * t * az);
    if (m.opts) m.opts.hinge = m.opts.hinge === 'R' ? 'L' : 'R';
  }
  select(state.sel);
};
function nextGroup() { let n = 1; while (state.modules.some(m => m.group === 'Г' + n)) n++; return 'Г' + n; }
$('group').onclick = () => {
  const mods = selected(); if (mods.length < 2) { msg('Выбери несколько модулей («Выбор нескольких»)'); return; }

};

// Столешница поверх выбранных нижних модулей
$('top2').onclick = () => {
  const mods = selected().filter(m => m.type !== 'countertop' && m.type !== 'wall' && m.type !== 'shelf');
  if (!mods.length) { msg('Выбери нижние модули'); return; }
  snapshot();
  const r = mods[0].rotY || 0, a = r * Math.PI / 180, ux = Math.cos(a), uz = -Math.sin(a), nx = Math.sin(a), nz = Math.cos(a);
  let lo = Infinity, hi = -Infinity, back = Infinity, topY = -Infinity;
  for (const m of mods) {
    const u = m.x * ux + m.z * uz, n = m.x * nx + m.z * nz;
    lo = Math.min(lo, u - m.w / 2); hi = Math.max(hi, u + m.w / 2); back = Math.min(back, n - m.d / 2); topY = Math.max(topY, m.y + m.h / 2);
  }
  const d = 600, h = 38, cu = (lo + hi) / 2, cn = back + d / 2;
  const t = { code:nextCode('Ст'), name:'Столешница', type:'countertop', w:Math.round(hi - lo), h, d,
    x:Math.round(cu * ux + cn * nx), z:Math.round(cu * uz + cn * nz), y:topY + h / 2, rotY:r,
    color:'#cfc6b8', colorName:'', opts:{ ...DEF_OPTS, doors:0 }, group:mods[0].group };
  state.modules.push(t); select([t.code]);
};

// К стене: развернуть фасадом в комнату и прижать задней стороной к ближайшей стене
$('snap').onclick = () => {
  const mods = selected(), walls = state.walls.filter(s => s.kind === 'wall');
  if (!mods.length) return;
  if (!walls.length) { msg('В скане нет стен RoomPlan'); return; }
  snapshot();
  const c = centroid(mods);
  const room = walls.reduce((s, w) => ({ x:s.x + w.transform[12] * 1000 / walls.length, z:s.z + w.transform[14] * 1000 / walls.length }), { x:0, z:0 });
  let best = null;
  for (const w of walls) {
    const ox = w.transform[12] * 1000, oz = w.transform[14] * 1000;
    let nx = w.transform[8], nz = w.transform[10]; const l = Math.hypot(nx, nz) || 1; nx /= l; nz /= l;
    if ((room.x - ox) * nx + (room.z - oz) * nz < 0) { nx = -nx; nz = -nz; }
    const dist = Math.abs((c.x - ox) * nx + (c.z - oz) * nz);
    if (!best || dist < best.dist) best = { ox, oz, nx, nz, dist, code:w.code };
  }
  const target = Math.atan2(best.nx, best.nz) * 180 / Math.PI;
  rotateAround(mods, target - (mods[0].rotY || 0), c.x, c.z);
  const gap = Math.min(...mods.map(m => (m.x - best.ox) * best.nx + (m.z - best.oz) * best.nz - m.d / 2));
  for (const m of mods) { m.x = Math.round(m.x - gap * best.nx); m.z = Math.round(m.z - gap * best.nz); }
  msg(`Прижато к стене ${best.code}`); select(state.sel);
};

// ===== Фальш-панели и крепёж =====
const MOUNTS = { rebro:'ребро ЛДСП + уголки', ugolok:'мебельные уголки', brusok:'брусок 20×40' };
/// Крепёж для фальш-панели: шаг крепления ~400 мм, минимум 2 точки.
function hardware(m) {
  const o = { ...DEF_OPTS, ...(m.opts || {}) };
  const L = o.side === 'top' ? m.w : m.h, n = Math.max(2, Math.ceil(L / 400) + 1);
  const where = o.side === 'top' ? 'к крыше корпуса' : 'к боковине корпуса';
  if (o.mount === 'ugolok') return [
    [`Уголок мебельный 30×30 (${where})`, n, 'шт'], ['Саморез 4×16', n * 4, 'шт']];
  if (o.mount === 'brusok') return [
    [`Брусок 20×40, длина ${L} мм (${where})`, 1, 'шт'], ['Саморез 4×40 (брусок → корпус)', n, 'шт'],
    ['Саморез 4×30 (брусок → фальш-панель, сзади)', n, 'шт']];
  return [
    [`Ребро жёсткости ЛДСП ${L}×100×${o.thick} мм`, 1, 'шт'], [`Саморез 4×30 (корпус → ребро, изнутри корпуса)`, n, 'шт'],
    ['Уголок мебельный 30×30 (ребро ↔ фальш-панель)', n, 'шт'], ['Саморез 4×16 к уголкам', n * 4, 'шт']];
}
/// Крепёж в 3D (только в редакторе): ребро/брусок за панелью и уголки по шагу.
function addHardware3D(g, m) {
  const o = { ...DEF_OPTS, ...(m.opts || {}) }, W = m.w / 1000, H = m.h / 1000, D = m.d / 1000;
  const top = o.side === 'top', L = top ? W : H, n = Math.max(2, Math.ceil(L * 1000 / 400) + 1);
  const grey = new THREE.MeshStandardMaterial({ color:0x8a8f96, metalness:0.3, roughness:0.6 });
  const wood = new THREE.MeshStandardMaterial({ color:0xc9a36b });
  const back = -D / 2;
  if (o.mount === 'rebro' || o.mount === 'brusok') {
    const w2 = o.mount === 'rebro' ? 0.1 : 0.04, t2 = o.mount === 'rebro' ? (o.thick || 16) / 1000 : 0.02;
    const r = new THREE.Mesh(top ? new THREE.BoxGeometry(W, t2, w2) : new THREE.BoxGeometry(t2, H, w2), o.mount === 'rebro' ? new THREE.MeshStandardMaterial({ color:m.color }) : wood);
    if (top) r.position.set(0, -H / 2 + t2 / 2, back - w2 / 2); else r.position.set(o.side === 'right' ? -W / 2 + t2 / 2 : W / 2 - t2 / 2, 0, back - w2 / 2);
    g.add(r);
  }
  if (o.mount !== 'brusok') for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0 : -L / 2 + 0.05 + (L - 0.1) * i / (n - 1);
    const u = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.03), grey);
    if (top) u.position.set(t, -H / 2 + 0.035, back - 0.02); else u.position.set(0, t, back - 0.02);
    g.add(u);
  }
}

/// Фальш-панели к выбранным модулям: сверху до потолка и по бокам до стен (по стенам RoomPlan).
$('fill').onclick = () => {
  const mods = selected().filter(m => m.type !== 'filler' && m.type !== 'countertop');
  if (!mods.length) { msg('Выбери модули (шкаф, пеналы, верхние)'); return; }
  const walls = state.walls.filter(s => s.kind === 'wall');
  if (!walls.length) { msg('Нужны стены из скана RoomPlan'); return; }
  const o0 = { ...DEF_OPTS, ...(mods[0].opts || {}) }, th = o0.thick || 16;
  const r = mods[0].rotY || 0, a = r * Math.PI / 180, ux = Math.cos(a), uz = -Math.sin(a), nx = Math.sin(a), nz = Math.cos(a);
  let lo = Infinity, hi = -Infinity, front = -Infinity, topY = -Infinity, botY = Infinity;
  for (const m of mods) {
    const u = m.x * ux + m.z * uz, n = m.x * nx + m.z * nz;
    lo = Math.min(lo, u - m.w / 2); hi = Math.max(hi, u + m.w / 2); front = Math.max(front, n + m.d / 2);
    topY = Math.max(topY, m.y + m.h / 2); botY = Math.min(botY, m.y - m.h / 2);
  }
  const ceil = state.floorY + Math.max(...walls.map(s => s.heightMm));
  const at = (u, n) => ({ x:Math.round(u * ux + n * nx), z:Math.round(u * uz + n * nz) });
  const made = [], notes = [];
  snapshot();
  const mk = (side, w, h, u, y) => {
    const p = at(u, front - th / 2);
    const f = { code:nextCode('Ф'), name:'Фальш-панель', type:'filler', w:Math.round(w), h:Math.round(h), d:th,
      x:p.x, z:p.z, y:Math.round(y), rotY:r, color:mods[0].color, colorName:mods[0].colorName || '',
      opts:{ ...DEF_OPTS, doors:0, side, mount:o0.mount, thick:th }, group:mods[0].group };
    state.modules.push(f); made.push(f.code);
  };
  // верх: до потолка с зазором
  const gapTop = ceil - topY - (o0.gapTop ?? 3);
  if (gapTop >= 10) mk('top', hi - lo, gapTop, (lo + hi) / 2, topY + gapTop / 2);
  else notes.push(gapTop < 0 ? 'выше потолка!' : 'до потолка <10 мм');
  const fullTop = gapTop >= 10 ? topY + gapTop : topY;
  // бока: стены, перпендикулярные ряду модулей
  for (const [dir, end, side] of [[-1, lo, 'left'], [1, hi, 'right']]) {
    const pu = end, pn = front - th / 2, px = pu * ux + pn * nx, pz = pu * uz + pn * nz;
    let best = null;
    for (const w of walls) {
      let wnx = w.transform[8], wnz = w.transform[10]; const l = Math.hypot(wnx, wnz) || 1; wnx /= l; wnz /= l;
      if (Math.abs(wnx * ux + wnz * uz) < 0.9) continue;            // стена не поперёк ряда
      const ox = w.transform[12] * 1000, oz = w.transform[14] * 1000;
      const ax = w.transform[0], az = w.transform[2], al = Math.hypot(ax, az) || 1;
      if (Math.abs(((px - ox) * ax + (pz - oz) * az) / al) > w.widthMm / 2 + 50) continue;   // мимо стены
      const t = ((ox - px) * ux + (oz - pz) * uz) * dir;
      if (t > -5 && (!best || t < best.t)) best = { t, code:w.code };
    }
    if (!best) continue;
    const gap = best.t - (o0.gapSide ?? 2);
    if (gap < 10) continue;
    if (gap > 300) { notes.push(`${side === 'left' ? 'слева' : 'справа'} до ${best.code} ${Math.round(best.t)} мм — много для фальш-панели`); continue; }
    mk(side, gap, fullTop - botY, end + dir * gap / 2, (fullTop + botY) / 2);
  }
  select(made.length ? made : state.sel);
  msg((made.length ? `Добавлено: ${made.join(', ')}` : 'Фальш-панели не нужны') + (notes.length ? ' · ' + notes.join('; ') : ''), 4500);
};

// касание — выбрать; в режиме «Двигать» — тащить по полу
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null, drag = null;
const setPtr = e => { ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ptr, camera); };
const hitCode = () => { const h = ray.intersectObjects(modGroup.children, true).find(i => i.object.userData.code && !i.object.userData.shell); return h && h.object.userData.code; };
const hitSlide = () => { const h = ray.intersectObjects(modGroup.children, true).find(i => i.object.userData.code && !i.object.userData.shell && i.object.isMesh); return h && h.object.userData.slideKey; };
function toggleSlide(key, to) { const s = SLIDE[key] || (SLIDE[key] = { v:0, t:0 }); s.t = to ?? (s.t ? 0 : 1); }
renderer.domElement.addEventListener('pointerdown', e => {
  down = [e.clientX, e.clientY];
  if (!state.move) return;
  setPtr(e); const code = hitCode();
  if (code && state.sel.includes(code)) {
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -state.floorY / 1000), p = new THREE.Vector3();
    if (ray.ray.intersectPlane(plane, p)) { snapshot(); drag = { plane, start:p.clone(), orig:selected().map(m => [m.x, m.z]) }; controls.enabled = false; }
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return; setPtr(e); const p = new THREE.Vector3();
  if (!ray.ray.intersectPlane(drag.plane, p)) return;
  const dx = snapV((p.x - drag.start.x) * 1000), dz = snapV((p.z - drag.start.z) * 1000);
  selected().forEach((m, i) => { m.x = drag.orig[i][0] + dx; m.z = drag.orig[i][1] + dz; });
  draw();
});
renderer.domElement.addEventListener('pointerup', e => {
  if (drag) { drag = null; controls.enabled = true; select(state.sel); return; }
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  setPtr(e); const code = hitCode(), sk = hitSlide();
  if (sk) toggleSlide(sk);
  if (code) pick(code); else if (!state.multi) select([]);
});

const PALETTE = [['Белый W1100','#f4f3ef'],['Кашемир U702','#d8cfc2'],['Серый камень U727','#9c9890'],['Зелёный шалфей U638','#9aa58f'],
  ['Графит U961','#4a4c4e'],['Дуб Кассела','#a07a52'],['Дуб светлый песочный H3309','#cfb38c'],['Дуб натуральный H1145','#b58a5c'],['Дуб тёмный табак H1180','#6b4a32']];

  const mods = state.modules.map(m => ({ code:m.code, name:m.name, type:m.type, w:m.w, h:m.h, d:m.d, x:m.x, y:m.y, z:m.z, rotY:m.rotY || 0,
    color:m.color, colorName:m.colorName || '', opts:{ doors:m.opts?.doors, drawers:m.opts?.drawers, shelves:m.opts?.shelves,
      front:m.opts?.front, hinge:m.opts?.hinge, handle:m.opts?.handle, thick:m.opts?.thick,
      shelvesAt:m.opts?.shelvesAt, shelfColor:m.opts?.shelfColor, shelfName:m.opts?.shelfName, shelfGap:m.opts?.shelfGap, backTh:m.opts?.backTh, backColor:m.opts?.backColor,
      items:(m.opts?.items || []).map(i => ({ kind:i.kind, y:i.y, h:i.h, boxH:i.boxH, boxY:i.boxY, boxW:i.boxW, bottomY:i.bottomY, depth:i.depth, travel:i.travel,

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>Проект ${esc(number)}</title>
<style>html,body{margin:0;height:100%;background:#f3f1ed;color:#222;font:15px -apple-system,system-ui,sans-serif}

h1{font-size:17px;margin:4px 0 8px}.m{border:1px solid #e3e0da;border-radius:12px;padding:10px;margin-bottom:8px}.m.on{border-color:#e08a00}

<body><div id="v"></div><div id="p"><h1>${esc(title)}</h1><div id="list"></div></div>
<script src="/mebel/_lib/three.min.js"><\/script><script src="/mebel/_lib/OrbitControls.js"><\/script>
<script>
const MODS=${JSON.stringify(mods)};const WALLS=${JSON.stringify(walls)};const PAL=${JSON.stringify(PALETTE)};
${labelSprite.toString()}
const SLIDE={};
${panelMat.toString()}
${buildItem.toString()}
${stepSlides.toString()}
${buildModule.toString()}
${buildRoom.toString()}
const T=THREE,v=document.getElementById('v'),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));v.appendChild(r.domElement);
const sc=new T.Scene();sc.background=new T.Color(0xf3f1ed);const cam=new T.PerspectiveCamera(50,1,0.05,100);
const ctl=new T.OrbitControls(cam,r.domElement);ctl.enableDamping=true;
sc.add(new T.HemisphereLight(0xfffaf2,0x9a9288,1.05));const L=new T.DirectionalLight(0xffffff,0.8);L.position.set(3,6,4);sc.add(L);const L2=new T.DirectionalLight(0xffffff,0.35);L2.position.set(-3,2,5);sc.add(L2);
sc.add(buildRoom(T,WALLS));const G=new T.Group();sc.add(G);let sel=null;
const key=c=>'p_${esc(number)}_'+c;
function load(m){try{const s=JSON.parse(localStorage.getItem(key(m.code))||'null');if(s){m.color=s.color;m.colorName=s.name;}}catch(e){}}
function keep(m){try{localStorage.setItem(key(m.code),JSON.stringify({color:m.color,name:m.colorName}));}catch(e){}}
MODS.forEach(load);
function draw(){G.clear();MODS.forEach(m=>G.add(buildModule(T,m,m.code===sel)));list();}
function list(){const el=document.getElementById('list');el.innerHTML='';MODS.forEach(m=>{const d=document.createElement('div');d.className='m'+(m.code===sel?' on':'');
d.innerHTML='<div class="t">'+m.code+' · '+m.name+'</div><div class="s">'+m.w+' × '+m.h+' × '+m.d+' мм · '+(m.colorName||'цвет')+'</div>';
const p=document.createElement('div');p.className='pal';PAL.forEach(([n,c])=>{const b=document.createElement('button');b.style.background=c;b.title=n;
b.onclick=e=>{e.stopPropagation();m.color=c;m.colorName=n;keep(m);sel=m.code;draw();};p.appendChild(b);});d.appendChild(p);

const [ci,ti]=o.querySelectorAll('input');ci.oninput=()=>{m.color=ci.value;m.colorName=ti.value||'свой цвет';keep(m);draw();};
ti.onchange=()=>{m.colorName=ti.value||'свой цвет';keep(m);draw();};o.onclick=e=>e.stopPropagation();d.appendChild(o);
d.onclick=()=>{sel=m.code;draw();};el.appendChild(d);});}
const box=new T.Box3();MODS.forEach(m=>box.expandByPoint(new T.Vector3(m.x/1000,m.y/1000,m.z/1000)));WALLS.forEach(w=>box.expandByPoint(new T.Vector3(w.transform[12],w.transform[13],w.transform[14])));
const c=box.isEmpty()?new T.Vector3():box.getCenter(new T.Vector3());ctl.target.copy(c);cam.position.set(c.x+2.5,c.y+2,c.z+3);
function rs(){const w=v.clientWidth,h=v.clientHeight;r.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}addEventListener('resize',rs);rs();
(function f(){requestAnimationFrame(f);stepSlides(G);ctl.update();r.render(sc,cam);})();draw();
const KEYS=[];MODS.forEach(m=>(m.opts.items||[]).forEach((_,i)=>KEYS.push(m.code+':'+i)));
if(KEYS.length){const b=document.createElement('button');b.textContent='Выдвинуть ящики';b.style.cssText='position:fixed;top:10px;right:10px;padding:8px 12px;border-radius:10px;border:1px solid #ccc;background:#fff;font:inherit;font-weight:600';
b.onclick=()=>{const o=!KEYS.every(k=>SLIDE[k]&&SLIDE[k].t===1);KEYS.forEach(k=>{(SLIDE[k]=SLIDE[k]||{v:0,t:0}).t=o?1:0;});b.textContent=o?'Задвинуть':'Выдвинуть ящики';};document.body.appendChild(b);}
<\/script></body></html>`;
}

// ===== Выдвинуть всё / импорт из Базиса =====
$('slideAll').onclick = () => {
  const keys = []; state.modules.forEach(m => (m.opts?.items || []).forEach((_, i) => keys.push(m.code + ':' + i)));
  if (!keys.length) { msg('Выдвигать нечего'); return; }
  const open = !keys.every(k => SLIDE[k]?.t === 1);
  keys.forEach(k => toggleSlide(k, open ? 1 : 0)); $('slideAll').classList.toggle('on', open);
};
$('bzBtn').onclick = () => $('bzFile').click();
$('bzFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    msg('Открываю ' + f.name + '…', 8000);
    const core = await import('./bazis-core.js');
    const { title, body } = await core.openBytes(new Uint8Array(await f.arrayBuffer()), f.name);
    importProject(core.toProject(body, title));
  } catch (err) { msg('Не удалось: ' + err.message, 5000); }
};
/// Модули из Базиса. Если в скане есть стены — ставим группой в центр вида (дальше «Двигать» / «Поворот»),
/// если стен нет — берём стены «для просмотра» из файла вместе с их координатами.
function importProject(p) {
  snapshot();
  const scanWalls = state.walls.some(s => s.kind === 'wall');
  if (!scanWalls && p.walls.length) { state.walls = p.walls; drawRoom(); }
  let mods = p.modules.map(m => ({ ...m, opts:{ ...DEF_OPTS, ...m.opts } }));
  const taken = new Set(state.modules.map(m => m.code));
  mods.forEach(m => { if (taken.has(m.code)) { let n = 1; while (taken.has(m.code + '.' + n)) n++; m.code = m.code + '.' + n; } taken.add(m.code); });
  const g = mods.length > 1 ? nextGroup() : undefined; mods.forEach(m => m.group = g);
  if (scanWalls) {
    const c = centroid(mods), t = controls.target;
    mods.forEach(m => { m.x = Math.round(m.x - c.x + t.x * 1000); m.z = Math.round(m.z - c.z + t.z * 1000); m.y += state.floorY; });
  }
  state.modules.push(...mods);
  if (!scanWalls && !p.walls.length) { const c = centroid(mods); controls.target.set(c.x / 1000, 1.2, c.z / 1000); camera.position.set(c.x / 1000 + 3, 3, c.z / 1000 + 3); }
  select(mods.map(m => m.code));
  msg(`${p.name}: модулей ${mods.length}` + (scanWalls ? ' — поставь группой к стенам' : ''), 4000);
}
