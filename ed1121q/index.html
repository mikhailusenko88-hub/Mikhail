<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Мебель санузлов 2209</title>
<style>
/* Layout: 3D-сцена, выбор варианта тумбы, карточки модулей; ниже (только у мастера) — расчёт. Акцент — латунь/золото, как фурнитура в визуализациях. */
:root{
  --bg:#eceeed; --surface:#ffffff; --ink:#1f2523; --muted:#5f6764; --line:#d3d8d6;
  --brass:#9a7238; --brass-soft:#f1e8da; --stage:#dfe3e1; --gold:#c9a45c;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151918; --surface:#1e2321; --ink:#e7ebe9; --muted:#9aa39f; --line:#323a37;
  --brass:#d4a866; --brass-soft:#2c261c; --stage:#232927; --gold:#d8b46a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151918; --surface:#1e2321; --ink:#e7ebe9; --muted:#9aa39f; --line:#323a37;
  --brass:#d4a866; --brass-soft:#2c261c; --stage:#232927; --gold:#d8b46a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.55rem;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:.78rem;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.chip b{font-family:var(--f-mono);font-weight:600;color:var(--brass)}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft);box-shadow:inset 0 0 0 1px var(--brass)}
.varbar{display:flex;flex-direction:column;gap:8px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.stage{position:relative;background:var(--stage);border-radius:14px;overflow:hidden;height:min(62vh,520px);min-height:340px;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);background:var(--brass);color:#fff;font:600 13px var(--f-mono);padding:3px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.lbl small{font-weight:400;opacity:.85;margin-left:4px}
.lbl.note{background:rgba(40,45,43,.78);font-weight:400;font-size:11px}
.toolbar{position:absolute;left:10px;bottom:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.tgl{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer}
.tgl[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.hint{position:absolute;top:10px;right:12px;font-size:12px;color:var(--muted)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}
.card,.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.code{font:600 15px var(--f-mono);background:var(--brass);color:#fff;padding:2px 8px;border-radius:6px}
.mat{font-size:13px;color:var(--muted)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.spec dt{color:var(--muted)} .spec dd{margin:0;font-variant-numeric:tabular-nums}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.params label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input[type=number]{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.elev{background:var(--bg);border-radius:10px;padding:8px;overflow-x:auto}
.elev svg{display:block;margin:0 auto;max-width:100%;height:auto}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);padding:6px}
td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
td.c{font-family:var(--f-mono);font-weight:500;color:var(--brass);white-space:nowrap}
tr.tot td{font-weight:700;border-bottom:none;font-size:14px}
tr.sel td{background:var(--brass-soft)}
.hw{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.notes{font-size:13px;color:var(--muted);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.assume{background:var(--brass-soft);border-radius:12px;padding:12px 16px;font-size:13.5px}
.assume ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 18px;margin-top:10px}
.rates label{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;font-size:13px}
.big{display:flex;gap:12px;flex-wrap:wrap}
.big div{background:var(--bg);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;min-width:150px}
.big span{font-size:12px;color:var(--muted)} .big b{font:600 1.3rem var(--f-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Мебель санузлов — квартира 2209</h1>
    <p class="sub">Подвесные тумбы под раковину и шкафы над инсталляциями. Размеры в миллиметрах, модель можно вращать пальцем. Для тумб есть несколько вариантов — переключаются кнопками над моделью.</p>
  </header>


  <div class="tabs" role="group" aria-label="Санузел">
    <button class="tab" id="tab-master" aria-pressed="true" data-room="master">Мастер-санузел</button>
    <button class="tab" id="tab-guest" aria-pressed="false" data-room="guest">Гостевой санузел</button>
  </div>

  <div class="varbar">
    <h3 id="var-title">Варианты тумбы</h3>
    <div class="chips" id="chips" role="group" aria-labelledby="var-title"></div>
  </div>

  <div class="stage" id="stage">
    <div class="labels" id="labels"></div>
    <div class="hint">вращать — пальцем, масштаб — щипком</div>
    <div class="toolbar">
      <button class="tgl" id="t-fronts" aria-pressed="true">Фасады</button>
      <button class="tgl" id="t-xray" aria-pressed="false">Прозрачно</button>
      <button class="tgl" id="t-room" aria-pressed="true">Сантехника</button>
      <button class="tgl" id="t-reset" aria-pressed="false">Вид спереди</button>
    </div>
  </div>

  <section class="mods" id="mods"></section>
</div>

<script src="/mebel/_lib/three.min.js"></script>
<script src="/mebel/_lib/OrbitControls.js"></script>
<script>
const T = 18;

const MATS = {
  oak:     {name:'ЛДСП 18 мм, дуб (декор уточнить по образцу)', cname:'дуб', color:0xa77b52},
  sage:    {name:'ЛДСП 18 мм Egger U638 ST9 «Зелёный шалфей»', cname:'зелёный шалфей', color:0x8b9a87},
  white:   {name:'ЛДСП 18 мм Egger W1100 ST9 «Альпийский белый»', cname:'белый матовый', color:0xf2f1ec},
  graphite:{name:'ЛДСП 18 мм Egger U961 ST2 «Графит чёрный»', cname:'графит', color:0x3a3c3d},
  white16: {name:'ЛДСП 16 мм белая (ящики)', cname:'белый', color:0xeeeeea},
  hdf:     {name:'ХДФ 3 мм белая', cname:'белый', color:0xe9e9e6}
};

const slots = [
  {slot:'М1', room:'master', type:'vanity', W:740, H:450, D:460, z0:380, sel:0, variants:[
    {v:'А', title:'Дуб, 1 ящик', tag:'как на визуализации', mat:'oak', front:'drawer1', open:'tipon'},
    {v:'Б', title:'Белая, 2 ящика', tag:'верхний ящик неглубокий', mat:'white', front:'drawer2', open:'tipon'},
    {v:'В', title:'Графит, 1 ящик, боковины дуб', tag:'контрастный', mat:'graphite', sideMat:'oak', front:'drawer1', open:'tipon'},
  ]},
  {slot:'М2', room:'master', type:'tall', W:700, D:250, z0:1150, ceil:2600, sel:0, variants:[
    {v:'', title:'Шкаф над инсталляцией, 2 двери', mat:'oak', front:'doors', open:'tipon'}]},
  {slot:'Г1', room:'guest', type:'vanity', W:800, H:450, D:460, z0:380, sel:0, variants:[
    {v:'А', title:'Шалфей, 2 двери, золотой профиль', tag:'как на визуализации', mat:'sage', front:'doors', open:'gola'},
    {v:'Б', title:'Шалфей, 2 ящика, золотой профиль', tag:'удобнее доставать', mat:'sage', front:'drawer2', open:'gola'},
    {v:'В', title:'Белая, 2 ящика, золотой профиль', tag:'светлый вариант', mat:'white', front:'drawer2', open:'gola'},
  ]},
  {slot:'Г2', room:'guest', type:'tall', W:600, D:250, z0:1150, ceil:2600, sel:0, variants:[
    {v:'', title:'Шкаф над инсталляцией, 2 двери', mat:'sage', front:'doors', open:'tipon'}]},
];

const r1 = v => Math.round(v*10)/10;
const cur = s => s.variants[s.sel];
const code = (s,vr) => s.slot + ((vr||cur(s)).v ? '-'+(vr||cur(s)).v : '');
function hgt(s){ return s.type==='tall' ? s.ceil - 10 - s.z0 : s.H; }
function nShelves(H){ return Math.max(1, Math.round(H/380)-1); }
function hingesPerDoor(h){ return h<=900?2 : h<=1600?3 : 4; }
const openName = o => o==='gola' ? 'золотой профиль-ручка Gola (без ручек)' : 'нажатием, без ручек';

/* Раскладка фасадов: y от низа модуля. gold — полосы профиля. */
function layout(s, vr){
  const H=hgt(s), W=s.W, f=[], gold=[];
  const leaves=(y0,y1)=>{const dw=(W-7)/2; f.push({x0:2,x1:2+dw,y0,y1,k:'door'},{x0:W-2-dw,x1:W-2,y0,y1,k:'door'});};
  if(s.type==='tall'){ leaves(2,H-2); return {f,gold}; }
  if(vr.open==='gola'){
    gold.push({y0:H-32,y1:H-4,t:'L'});
    if(vr.front==='doors') leaves(2,H-34);
    else if(vr.front==='drawer2'){ f.push({x0:2,x1:W-2,y0:2,y1:238,k:'drawer',box:160},{x0:2,x1:W-2,y0:276,y1:H-34,k:'drawer',box:90}); gold.push({y0:242,y1:272,t:'C'}); }
    else f.push({x0:2,x1:W-2,y0:2,y1:H-34,k:'drawer',box:160});
  } else {
    if(vr.front==='doors') leaves(2,H-2);
    else if(vr.front==='drawer2') f.push({x0:2,x1:W-2,y0:2,y1:300,k:'drawer',box:180},{x0:2,x1:W-2,y0:303,y1:H-2,k:'drawer',box:90});
    else f.push({x0:2,x1:W-2,y0:2,y1:H-2,k:'drawer',box:140});
  }
  return {f,gold};
}

/* ---------- 2D схема фасада ---------- */
function elevation(s, vr){
  const H=hgt(s), W=s.W, k=Math.min(220/H, 260/W), w=W*k, h=H*k, ox=46, oy=18, vw=w+ox+20, vh=h+oy+44;
  const col='var(--ink)', mut='var(--muted)', X=x=>ox+x*k, Y=y=>oy+h-y*k;
  const L=layout(s,vr), out=[`<svg viewBox="0 0 ${vw} ${vh}" width="${vw}" height="${vh}" role="img" aria-label="Схема ${code(s,vr)}">`];
  out.push(`<rect x="${ox}" y="${oy}" width="${w}" height="${h}" fill="none" stroke="${mut}" stroke-width="1"/>`);
  L.gold.forEach(g=>out.push(`<rect x="${X(T)}" y="${Y(g.y1)}" width="${(W-2*T)*k}" height="${(g.y1-g.y0)*k}" fill="var(--gold)"/>`));
  L.f.forEach(fr=>out.push(`<rect x="${X(fr.x0)}" y="${Y(fr.y1)}" width="${(fr.x1-fr.x0)*k}" height="${(fr.y1-fr.y0)*k}" fill="none" stroke="${col}" stroke-width="1.5"/>`));
  if(s.type==='tall'){ const ns=nShelves(H); for(let i=1;i<=ns;i++){const y=Y(H*i/(ns+1)); out.push(`<line x1="${ox+4}" y1="${y}" x2="${ox+w-4}" y2="${y}" stroke="${mut}" stroke-dasharray="5 3"/>`);} }
  // размеры
  out.push(`<line x1="${ox}" y1="${oy+h+14}" x2="${ox+w}" y2="${oy+h+14}" stroke="${mut}"/><line x1="${ox}" y1="${oy+h+9}" x2="${ox}" y2="${oy+h+19}" stroke="${mut}"/><line x1="${ox+w}" y1="${oy+h+9}" x2="${ox+w}" y2="${oy+h+19}" stroke="${mut}"/>`);
  out.push(`<text x="${ox+w/2}" y="${oy+h+32}" fill="${col}" font-size="12" text-anchor="middle" font-family="var(--f-mono)">${W}</text>`);
  out.push(`<line x1="${ox-14}" y1="${oy}" x2="${ox-14}" y2="${oy+h}" stroke="${mut}"/><line x1="${ox-19}" y1="${oy}" x2="${ox-9}" y2="${oy}" stroke="${mut}"/><line x1="${ox-19}" y1="${oy+h}" x2="${ox-9}" y2="${oy+h}" stroke="${mut}"/>`);
  out.push(`<text x="${ox-20}" y="${oy+h/2}" fill="${col}" font-size="12" text-anchor="middle" font-family="var(--f-mono)" transform="rotate(-90 ${ox-20} ${oy+h/2})">${H}</text>`);
  out.push('</svg>'); return out.join('');
}

/* ---------- состояние ---------- */
let room='master';
const roomSlots = () => slots.filter(s=>s.room===room);
const INTERNAL = typeof internalCard === 'function';


/* ---------- выбор варианта ---------- */
const chipsEl=document.getElementById('chips');
function renderChips(){
  const s=roomSlots().find(x=>x.variants.length>1);
  chipsEl.innerHTML=s.variants.map((vr,i)=>`<button class="chip" id="chip-${s.slot}-${i}" aria-pressed="${i===s.sel}" data-i="${i}"><b>${code(s,vr)}</b><span>${vr.title}</span>${vr.tag?`<small>${vr.tag}</small>`:''}</button>`).join('');
  chipsEl.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{ s.sel=+b.dataset.i; renderAll(false); }));
}

/* ---------- карточки ---------- */
const modsEl=document.getElementById('mods');
function renderCards(){
  modsEl.innerHTML='';
  roomSlots().forEach(s=>{
    const vr=cur(s), H=hgt(s), card=document.createElement('article'); card.className='card';
    const name = s.type==='tall' ? 'Шкаф над инсталляцией' : 'Тумба под раковину';
    card.innerHTML=`
      <div class="card-head"><span class="code">${code(s)}</span><h2>${name}${s.type==='tall'?'':' — '+vr.title.toLowerCase()}</h2></div>
      <dl class="spec">
        <dt>Размер Ш×В×Г</dt><dd>${s.W} × ${H} × ${s.D} мм</dd>
        <dt>Цвет</dt><dd>${MATS[vr.mat].cname}${vr.sideMat?`, боковины — ${MATS[vr.sideMat].cname}`:''}</dd>
        <dt>${s.type==='tall'?'Двери':'Фасады'}</dt><dd>${layout(s,vr).f.length===2&&layout(s,vr).f[0].k==='door'?'2 двери':layout(s,vr).f.length+' '+(layout(s,vr).f.length>1?'ящика':'ящик')}, открывание ${openName(vr.open)}</dd>
        <dt>Высота от пола</dt><dd>${s.type==='tall'?`низ ${s.z0} мм (на коробе), до потолка`:`низ ${s.z0} мм, верх ${s.z0+H} мм + столешница`}</dd>
      </dl>
      <div class="elev">${elevation(s,vr)}</div>
      ${INTERNAL ? internalCard(s) : ''}`;
    modsEl.appendChild(card);
  });
  modsEl.querySelectorAll('input[data-slot]').forEach(inp=>inp.addEventListener('change',e=>{
    const s=slots.find(x=>x.slot===e.target.dataset.slot), v=parseFloat(e.target.value);
    if(isFinite(v)&&v>0){ s[e.target.dataset.k]=v; renderAll(false); }
  }));
}

/* ---------- 3D ---------- */
const stage=document.getElementById('stage'), labelsEl=document.getElementById('labels');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.05,50);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.52;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f8c,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.55); sun.position.set(1.5,3,3); scene.add(sun);
let group=null, labelDefs=[];
const state={fronts:true,xray:false,room:true};

function boxMesh(x0,y0,z0,x1,y1,z1,color,role,metal){
  const g=new THREE.BoxGeometry(Math.max(.001,(x1-x0)/1000),Math.max(.001,(y1-y0)/1000),Math.max(.001,(z1-z0)/1000));
  const mat=new THREE.MeshStandardMaterial({color,roughness:metal?.32:.75,metalness:metal?.85:0,transparent:true,opacity:1});
  const mesh=new THREE.Mesh(g,mat);
  mesh.position.set((x0+x1)/2000,(y0+y1)/2000,(z0+z1)/2000);
  if(!metal) mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x2b302e,transparent:true,opacity:.35})));
  mesh.userData.role=role; return mesh;
}
function buildModule(s,ox){
  const vr=cur(s), g=new THREE.Group(), H=hgt(s), W=s.W, Dc=s.D-T, col=MATS[vr.mat].color, sc=MATS[vr.sideMat||vr.mat].color, y0=s.z0, L=layout(s,vr);
  const B=(a,b,c,d,e,f,cl,r,m)=>g.add(boxMesh(ox+a,y0+b,c,ox+d,y0+e,f,cl,r,m));
  B(0,0,0,T,H,Dc,sc,'corpus'); B(W-T,0,0,W,H,Dc,sc,'corpus');
  if(s.type==='tall'){
    B(T,0,0,W-T,T,Dc,col,'corpus'); B(T,H-T,0,W-T,H,Dc,col,'corpus');
    const ns=nShelves(H); for(let i=1;i<=ns;i++){const y=H*i/(ns+1); B(T+1,y-T/2,0,W-T-1,y+T/2,Dc-20,col,'corpus');}
    B(2,2,-3,W-2,H-2,0,MATS.hdf.color,'corpus');
  } else {
    B(T,0,0,W-T,T,Dc,col,'corpus'); B(T,H-100,0,W-T,H,T,col,'corpus');
    L.f.filter(f=>f.k==='drawer').forEach(d=>{ const wh=MATS.white16.color, xa=T+5, xb=W-T-5, yb=d.y0+25, bh=d.box, zb=60;
      B(xa,yb,zb,xa+16,yb+bh,Dc-2,wh,'corpus'); B(xb-16,yb,zb,xb,yb+bh,Dc-2,wh,'corpus'); B(xa+16,yb,zb,xb-16,yb+16,Dc-2,wh,'corpus'); });
    const top=boxMesh(ox-5,y0+H,0,ox+W+5,y0+H+20,s.D+10,0xf2efe9,'room'); g.add(top);
    g.add(boxMesh(ox+W/2-200,y0+H+20,120,ox+W/2+200,y0+H+24,s.D-40,0xe6e2da,'room'));
  }
  L.gold.forEach(gd=>{ B(T,gd.y0,Dc-22,W-T,gd.y1,Dc,0xc9a45c,'gold',true); B(T,gd.y1-3,Dc-22,W-T,gd.y1,s.D-4,0xc9a45c,'gold',true); });
  L.f.forEach(fr=>B(fr.x0,fr.y0,Dc,fr.x1,fr.y1,s.D,col,'front'));
  labelDefs.push({p:[ox+W/2,y0+H+(s.type==='tall'?-60:120),s.D+20],t:code(s),s:`${W}×${H}×${s.D}`});
  return g;
}
function buildScene(){
  if(group){scene.remove(group); group.traverse(o=>{o.geometry&&o.geometry.dispose(); o.material&&o.material.dispose();});}
  group=new THREE.Group(); labelDefs=[];
  const rs=roomSlots(), van=rs.find(s=>s.type!=='tall'), tall=rs.find(s=>s.type==='tall');
  const vx=-(van.W+350), wallL=vx-300, wallR=tall.W+500, ceil=tall.ceil;
  group.add(boxMesh(wallL,0,-40,wallR,ceil,-3,0xd9d6d0,'wall'));
  group.add(boxMesh(wallL,-20,-40,wallR,0,1300,0xbfbab2,'wall'));
  group.add(boxMesh(0,0,-3,tall.W,tall.z0,tall.D,0xcfccc6,'room'));
  group.add(boxMesh(tall.W/2-180,360,tall.D,tall.W/2+180,420,tall.D+540,0xf6f6f4,'room'));
  group.add(boxMesh(tall.W/2-120,980,tall.D,tall.W/2+120,1080,tall.D+8,0xc9a45c,'room',true));
  group.add(boxMesh(vx+van.W/2-280,van.z0+van.H+250,-3,vx+van.W/2+280,van.z0+van.H+1250,6,0xc9d3d4,'room'));
  labelDefs.push({p:[tall.W/2,700,tall.D+30],t:'короб инсталляции',note:true});
  labelDefs.push({p:[vx+van.W/2,van.z0+van.H+40,van.D/2],t:'столешница с раковиной',note:true});
  group.add(buildModule(van,vx)); group.add(buildModule(tall,0));
  scene.add(group); applyState(); makeLabels();
}
function applyState(){
  group.traverse(o=>{
    if(!o.isMesh) return; const r=o.userData.role;
    o.visible = r==='front'? state.fronts : r==='room'? state.room : true;
    const op = state.xray && (r==='corpus'||r==='front') ? (r==='front'?0.25:0.45) : 1;
    o.material.opacity=op; o.material.depthWrite=op===1;
  });
  labelDefs.forEach(l=>{ if(l.el && l.note) l.el.hidden=!state.room; });
}
function makeLabels(){
  labelsEl.innerHTML='';
  labelDefs.forEach(l=>{const d=document.createElement('div'); d.className='lbl'+(l.note?' note':''); d.innerHTML=l.t+(l.s?`<small>${l.s}</small>`:''); labelsEl.appendChild(d); l.el=d; if(l.note) d.hidden=!state.room;});
}
const v3=new THREE.Vector3();
function placeLabels(){
  const w=stage.clientWidth,h=stage.clientHeight;
  labelDefs.forEach(l=>{v3.set(l.p[0]/1000,l.p[1]/1000,l.p[2]/1000).project(camera);
    if(v3.z>1){l.el.style.display='none';return;} l.el.style.display='';
    l.el.style.left=((v3.x+1)/2*w)+'px'; l.el.style.top=((1-v3.y)/2*h)+'px';});
}
function resetView(){
  const rs=roomSlots(), van=rs.find(s=>s.type!=='tall'), tall=rs.find(s=>s.type==='tall');
  const cx=((-(van.W+350))+tall.W)/2000, span=(van.W+350+tall.W)/1000+0.6;
  const aspect=stage.clientWidth/Math.max(1,stage.clientHeight);
  const dist=Math.max(span/aspect,2.7)/(2*Math.tan(20*Math.PI/180))*1.05;
  controls.target.set(cx,1.3,0.2); camera.position.set(cx+0.6,1.55,dist+0.2); controls.update();
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
(function loop(){requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); placeLabels();})();

function setToggle(id,key){const b=document.getElementById(id); b.addEventListener('click',()=>{state[key]=!state[key]; b.setAttribute('aria-pressed',state[key]); applyState();});}
setToggle('t-fronts','fronts'); setToggle('t-xray','xray'); setToggle('t-room','room');
document.getElementById('t-reset').addEventListener('click',resetView);
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  room=b.dataset.room; document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderAll(true);
}));
function renderAll(view){
  renderChips(); renderCards(); buildScene(); if(view) resetView();
  if(INTERNAL) renderCalc();
}
if(!INTERNAL){ document.getElementById('t-xray').hidden=true; }
resize(); renderAll(true);
</script>
