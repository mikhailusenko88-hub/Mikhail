name: golos-check
on:
  push:
    branches: [golos]
    paths: [check_request.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: golos-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
            ~/.cache/torch
          key: golos-check-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth openai-whisper ruaccent matplotlib
      - name: Speech (ударения, слова, интонация, естественность)
        run: python voice_check.py
      - name: Sounds (смех, звуки зверей)
        run: python sound_check.py
      - name: Commit result
        if: always()
        run: |
          git config user.name golos
          git config user.email golos@users.noreply.github.com
          mkdir -p /tmp/res && cp -r out /tmp/res/ 2>/dev/null || true; cp -r snd_out /tmp/res/ 2>/dev/null || true
          for i in 1 2 3 4 5 6; do
            git fetch -q origin golos && git reset -q --hard origin/golos
            mkdir -p out snd_out && cp -r /tmp/res/out/. out/ 2>/dev/null || true; cp -r /tmp/res/snd_out/. snd_out/ 2>/dev/null || true
            python - <<'PY'
          import glob, json
          rows = ["| файл | голос | UTMOS | слова | ошибки ударений (+возможные) | интонация |", "|---|---|---|---|---|---|"]
          for jp in sorted(glob.glob("out/*.json")):
              try: r = json.load(open(jp, encoding="utf-8"))
              except Exception: continue
              if not isinstance(r, dict) or "name" not in r: continue
              it = r.get("intonation", [])
              rows.append(f"| {r['name']} | {r.get('voice', '')} | {r.get('utmos', '—')} | {r.get('match', '—')} | {r.get('stress_errors', '—')} (+{r.get('stress_maybe', 0)}) | {sum(1 for s in it if s['ok'])}/{len(it)} |")
          open("out/summary.md", "w", encoding="utf-8").write("\n".join(rows) + "\n")
          PY
            git add -A out snd_out 2>/dev/null || true
            git commit -qm "golos-check: результат" || { echo nothing; break; }
            git push -q origin HEAD:golos && break
            sleep $((RANDOM % 15 + 5))
          done
