name: svoy-kot2
# «Кот Барсик», круг 2: слова на стыке — эталоны и варианты, чистая проба
on:
  push:
    branches: [svoy-golos]
    paths: ['svoy-kot2-request.txt', 'svoy_kot2.py', '.github/workflows/svoy-kot2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: svoy-kot2
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        job: [V4, F1, F2, F3, RK, RC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
            ~/.cache/torch
            models
          key: svoy-free-cache-v1
          restore-keys: svoy2-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth openai-whisper ruaccent matplotlib edge-tts
      - run: python svoy_kot2.py gen ${{ matrix.job }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: K2-${{ matrix.job }}
          path: pack/
          retention-days: 7
  final:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'K2-*'
          merge-multiple: true
          path: pack/
      - name: Итог
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy
          python svoy_kot2.py final
          ls -la cast8
      - name: Commit
        if: always()
        timeout-minutes: 5
        run: |
          git config user.name svoy-golos
          git config user.email svoy-golos@users.noreply.github.com
          git add -A cast8
          git commit -m "svoy-kot2 result" || echo nothing
          for i in 1 2 3; do git fetch -q origin svoy-golos && git rebase -q FETCH_HEAD && git push origin HEAD:svoy-golos && break; sleep 5; done
