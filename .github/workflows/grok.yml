name: barsik-grok
on:
  push:
    branches: [blender-test]
    paths: [grok.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: barsik-grok
  cancel-in-progress: false
jobs:
  grok:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Grok Imagine
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 grok.py
      - name: Commit result
        if: always()
        run: |
          git config user.name render-bot
          git config user.email render-bot@users.noreply.github.com
          git add out/grok
          git commit -m "grok result" || echo nothing
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 5; done
