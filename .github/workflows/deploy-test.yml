name: pochemu-albina-deploy-test
# Проверка установки целиком, как на сервере: служба multik-tts (setup.sh из mebel-3d) + deploy_albina.sh
on:
  push:
    branches: [pochemu-albina]
    paths: ['deploy_albina.sh', 'request-deploy.txt', '.github/workflows/deploy-test.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pochemu-albina-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Бот «Почему так?» (копия кода)
        run: |
          B=/tmp/root/root/pochemu-bot; R=https://raw.githubusercontent.com/mikhailusenko88-hub/Mikhail/kz-bot
          sudo mkdir -p $B/fonts $B/music /tmp/www && sudo chown -R $USER /tmp/root /tmp/www
          for f in make_video.py run_daily.py fonts/DejaVuSans-Bold.ttf music/lofi_01_Vecherniy_chay.mp3; do curl -fsSL -o $B/$f $R/$f; done
          python3 - $B <<'PY'
          import json, sys
          b = sys.argv[1]
          sc = json.load(open("test/scripts.json", encoding="utf-8"))
          json.dump([{k: v for k, v in s.items() if k != "name"} for s in sc], open(b + "/topics.json", "w", encoding="utf-8"), ensure_ascii=False)
          cfg = {"topic": "Почему так?", "formats": ["Как это работает", "Миф или правда", "Загадка", "Топ-3"],
                 "channel_handle": "@pochemu_tak_fakty", "voices": ["ru-RU-DmitryNeural"], "voice_rate": "+0%",
                 "post_to_vk": False, "post_to_youtube": False, "use_ai": False, "use_stock_video": False,
                 "music_volume": 0.15, "web_page": True, "web_root": "/tmp/www", "web_base_url": "http://89.207.252.121:8080",
                 "lang": "ru", "bank_file": "topics.json"}
          json.dump(cfg, open(b + "/config.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          echo testkey > $B/.web_key && mkdir -p /tmp/www/klipy-testkey
          sudo pip install -q --break-system-packages pillow edge-tts requests
      - name: deploy_albina.sh (сервер с 1 ГБ памяти — голос из GitHub)
        run: |
          E="SEARCH_ROOT=/tmp/root ALBINA_RAW=file://$PWD ALBINA_VOICE_RAW=file:///tmp/voice ALBINA_LOCAL_MIN_MB=999999"
          echo "$E" > /tmp/env.txt
          sudo env $E bash deploy_albina.sh 2>&1 | tee /tmp/deploy.log
          grep -q "ГОТОВО" /tmp/deploy.log
          grep -q "нет готовой озвучки" /tmp/deploy.log
          ls -la /tmp/www/albina/
      - name: Озвучка заранее (как в voice-farm)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          sudo mkdir -p /opt/multik-tts && sudo chown $USER /opt/multik-tts
          python3 -m venv /opt/multik-tts/venv
          /opt/multik-tts/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /opt/multik-tts/venv/bin/pip install -q numpy ruaccent
          curl -fsSL -o /opt/multik-tts/v5_cis_base.pt https://models.silero.ai/models/tts/ru/v5_cis_base.pt
          curl -fsSL -o /opt/multik-tts/server.py https://raw.githubusercontent.com/mikhailusenko88-hub/Mikhail/mebel-3d/tools/multik/tts/server.py
          python3 patch_server.py /opt/multik-tts/server.py && cp albina_worker.py /opt/multik-tts/
          ALBINA_NO_GH=1 python3 farm.py /tmp/www/albina/bank.json /tmp/voice | tee /tmp/farm.log
          ALBINA_NO_GH=1 python3 farm.py /tmp/www/albina/bank.json /tmp/voice | grep "новых"
      - name: Пробный ролик с готовой озвучкой, back, on
        run: |
          E=$(cat /tmp/env.txt)
          sudo env $E bash deploy_albina.sh test 2>&1 | tee /tmp/deploy2.log
          grep -q "Озвучка: Альбина (готовая, из GitHub)" /tmp/deploy2.log
          sudo env $E bash deploy_albina.sh 2>&1 | grep -E "уже|ГОТОВО|!!|Готовая" | tee -a /tmp/deploy2.log
          sudo env $E bash deploy_albina.sh back | tail -2 | tee -a /tmp/deploy2.log
          sudo env $E bash deploy_albina.sh on | tail -2 | tee -a /tmp/deploy2.log
          cat /tmp/farm.log >> /tmp/deploy2.log
      - name: Отчёт в ветку
        if: always()
        run: |
          mkdir -p result; cp /tmp/deploy.log result/deploy_log.txt 2>/dev/null || true; cp /tmp/deploy2.log result/deploy2_log.txt 2>/dev/null || true
          cp /tmp/www/klipy-testkey/proba-albina.mp4 result/deploy_proba.mp4 2>/dev/null || true
          git config user.name albina-test
          git config user.email albina-test@users.noreply.github.com
          git add result && git commit -m "albina deploy test result" || echo nothing
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
