name: laugh-collect
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'id запуска laugh-bank, чьи результаты забрать'
        required: true
      name:
        description: 'имя артефакта'
        default: 'laugh-out'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: bank/${{ inputs.run_id }}/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name laugh-bank
          git config user.email laugh-bank@users.noreply.github.com
          du -sh bank/${{ inputs.run_id }} || true
          git add bank
          git commit -m "laugh-collect ${{ inputs.run_id }}" || echo nothing
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
