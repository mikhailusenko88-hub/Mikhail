name: dns-ru
# Бесплатные DDNS из России: резолвятся ли имена и открываются ли сайты. Список — dns.txt, отчёт — status/dns.txt
on:
  push:
    branches: [srv-check]
    paths: ['dns.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p status && python3 srv/dns_ru.py > status/dns.txt 2>&1; cat status/dns.txt
      - run: |
          git config user.name "srv-check"; git config user.email "srv-check@users.noreply.github.com"
          git add status; git commit -m "dns status" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin srv-check && git push -q origin HEAD:srv-check && break; sleep 5; done
