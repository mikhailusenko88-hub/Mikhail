name: tts-demo
on:
  push:
    branches: [tts-test]
    paths: [request.txt, tts_demo2.py, .github/workflows/tts.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q edge-tts numpy pyyaml openai-whisper
      - name: Synthesize and score
        run: python tts_demo2.py
      - name: Commit result
        if: always()
        run: |
          git config user.name tts-bot
          git config user.email tts-bot@users.noreply.github.com
          git add out2 || true
          git commit -m "tts demo 2 result" || echo nothing
          git push
