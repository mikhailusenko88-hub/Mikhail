name: search-check
# Где nashdekor.ru виден в поиске (Яндекс, Google, Bing, DDG, Рамблер, Mail.ru, Brave, Startpage, Карты, 2ГИС).
# Запуск — изменение search-check.txt в ветке domain-check или вручную. Результат — status/search.md и status/search/
on:
  push:
    branches: [domain-check]
    paths: ['search-check.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: search-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright (браузер Chrome уже есть на раннере)
        run: pip install -q playwright && (google-chrome --version || npx -y playwright install --with-deps chrome)
      - name: Проверить выдачу
        run: python search_check.py
      - name: Сохранить результат
        if: always()
        run: |
          git config user.name "search-check"
          git config user.email "search-check@users.noreply.github.com"
          git add status
          git commit -m "search $(date -u +%F_%H:%M)" || exit 0
          for i in 1 2 3; do git pull --rebase origin domain-check && git push origin HEAD:domain-check && break; sleep 5; done
