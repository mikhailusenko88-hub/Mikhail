name: dub-sluh
# Слух дубляжа «для носителя» (26.11): естественность (UTMOS) источник → перекраска → итог, мелодия вопросов, разборчивость.
# Запуск — строки в sluh-request.txt: «<сборка> <язык> [сколько реплик | q | pik | pre]» (q, pik, pre — пробы улучшений, dub_sluh_lab.py), каждая строка — отдельное задание. Итог — out_sluh/<сборка>/.
on:
  push:
    branches: [golos-en]
    paths: ['sluh-request.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.r.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          echo "m=$(grep -v '^#' sluh-request.txt | grep -v '^\s*$' | python3 -c 'import sys,json;print(json.dumps([dict(zip(("b","l","n"),(l.split()+["0"])[:3])) for l in sys.stdin]))')" >> $GITHUB_OUTPUT
  sluh:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        j: ${{ fromJson(needs.plan.outputs.m) }}
    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ matrix.j.b }}
      LANG_: ${{ matrix.j.l }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
          key: golos-lab-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" piper-tts speechbrain openai-whisper faster-whisper praat-parselmouth soundfile edge-tts --extra-index-url https://download.pytorch.org/whl/cpu
          python -m spacy download en_core_web_sm -q || true
      - name: Файлы сборки
        run: |
          mkdir -p "tmp_dubsrc/$NAME"
          gh release download "studio-$NAME" -R ${{ github.repository }} -p dub.zip -D "tmp_dubsrc/$NAME" || gh release download "dubsrc-$NAME" -R ${{ github.repository }} -p dub.zip -D "tmp_dubsrc/$NAME"
      - name: Слух
        run: |
          N="${{ matrix.j.n }}"
          if [[ "$N" =~ ^[0-9]+$ ]]; then python dub_sluh.py "$NAME" "$LANG_" "$N"; else python dub_sluh_lab.py "$NAME" "$LANG_" "$N"; fi   # q | pik | pre — пробы улучшений
      - name: В ветку
        if: always()
        run: |
          git config user.name dub; git config user.email dub@users.noreply.github.com
          git add out_sluh/$NAME/$LANG_.md out_sluh/$NAME/$LANG_.json out_sluh/$NAME/pairs_$LANG_.mp3 out_sluh/$NAME/lab_*_$LANG_.* 2>/dev/null || true
          git commit -qm "слух дубляжа $NAME $LANG_ [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
