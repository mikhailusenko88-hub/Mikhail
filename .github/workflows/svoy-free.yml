name: svoy-free
# №4 на свободной модели v5_cis (MIT): №4 — только мерка
on:
  push:
    branches: [svoy-golos]
    paths: ['svoy-free-request.txt', 'svoy_free.py', '.github/workflows/svoy-free.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: svoy-free
  cancel-in-progress: false
jobs:
  r1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
            ~/.cache/torch
            models
          key: svoy-free-cache-v1
          restore-keys: svoy2-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth openai-whisper ruaccent matplotlib edge-tts resemblyzer
      - run: python svoy_free.py r1 ${{ matrix.part }} 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R1-${{ matrix.part }}
          path: pack/
          retention-days: 7
  pick:
    needs: r1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'R1-*'
          merge-multiple: true
          path: pack/
      - run: pip install -q numpy && python svoy_free.py pick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rr2
          path: pack/round2.json
          retention-days: 7
  r2:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: rr2
          path: pack/
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
            ~/.cache/torch
            models
          key: svoy-free-cache-v1
          restore-keys: svoy2-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth openai-whisper ruaccent matplotlib edge-tts resemblyzer
      - run: python svoy_free.py r2 ${{ matrix.part }} 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R2-${{ matrix.part }}
          path: pack/
          retention-days: 7
  final:
    needs: [r1, r2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'R*'
          merge-multiple: true
          path: pack/
      - name: Итог
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy
          python svoy_free.py final
          ls -la cast7
      - name: Commit
        if: always()
        timeout-minutes: 5
        run: |
          git config user.name svoy-golos
          git config user.email svoy-golos@users.noreply.github.com
          git add -A cast7
          git commit -m "svoy-free result" || echo nothing
          for i in 1 2 3; do git fetch -q origin svoy-golos && git rebase -q FETCH_HEAD && git push origin HEAD:svoy-golos && break; sleep 5; done
