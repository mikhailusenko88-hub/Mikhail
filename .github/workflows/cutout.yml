name: foto-cutout
on:
  push:
    branches: [foto-obrazcy]
    paths: [in/**, cutout.py, models.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models-${{ hashFiles('models.txt') }}
      - name: Cut out
        run: |
          pip install -q "rembg[cpu]" pillow numpy 2>&1 | tail -2
          python3 cutout.py 2>&1 | tee cut_log.txt
      - name: Commit
        run: |
          git config user.name "foto-bot"
          git config user.email "foto-bot@users.noreply.github.com"
          git add cut cut_log.txt
          git commit -m "cutout: $(date -u +%F_%H:%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin foto-obrazcy && git push -q origin HEAD:foto-obrazcy && break; sleep 5; done
