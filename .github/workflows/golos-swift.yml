name: golos-swift
# Проверка класса MultikTTS из приложения «Замер 3D» (Sources/MebelView.swift) на Mac: компилируется ли и как звучит (SSML, IPA, обычный текст).
on:
  push:
    branches: [golos]
    paths: [swift_request.txt]
permissions:
  contents: write
jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и голос
        run: |
          swiftc -O app_tts_test.swift -o /tmp/apptts 2>&1 | tee /tmp/build.txt | tail -20
          mkdir -p /tmp/o && perl -e 'alarm 400; exec @ARGV' /tmp/apptts app_jobs.json /tmp/o 2>&1 | tee /tmp/run.txt | tail -30 || true
          mkdir -p /tmp/sv/v && for f in /tmp/o/*.caf; do n=$(basename "$f" .caf); afconvert -f WAVE -d LEI16@24000 -c 1 "$f" /tmp/sv/v/$n.wav 2>/dev/null || echo "не читается: $n"; done
          cp /tmp/build.txt /tmp/run.txt app_jobs.json /tmp/sv/
      - name: В ветку golos-swift-out
        if: always()
        run: |
          cd /tmp/sv && git init -q -b golos-swift-out && git config user.name golos && git config user.email golos@users.noreply.github.com
          git add -A && git commit -qm "MultikTTS из приложения: сборка и голос"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:golos-swift-out
