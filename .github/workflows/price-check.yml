name: price-check
# Снимает текст страниц с ценами (сайты, где цены подгружаются скриптами).
# Запуск — при изменении request.txt в ветке price-check. Результат — status/*.txt
on:
  push:
    branches: [price-check]
    paths: ['request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Браузер
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Снять страницы
        run: python3 price_check.py
      - name: Сохранить результат
        run: |
          git config user.name "price-check"
          git config user.email "price-check@users.noreply.github.com"
          git add status
          git commit -m "result $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin price-check || true
          git push origin HEAD:price-check
