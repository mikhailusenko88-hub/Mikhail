name: mail-check
# Проверка почты и CRM снаружи (DNS, PTR, порты, https). Запуск — изменение mail-check.txt
# в ветке domain-check или вручную. Результат — status/mail.md
on:
  push:
    branches: [domain-check]
    paths: ['mail-check.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mail-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Установить whois и dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq whois dnsutils >/dev/null
      - name: Проверить
        run: bash mail_check.sh
      - name: Сохранить результат
        run: |
          git config user.name "mail-check"
          git config user.email "mail-check@users.noreply.github.com"
          git add status
          git commit -m "mail $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check
