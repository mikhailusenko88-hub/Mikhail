name: svoy-kot3
# Чистая проба: №4 и свободные голоса, короткие слова на стыке вытянуты, вопрос с мелодией — всё одним заданием
on:
  push:
    branches: [svoy-golos]
    paths: ['svoy-kot3-request.txt', 'svoy_kot3.py', '.github/workflows/svoy-kot3.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: svoy-kot3
  cancel-in-progress: false
jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
            ~/.cache/torch
            models
          key: svoy-free-cache-v1
          restore-keys: svoy2-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth openai-whisper ruaccent matplotlib edge-tts
      - run: python svoy_kot3.py
      - name: Commit
        if: always()
        timeout-minutes: 5
        run: |
          git config user.name svoy-golos
          git config user.email svoy-golos@users.noreply.github.com
          git add -A cast8
          git commit -m "svoy-kot3 result" || echo nothing
          for i in 1 2 3; do git fetch -q origin svoy-golos && git rebase -q FETCH_HEAD && git push origin HEAD:svoy-golos && break; sleep 5; done
