name: dns-check
# Проверка, работает ли домен: whois (статус в реестре), делегирование в зоне .ru,
# ответы DNS-серверов хостинга и публичных DNS, открывается ли сайт по http/https.
# Запускается, когда меняется dns.txt в ветке domain-check. Результат — status/dns.md.
on:
  push:
    branches: [domain-check]
    paths: ['dns.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dns-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Установить whois и dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq whois dnsutils >/dev/null
      - name: Проверить
        run: bash dns_check.sh
      - name: Сохранить результат
        run: |
          git config user.name "dns-check"
          git config user.email "dns-check@users.noreply.github.com"
          git add status
          git commit -m "dns $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check
