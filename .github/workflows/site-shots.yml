name: site-shots
# Скриншоты сайта настоящим Chrome (компьютер и телефон) — когда Мак не на связи.
# Список — shots/list.txt (ветка domain-check): «имя | адрес | desktop|mobile | js (необязательно)».
# Результат — status/shots/<имя>.jpg и status/shots.md (ошибки консоли, неудачные запросы).
on:
  push:
    branches: [domain-check]
    paths: ['shots/list.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-shots
  cancel-in-progress: false
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Playwright
        run: pip install -q playwright pillow && (google-chrome --version || npx -y playwright install --with-deps chrome)
      - name: Снять
        run: python shots/shots.py
      - name: Сохранить
        if: always()
        run: |
          git config user.name site-shots; git config user.email site-shots@users.noreply.github.com
          git add status; git commit -q -m "shots $(date -u +%F_%H:%M)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin domain-check && git push -q origin HEAD:domain-check && break; sleep 5; done
