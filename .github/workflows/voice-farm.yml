name: pochemu-albina-voice-farm
# Озвучка заранее: забирает с сервера тексты будущих роликов (albina/bank.json), озвучивает Альбиной
# в 6 параллельных частях и кладёт готовые фразы в ветку pochemu-albina-voice (одним коммитом — ветка не растёт).
on:
  workflow_dispatch:
  push:
    branches: [pochemu-albina]
    paths: ['request-farm.txt']
permissions:
  contents: write
concurrency:
  group: pochemu-albina-farm6
  cancel-in-progress: false
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Тексты с сервера
        run: |
          for u in http://89.126.192.214:8080/albina/bank.json http://89.126.192.214/albina/bank.json; do
            curl -fsS -m 30 -o bank.json "$u" && python3 -c "import json;json.load(open('bank.json'))" && { echo "взял $u"; break; }
            rm -f bank.json
          done
          [ -s bank.json ] || { echo "Не получил тексты с сервера"; exit 1; }
          python3 -c "import json;b=json.load(open('bank.json'));print('сценариев:',len(b['scripts']),'фраз:',sum(len(s['lines']) for s in b['scripts']),'выложено:',b['updated'])"
      - name: Плюс темы из extra_bank.json (новые темы озвучиваются до того, как попадут на сервер)
        run: |
          python3 - <<'PY'
          import json
          b = json.load(open('bank.json', encoding='utf-8'))
          try:
              extra = json.load(open('extra_bank.json', encoding='utf-8'))
          except FileNotFoundError:
              extra = []
          have = {s.get('title') for s in b.get('scripts', [])}
          add = [{'title': s['title'], 'lines': s['lines']} for s in extra
                 if isinstance(s, dict) and s.get('lines') and s.get('title') not in have]
          b.setdefault('scripts', []).extend(add)
          json.dump(b, open('bank.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('добавлено из extra_bank.json:', len(add), '| всего сценариев:', len(b['scripts']),
                '| фраз:', sum(len(s['lines']) for s in b['scripts']))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: bank, path: bank.json, retention-days: 2}
  farm:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo mkdir -p /opt/multik-tts && sudo chown $USER /opt/multik-tts
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /opt/multik-tts/hf
            /opt/multik-tts/v5_cis_base.pt
          key: pochemu-albina-v1
      - uses: actions/download-artifact@v4
        with: {name: bank}
      - name: Озвучщик
        timeout-minutes: 20
        run: |
          set -x
          # 11.11.2026: шаг дважды завис почти на час без вывода — теперь у каждой загрузки свой предел времени
          command -v ffmpeg >/dev/null || { timeout 600 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && timeout 600 sudo apt-get install -y -qq ffmpeg >/dev/null; }
          python -m venv /opt/multik-tts/venv
          timeout 900 /opt/multik-tts/venv/bin/pip install -q --timeout 30 --retries 5 torch --index-url https://download.pytorch.org/whl/cpu
          timeout 600 /opt/multik-tts/venv/bin/pip install -q --timeout 30 --retries 5 numpy ruaccent praat-parselmouth
          [ -s /opt/multik-tts/v5_cis_base.pt ] || curl -fsSL --retry 3 --connect-timeout 20 --max-time 900 -o /opt/multik-tts/v5_cis_base.pt https://models.silero.ai/models/tts/ru/v5_cis_base.pt
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 -o /opt/multik-tts/server.py https://raw.githubusercontent.com/mikhailusenko88-hub/Mikhail/mebel-3d/tools/multik/tts/server.py
          python patch_server.py /opt/multik-tts/server.py
          cp albina_worker.py /opt/multik-tts/
      - name: Прежняя озвучка
        run: |
          mkdir -p prev
          if grep -qi force request-farm.txt; then echo "force — озвучиваю всё заново"; ls prev | wc -l; exit 0; fi
          if git fetch -q --depth 1 origin pochemu-albina-voice 2>/dev/null; then git --work-tree=prev checkout FETCH_HEAD -- . 2>/dev/null || true; git reset -q; fi
          ls prev/v 2>/dev/null | wc -l
      - name: Озвучка (часть ${{ matrix.shard }} из 6)
        run: ALBINA_NO_GH=1 python farm.py bank.json part --prev prev --shard ${{ matrix.shard }}/6 --max-minutes 95
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'part-${{ matrix.shard }}', path: part, retention-days: 2, if-no-files-found: ignore}
  publish:
    needs: farm
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: bank}
      - uses: actions/download-artifact@v4
        with: {pattern: 'part-*', path: parts}
      - name: Собрать и выложить в ветку pochemu-albina-voice
        run: |
          mkdir -p voice
          if git fetch -q --depth 1 origin pochemu-albina-voice 2>/dev/null; then git --work-tree=voice checkout FETCH_HEAD -- . 2>/dev/null || true; git reset -q; fi
          python farm.py --merge bank.json voice parts
          cd voice && rm -rf .git && git init -q -b pochemu-albina-voice
          git config user.name albina-farm && git config user.email albina-farm@users.noreply.github.com
          printf '# Готовая озвучка «Почему так?» (Альбина)\nДелается автоматически из ветки pochemu-albina (farm.py). Руками не менять.\n' > README.md
          git add -A && git commit -qm "Озвучка $(date -u '+%F %T')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:pochemu-albina-voice
          echo "выложено: $(ls v | wc -l) фраз"
      - name: Отчёт
        if: always()
        run: |
          mkdir -p result && cp voice/report.md result/farm.md 2>/dev/null || true
          git config user.name albina-farm && git config user.email albina-farm@users.noreply.github.com
          git add result/farm.md 2>/dev/null && git commit -qm "albina farm report" || echo nothing
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
