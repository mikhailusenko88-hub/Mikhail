name: music-ref
# Разбор мелодии из ролика (без сохранения самого звука в репозиторий): список роликов канала,
# поиск по названию, скачивание звука, анализ — темп, тональность, аккорды, мелодия, тембр. Результат — status/.
on:
  push:
    branches: [music-ref]
    paths: ['request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: music-ref
jobs:
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: инструменты
        run: |
          python3 -m pip install -q -U yt-dlp librosa soundfile matplotlib
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
      - name: разбор
        timeout-minutes: 20
        run: |
          mkdir -p status
          if grep -q '^pages' request.txt; then python3 pages.py 2>&1 | tee status/log.txt; else python3 ref.py 2>&1 | tee status/log.txt; fi
      - name: сохранить
        if: always()
        run: |
          rm -f out/*.m4a out/*.wav out/*.webm out/*.mp4
          git config user.name "music-ref"
          git config user.email "noreply@github.com"
          git add status
          git diff --cached --quiet || git commit -qm "разбор $(date -u +%F_%H:%M)"
          git push origin HEAD:music-ref
