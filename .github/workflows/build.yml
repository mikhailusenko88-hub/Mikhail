name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Add three.js engine
        run: |
          npm pack three@0.169.0
          tar xzf three-0.169.0.tgz
          cp package/build/three.module.min.js Resources/Mebel/
          cp package/examples/jsm/controls/OrbitControls.js Resources/Mebel/
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Pack project for Xcode
        run: zip -qr Zamer3D-Xcode.zip Zamer3D.xcodeproj Sources Resources project.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Zamer3D-Xcode
          path: Zamer3D-Xcode.zip
      - name: Build (unsigned)
        run: |
          xcodebuild -project Zamer3D.xcodeproj -scheme Zamer3D -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Zamer3D.app Payload/
          zip -qr Zamer3D.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Zamer3D-ipa
          path: Zamer3D.ipa
