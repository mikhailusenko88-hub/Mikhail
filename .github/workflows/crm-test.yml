          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          press() { local t; t=$(curl -sk $R -c $J -b $J https://$H/server | tok); curl -sk $R -c $J -b $J -o /dev/null -w "%{http_code}" --data-urlencode "csrf=$t" --data-urlencode "action=$1" ${2:+--data-urlencode "confirm=1"} https://$H/server/run; }
