          echo "снаружи видно текст ответа: $(grep -c '25 000' /tmp/replies.json)"
          python3 -I -c "
          import json, base64
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey, X25519PublicKey
          from cryptography.hazmat.primitives.ciphers.aead import ChaCha20Poly1305
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes, serialization as s
          I = b'nashdekor-replies-v1'
          sk = X25519PrivateKey.from_private_bytes(open('/tmp/reader.sk', 'rb').read())
          pk = sk.public_key().public_bytes(s.Encoding.Raw, s.PublicFormat.Raw)
          d = json.load(open('/tmp/replies.json')); print('писем для Claude:', len(d['items']))
          for e in d['items']:
              epk = base64.b64decode(e['epk'])
              key = HKDF(algorithm=hashes.SHA256(), length=32, salt=None, info=I + epk + pk).derive(sk.exchange(X25519PublicKey.from_public_bytes(epk)))
              x = json.loads(ChaCha20Poly1305(key).decrypt(base64.b64decode(e['nonce']), base64.b64decode(e['ct']), I))
              print(' -', x['from'], '|', x['subject'], '|', x['text'][:60])"
          echo "--- раздел «Почта» (вход Юлии):"
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          T=$(curl -sk $R -c $J -b $J https://$H/login | grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//')
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          P=$(curl -sk $R -c $J -b $J https://$H/pochta)
          for w in 'Запрос на испытания панелей' zakaz-from-client info-unrelated 'видит Claude'; do echo "в списке «$w»: $(grep -c "$w" <<<"$P")"; done
          for L in $(grep -o 'href="/pochta/[0-9a-f]\{20\}"' <<<"$P" | cut -d'"' -f2 | head -n 6); do
            echo "письмо $L: $(curl -sk $R -c $J -b $J https://$H$L | grep -o 'Стоимость Г1[^<]*\|Хочу панели\|Не ответ\|КП.pdf\|Undelivered[^<]*\|outbox-selftest' | sort -u | tr '\n' ';')"
          done
          echo "спам: $(curl -sk $R -c $J -b $J 'https://'$H'/pochta?box=spam' | grep -o 'class="t">[^<]*' | head -n5 | tr '\n' ';')"
          echo "«Исходящие»: $(curl -sk $R -c $J -b $J https://$H/outbox | grep -o 'Ответы, которые видит Claude\|ключ подключён' | sort -u | tr '\n' ';')"
          echo "без входа: $(curl -sk $R -o /dev/null -w '%{http_code}' https://$H/pochta)"
          echo '```'
          } > "$O" 2>&1
          cat "$O"
          git config user.name crm-test; git config user.email crm-test@users.noreply.github.com
          git add status; git commit -m "crm-test pochta $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check || true
