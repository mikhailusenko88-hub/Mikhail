      - name: Копии баз — архив для скачивания и копия в облако (S3, MinIO)
        if: always()
        run: |
          mkdir -p status; O=status/crm-kopii.md
          {
          echo "# Копии баз — $(date -u '+%F %H:%M') UTC"; echo; echo '```'
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/jk
          echo "пароль копий: $(sudo stat -c '%U:%G %a' /etc/prostranstvo/backup-pass), длина $(sudo head -n1 /etc/prostranstvo/backup-pass | tr -d '\n' | wc -c)"
          sudo prostranstvo-crm passwords | grep -c 'Пароль от копий' | xargs echo "строка в passwords:"
          echo "cron: $(grep -c 'prostranstvo-crm offsite' /etc/cron.d/prostranstvo-crm)"
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          T=$(curl -sk $R -c $J -b $J https://$H/server | tok)
          echo "кнопка «Копия баз — скачать»: $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' --data-urlencode "csrf=$T" --data-urlencode "action=export" https://$H/server/run)"
          sudo prostranstvo-crm server-page; sleep 1
          sudo head -n 6 /var/lib/prostranstvo/server-action.txt
          P=$(curl -sk $R -c $J -b $J https://$H/server)
          F=$(grep -o 'nashdekor-kopiya-[0-9-]*\.tar\.gz\.enc' <<<"$P" | head -n1); echo "в CRM ссылка: $F"
          curl -sk $R -c $J -b $J -o /tmp/k.enc https://$H/server/export/$F; echo "скачано: $(stat -c %s /tmp/k.enc) байт, начало: $(head -c 8 /tmp/k.enc)"
          echo "без входа: $(curl -sk $R -o /dev/null -w '%{http_code}' https://$H/server/export/$F)"
          sudo head -n1 /etc/prostranstvo/backup-pass | tr -d '\n' > /tmp/pass
          echo "пароль на странице — только по кнопке: $(grep -c "$(cat /tmp/pass)" <<<"$P") / $(curl -sk $R -c $J -b $J "https://$H/server?pass=1" | grep -c "$(cat /tmp/pass)")"
          echo "--- содержимое архива (расшифровка openssl тем же паролем):"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass file:/tmp/pass -in /tmp/k.enc | tar tzf - > /tmp/list
          wc -l < /tmp/list | xargs echo "файлов:"
          grep -E '/crm\.db$|/bot\.db$|backup-pass$|crm-paroli|dkim/|vhosts/[^/]+/[^/]+/$' /tmp/list | head -n 12
          echo "--- облако (MinIO как Selectel)"
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=testkey -e MINIO_ROOT_PASSWORD=testsecret123 minio/minio server /data >/dev/null
          sleep 10
          docker run --rm --network host --entrypoint sh minio/mc -c 'mc alias set m http://127.0.0.1:9000 testkey testsecret123 >/dev/null && mc mb m/nashdekor-backup'
          T=$(curl -sk $R -c $J -b $J https://$H/settings | tok)
          echo "сохранение настроек: $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' --data-urlencode "csrf=$T" --data-urlencode act=save --data-urlencode endpoint=https://s3.ru-3.storage.selcloud.ru --data-urlencode region=us-east-1 --data-urlencode bucket=nashdekor-backup --data-urlencode key=testkey --data-urlencode secret=testsecret123 --data-urlencode on=1 https://$H/settings/offsite)"
          sudo sqlite3 /var/lib/prostranstvo/crm.db "update settings set value='http://127.0.0.1:9000' where key='offsite_endpoint';"
          T=$(curl -sk $R -c $J -b $J https://$H/settings | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode act=check https://$H/settings/offsite
          curl -sk $R -c $J -b $J https://$H/settings | grep -o 'Проверка связи: [^<]*' | head -n1
          sudo prostranstvo-crm offsite
          docker run --rm --network host --entrypoint sh minio/mc -c 'mc alias set m http://127.0.0.1:9000 testkey testsecret123 >/dev/null && mc ls -r m/nashdekor-backup'
          curl -sk $R -c $J -b $J https://$H/settings | grep -o 'Последняя копия<span class="d"> · [^<]*' | sed 's/<span class="d">//'
          docker run --rm --network host -v /tmp:/t --entrypoint sh minio/mc -c 'mc alias set m http://127.0.0.1:9000 testkey testsecret123 >/dev/null && mc cp -r m/nashdekor-backup/nashdekor/2 /t/cloud/ >/dev/null && ls -R /t/cloud | tail -n 2'
          C=$(sudo find /tmp/cloud -name '*.enc' | head -n1)
          echo "копия из облака открывается: $(sudo openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass file:/tmp/pass -in "$C" | tar tzf - | grep -c '/crm\.db$') crm.db"
          sudo sqlite3 /var/lib/prostranstvo/crm.db "update settings set value='wrong' where key='offsite_secret';"
          sudo prostranstvo-crm offsite || echo "неверный ключ — ошибка поймана (код $?)"
          curl -sk $R -c $J -b $J https://$H/settings | grep -o 'Последняя копия<span class="d"> · [^<]*' | sed 's/<span class="d">//'
          echo '```'
          } > "$O" 2>&1
          cat "$O"
          git config user.name crm-test; git config user.email crm-test@users.noreply.github.com
          git add status; git commit -m "crm-test kopii $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check || true
      - name: Редактор сайта (фото через nginx, правки, API для Actions)
        if: always()
        run: |
          mkdir -p status; O=status/crm-site-editor.md
          {
          echo "# Редактор сайта — $(date -u '+%F %H:%M') UTC"; echo; echo '```'
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/je
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          P=$(curl -sk $R -c $J -b $J https://$H/site/edit)
          echo "страница: $(grep -c 'Редактор сайта' <<<"$P") · товаров в списке: $(grep -o 'site/edit/item?a=' <<<"$P" | wc -l)"
          A=$(grep -o 'site/edit/item?a=[^"]*' <<<"$P" | head -n1 | sed 's/.*a=//'); echo "первый товар: $A"
          python3 -c "from PIL import Image; import os; im=Image.frombytes('RGB',(2400,1500),os.urandom(2400*1500*3)); im.save('/tmp/big.png')" 2>/dev/null || head -c 5000000 /dev/urandom | (printf '\x89PNG\r\n\x1a\n'; cat) > /tmp/big.png
          echo "фото: $(stat -c %s /tmp/big.png) байт"
          T=$(curl -sk $R -c $J -b $J "https://$H/site/edit/item" | tok)
          echo "новый товар с фото (через nginx): $(curl -sk $R -c $J -b $J -o /tmp/r.html -w '%{http_code}' -F "csrf=$T" -F old= -F a=TEST1 -F c=panel -F 'n=Стеновая реечная панель белая под покраску 160×12×3000 мм — TEST1' -F 'd=узкие рейки, полистирол высокой плотности (дюрополимер)' -F w=160 -F t=12 -F l=3000 -F b=10 -F r=2100 -F 'photo=@/tmp/big.png;type=image/png' https://$H/site/edit/item)"
          head -c 20000000 /dev/urandom | (printf '\xff\xd8\xff'; cat) > /tmp/huge.jpg
          echo "фото 20 МБ (больше 15 — CRM откажет, должно 400): $(curl -sk $R -c $J -b $J -o /tmp/r2.html -w '%{http_code}' -F "csrf=$T" -F old= -F a=TEST2 -F c=panel -F 'photo=@/tmp/huge.jpg' https://$H/site/edit/item) · $(grep -o 'больше 15 МБ' /tmp/r2.html | head -n1)"
          echo "в другой адрес 2 МБ (должно 413): $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' -F "csrf=$T" -F 'photo=@/tmp/big.png' https://$H/settings/offsite)"
          for i in 1 2 3; do cp /tmp/big.png /tmp/g$i.png; done
          T=$(curl -sk $R -c $J -b $J "https://$H/site/edit/item?a=$A" | tok)
          echo "3 доп. фото сразу (через nginx): $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' -F "csrf=$T" -F "a=$A" -F action=add -F 'more=@/tmp/g1.png' -F 'more=@/tmp/g2.png' -F 'more=@/tmp/g3.png' https://$H/site/edit/gallery)"
          T=$(curl -sk $R -c $J -b $J "https://$H/site/edit/home" | tok)
          echo "скрыть товар: $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' --data-urlencode "csrf=$T" --data-urlencode "a=$A" https://$H/site/edit/hide)"
          for u in sections section home articles article reviews review recent; do printf '%s ' "/site/edit/$u=$(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' https://$H/site/edit/$u)"; done; echo
          J2=$(curl -sk $R https://$H/api/site/edits); echo "API для Actions: $(python3 -c "import json,sys;e=json.loads(sys.argv[1])['edits'];print([(x['id'],x['kind'],x['article'],x['photos']) for x in e])" "$J2")"
          F=$(python3 -c "import json,sys;print(json.loads(sys.argv[1])['edits'][0]['photo'])" "$J2")
          echo "фото по API без входа: $(curl -sk $R -o /tmp/ph -w '%{http_code}' https://$H/api/site/photo/$F), совпадает: $(cmp -s /tmp/ph /tmp/big.png && echo да || echo НЕТ)"
          sudo ls -l /var/lib/prostranstvo/site-uploads | tail -n +2 | awk '{print "на диске:", $1, $3":"$4, $5, $9}'
          echo '{"last_id": 1, "edits": {"1": {"ok": true, "note": "добавлен, новое фото", "at": "тест"}}}' | sudo tee /var/www/prostranstvo/site-edits.json >/dev/null
          P=$(curl -sk $R -c $J -b $J https://$H/site/edit/recent); echo "после итога с сайта: $(grep -o 'на сайте' <<<"$P" | head -n1)"
          echo "фото после публикации: $(curl -sk $R -o /dev/null -w '%{http_code}' https://$H/api/site/photo/$F) (должно 404)"
          echo '```'
          } > "$O" 2>&1
          cat "$O"
          git config user.name crm-test; git config user.email crm-test@users.noreply.github.com
          git add status; git commit -m "crm-test site editor $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check || true
      - name: Состояние
        if: always()
        run: |
          sudo prostranstvo-crm || true
          sudo prostranstvo-crm backup && echo 'копия: ок'; sudo bash -c 'ls -la /var/backups/prostranstvo/*/' | head
          systemctl show prostranstvo-crm -p MemoryCurrent
          sudo tail -n 40 /var/log/prostranstvo-crm-setup-details.log
