          echo "2) «Выключить заявки»: $(press leads-off)"; run_page; echo "   состояние: $(state); SITE_LEADS=$(sudo grep -o 'SITE_LEADS=.' /etc/prostranstvo/crm.env)"
          echo "   «Включить заявки»: $(press leads-on)"; run_page; echo "   состояние: $(state); SITE_LEADS=$(sudo grep -o 'SITE_LEADS=.' /etc/prostranstvo/crm.env)"
          echo "3) «Перезапустить CRM»: $(press restart-crm)"; run_page; echo "   состояние: $(state)"; sleep 3
          echo "4) «Перезапустить почту»: $(press restart-mail)"; run_page; echo "   состояние: $(state)"
          echo "5) «Перезапустить веб-сервер»: $(press reload-web)"; run_page; echo "   состояние: $(state)"
          echo "6) «Снять блокировки»: $(press unban)"; run_page; echo "   состояние: $(state)"
          echo "7) «Обновить сайт»: $(press sync)"; run_page; echo "   состояние: $(state)"
          echo "8) чужая команда в файле-просьбе:"
          sudo -u prostranstvo bash -c "printf 'rm -rf / x\n' > $D/server-request"; before=$(sudo md5sum $D/server-action.txt); run_page
          echo "   файл результата не изменился: $([[ $(sudo md5sum $D/server-action.txt) == "$before" ]] && echo да || echo НЕТ)"; sudo journalctl -t prostranstvo-server --no-pager -n 3 | grep -o 'неизвестное.*' | tail -n1
          echo "   FIFO вместо файла:"; sudo -u prostranstvo mkfifo $D/server-request; run_page; echo "   FIFO убран: $([[ -e $D/server-request ]] && echo НЕТ || echo да)"
          echo "   ссылка на /etc/shadow вместо результата:"; sudo -u prostranstvo ln -sfn /etc/shadow $D/server-action.txt; echo "   нажатие: $(press backup)"; run_page; echo "   результат — обычный файл: $([[ -L $D/server-action.txt ]] && echo НЕТ || echo да); /etc/shadow цел: $(sudo head -c 5 /etc/shadow | grep -c root)"
          echo "   перезагрузка без галочки: $(press reboot); просьба: $(sudo ls $D/server-request 2>&1 | grep -c request)"
