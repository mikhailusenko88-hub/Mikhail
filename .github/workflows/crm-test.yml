          echo "# Кнопки «Сервер» — $(date -u '+%F %H:%M') UTC"; echo; echo '```'
          D=/var/lib/prostranstvo; H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j4
          run_page() { sudo timeout 1800 /usr/local/sbin/prostranstvo-crm server-page; echo "  (server-page код $?)"; }
          state() { sudo sed -n 's/^Состояние: //p' $D/server-action.txt 2>/dev/null | head -n1; }
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
