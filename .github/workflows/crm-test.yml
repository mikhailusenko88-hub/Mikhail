name: crm-test
# Проверка setup-crm.sh на чистой Ubuntu 24.04: сайт → почта → CRM, вход, заявки, защита.
on:
  push:
    branches: [domain-check]
    paths: ["crm-test/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка раннера
        run: |
          cp crm-test/*.sh .
          sudo systemctl stop apache2 nginx mysql postgresql 2>/dev/null || true
          sudo apt-get purge -y -q 'apache2*' >/dev/null 2>&1 || true
          shellcheck -S warning -e SC2034,SC1090,SC1091 setup-crm.sh || true
      - name: Сайт и почта
        timeout-minutes: 40
        run: |
          set -o pipefail
          # зеркало Ubuntu иногда не отдаёт пакеты (11.11.2026 apt висел 28 минут) — вторая попытка
          sudo timeout 900 bash setup-prostranstvo.sh nashdekor.ru test@example.com --force 2>&1 | tail -n 5 \
            || { sudo apt-get update -q >/dev/null; sudo timeout 600 bash setup-prostranstvo.sh nashdekor.ru test@example.com --force 2>&1 | tail -n 5; }
          sudo bash setup-pochta.sh 2>&1 | grep -E 'ПОЧТА|НЕТ|ВНИМАНИЕ' || true
      - name: CRM — установка
        run: sudo bash setup-crm.sh 2>&1
      - name: CRM — повторная установка (пароли не меняются)
        run: |
          before=$(sudo md5sum /etc/prostranstvo/crm-paroli.txt)
          sudo bash setup-crm.sh 2>&1 | tail -n 14
          after=$(sudo md5sum /etc/prostranstvo/crm-paroli.txt)
          [[ $before == "$after" ]] && echo "ПАРОЛИ НЕ ИЗМЕНИЛИСЬ — хорошо" || { echo "ПАРОЛИ ИЗМЕНИЛИСЬ"; exit 1; }
      - name: CRM — вход и работа через https
        run: |
          set -e
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok); echo "csrf ${T:0:5}…"
          code=$(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login)
          echo "вход: $code"; [[ $code == 302 ]]
          curl -sk $R -c $J -b $J https://$H/ | grep -q 'Сегодня' && echo "главная открылась"
          T=$(curl -sk $R -c $J -b $J https://$H/deals/new | tok)
          loc=$(curl -sk $R -c $J -b $J -o /dev/null -w '%{redirect_url}' --data-urlencode "csrf=$T" --data-urlencode "name=Тест Клиент" --data-urlencode "phone=+7 900 000 00 00" --data-urlencode "source=avito" --data-urlencode "want=A912 на стену" https://$H/deals/new)
          echo "новая заявка: $loc"; [[ $loc == */deals/* ]]
          T=$(curl -sk $R -c $J -b $J "$loc" | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "article=A912" --data-urlencode "qty=10" "$loc/lines"
          curl -sk $R -c $J -b $J "$loc" | grep -o '[0-9 ]*₽' | head -n 3
          curl -sk $R -c $J -b $J https://$H/stock | grep -c 'name="qty"' | xargs echo "строк на складе:"
          for p in /board /clients /tasks /reports /settings; do echo "$p $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' https://$H$p)"; done
          curl -sk $R -I https://$H/login | grep -iE 'content-security|strict-transport|x-frame' || true
      - name: Заявка с сайта (выключена → включена) и письмо на zakaz@
        run: |
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"
          body='{"name":"Сайт Тест","contact":"+7 911 222-33-44","consent":true,"message":"Нужен расчёт","consentVersion":"2026-10-29"}'
          curl -sk $R -o /dev/null -w 'выключено: %{http_code}\n' -H 'Origin: https://nashdekor.ru' -H 'Content-Type: application/json' -d "$body" https://$H/api/lead
          sudo prostranstvo-crm site-leads on
          sleep 3
          curl -sk $R -D - -H 'Origin: https://nashdekor.ru' -H 'Content-Type: application/json' -d "$body" https://$H/api/lead | grep -iE '^HTTP|access-control-allow-origin|"ok"'
          curl -sk $R -o /dev/null -w 'preflight: %{http_code}\n' -X OPTIONS -H 'Origin: https://nashdekor.ru' -H 'Access-Control-Request-Method: POST' https://$H/api/lead
          sleep 8
          echo "писем у zakaz@: $(sudo doveadm search -u zakaz@nashdekor.ru mailbox INBOX all | wc -l)"
          f=$(sudo ls -1t /var/mail/vhosts/nashdekor.ru/zakaz/Maildir/new/ 2>/dev/null | head -n1)
          [[ -n $f ]] && sudo grep -m4 -E '^(Subject|From|To|DKIM-Signature):' "/var/mail/vhosts/nashdekor.ru/zakaz/Maildir/new/$f" || echo "письма на zakaz@ нет"
          sudo journalctl -t postfix/lmtp -t postfix/smtpd --no-pager -n 6 | cut -c1-200
      - name: Счётчик — свои IP не считаются, обнуление
        run: |
          set -e
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j2
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          cnt() { sudo python3 -c "import sqlite3;print(sqlite3.connect('/var/lib/prostranstvo/crm.db').execute('select count(*) from visits').fetchone()[0])"; }
          hit() { curl -s -o /dev/null -w '%{http_code} ' -H "X-Forwarded-For: $1" -H 'Origin: https://nashdekor.ru' -H 'Content-Type: text/plain' -H 'User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) AppleWebKit/605.1.15 Version/18.1 Mobile/15E148 Safari/604.1' -d '{"e":[["view","/"]],"r":"","u":"","m":1}' http://127.0.0.1:8081/api/hit; }
          hit 198.51.100.7; sleep 1; a=$(cnt); echo "отметок после чужого захода: $a"; [[ $a -ge 1 ]]
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          T=$(curl -sk $R -c $J -b $J https://$H/settings | tok)
          curl -sk $R -c $J -b $J -o /dev/null -w 'свои IP сохранены: %{http_code}\n' --data-urlencode "csrf=$T" --data-urlencode "ips=198.51.100.7" https://$H/settings/hit-ips
          curl -sk $R -c $J -b $J https://$H/settings | grep -o 'Обнулить статистику ([0-9]*)'
          hit 198.51.100.7; hit 198.51.100.7; sleep 1; b=$(cnt); echo "после своих заходов: $b (должно быть $a)"; [[ $b -eq $a ]]
          hit 203.0.113.77; sleep 1; c=$(cnt); echo "после чужого: $c (должно быть больше $a)"; [[ $c -gt $a ]]
          T=$(curl -sk $R -c $J -b $J https://$H/settings | tok)
          curl -sk $R -c $J -b $J -o /dev/null -w 'обнуление: %{http_code}\n' --data-urlencode "csrf=$T" --data-urlencode "reset=1" https://$H/settings/hit-ips
          d=$(cnt); echo "после обнуления: $d"; [[ $d -eq 0 ]]
      - name: Воронка — автозадачи, стража «Расчёт отправлен», заказ с сайта
        run: |
          set -e
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j3
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          # заказ с сайта («Купить»): позиции сразу в расчёте, адрес, задача «Связаться»
          body='{"name":"Покупатель","contact":"+7 921 000-11-22","email":"buyer@example.com","consent":true,"intent":"buy","address":"СПб, Невский пр., 1","message":"Хочу купить","calc":"Товар: A912 (реечная панель) — 6 шт, цвет: белый\nИтого ≈ 5 940 ₽","consentVersion":"2026-10-29"}'
          id=$(curl -sk $R -H 'Origin: https://nashdekor.ru' -H 'Content-Type: application/json' -d "$body" https://$H/api/lead | grep -o '"id": *[0-9]*' | grep -o '[0-9]*')
          echo "заказ с сайта: сделка №$id"; [[ -n $id ]]
          page=$(curl -sk $R -c $J -b $J https://$H/deals/$id)
          echo "$page" | grep -q 'ЗАКАЗ' && echo "помечен как ЗАКАЗ"
          echo "$page" | grep -q 'Невский' && echo "адрес доставки записан"
          echo "$page" | grep -q 'A912' && echo "позиция A912 в расчёте"
          echo "$page" | grep -o 'Следующий шаг: <a href="#tasks">[^<]*' | sed 's/.*">//'
          # «Дальше» из «Новая» → «В работе», затем «Дальше» → «Расчёт отправлен» должен сработать только через письмо
          T=$(echo "$page" | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "next=1" https://$H/deals/$id/stage
          curl -sk $R -c $J -b $J https://$H/deals/$id | grep -o 'Следующий шаг: <a href="#tasks">[^<]*' | sed 's/.*">/после «В работе»: /'
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "next=1" https://$H/deals/$id/stage
          page=$(curl -sk $R -c $J -b $J https://$H/deals/$id)
          echo "$page" | grep -o 'Расчёт отправлен на [^,]*' || echo "$page" | grep -o 'Этап не сменён[^<]*'
          echo "$page" | grep -o '<option value="[a-z]*" selected' | sed 's/.*value="/этап: /;s/" selected//'
          echo "$page" | grep -o 'Следующий шаг: <a href="#tasks">[^<]*' | sed 's/.*">/задача: /'
          sleep 6; echo "писем у buyer (локально не доставляется — смотрим очередь postfix):"; sudo postqueue -p | tail -n 3 || true
          curl -sk $R -c $J -b $J 'https://'$H'/board?hot=1' | grep -o 'горит [0-9]*\|card warm\|card hot' | sort | uniq -c
      - name: Напоминания клиентам (cron-команда) и блок «Что дальше» в письме
        run: |
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"
          grep -c followups /etc/cron.d/prostranstvo-crm | xargs echo "строк cron с followups:"
          sudo prostranstvo-crm followups
          f=$(sudo ls -1t /var/mail/vhosts/nashdekor.ru/zakaz/Maildir/new/ 2>/dev/null | head -n1)
          echo "последнее письмо на zakaz@: $(sudo grep -m1 '^Subject:' "/var/mail/vhosts/nashdekor.ru/zakaz/Maildir/new/$f" 2>/dev/null)"
          sudo journalctl -t postfix/smtp --no-pager -n 4 | cut -c1-200 || true
      - name: Пуши — пакет, манифест, service worker, службы Apple/Google, письмо клиента → сделка
        run: |
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"
          sudo runuser -u prostranstvo -- python3 -c "import cryptography; print('cryptography', cryptography.__version__)"
          curl -sk $R -o /dev/null -w 'manifest: %{http_code} %{content_type}\n' https://$H/manifest.webmanifest
          curl -sk $R -o /dev/null -w 'sw.js: %{http_code} %{content_type}\n' https://$H/sw.js
          curl -sk $R -o /dev/null -w 'иконка 192: %{http_code}\n' https://$H/static/icon-192.png
          grep -E 'mail-watch|digest' /etc/cron.d/prostranstvo-crm | sed 's/  */ /g'
          # Настоящие запросы к службам пушей с выдуманной подпиской: проверяем, что подпись VAPID и шифрование приняты
          # (ответ про «нет такого устройства» — нормально; «плохой токен/ключ» — ошибка у нас)
          cd /opt/prostranstvo-crm/src/crm && sudo runuser -u prostranstvo -- python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          import push as P
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          class S(dict):
              def setting(self, k, d=""): return self.get(k, d)
              def set_setting(self, k, v): self[k] = v
          wp = P.WebPush(S(), "mailto:zakaz@nashdekor.ru")
          ua = ec.generate_private_key(ec.SECP256R1())
          pub = ua.public_key().public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)
          for ep in ("https://web.push.apple.com/QGuQyavXutnMH9eB0oF9jmuJ2plpm1L8h4JEBoQnUSGTWg", "https://fcm.googleapis.com/fcm/send/fake-test-token:APA91bTest"):
              body = P.encrypt(b'{"title":"t"}', pub, os.urandom(16))
              h = {"Content-Type": "application/octet-stream", "Content-Encoding": "aes128gcm", "TTL": "60",
                   "Authorization": f"vapid t={wp._vapid(ep)}, k={wp.public_key()}"}
              try:
                  with urllib.request.urlopen(urllib.request.Request(ep, data=body, headers=h, method="POST"), timeout=15) as r:
                      print(ep.split("/")[2], r.status, r.read()[:200])
              except urllib.error.HTTPError as e:
                  print(ep.split("/")[2], e.code, e.read()[:300])
              except Exception as e:
                  print(ep.split("/")[2], "нет связи:", e)
          PY
          cd - >/dev/null
          # письмо от клиента (buyer@example.com из шага «Воронка») на zakaz@ → в его сделку
          sudo prostranstvo-crm mail-watch; echo "первый проход сторожа почты: только запомнил старые письма"
          python3 - <<'PY'
          import smtplib
          from email.message import EmailMessage
          m = EmailMessage(); m["From"] = "Покупатель <buyer@example.com>"; m["To"] = "zakaz@nashdekor.ru"; m["Subject"] = "Re: Заказ №3 — подтверждаю"
          m.set_content("Подтверждаю заказ, присылайте ссылку на оплату.")
          with smtplib.SMTP("127.0.0.1", 25, timeout=15) as s: s.send_message(m)
          print("письмо клиента отправлено на zakaz@")
          PY
          sleep 8
          sudo prostranstvo-crm mail-watch
          sudo journalctl -t prostranstvo-mailwatch --no-pager -n 3 | cut -c1-200 || true
          J=/tmp/j4; PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          id=/deals/$(sudo sqlite3 /var/lib/prostranstvo/crm.db "select d.id from deals d join clients c on c.id=d.client_id where lower(c.email)='buyer@example.com' order by d.id desc limit 1"); echo "сделка покупателя: $id"
          curl -sk $R -c $J -b $J "https://$H$id" | grep -o 'Письмо от клиента: «[^»]*»\|Ответить на письмо клиента' | sort -u
          curl -sk $R -c $J -b $J https://$H/settings | grep -o 'Уведомления на телефон\|data-key="[A-Za-z0-9_-]\{20\}' | head -n2
          sudo prostranstvo-crm digest
      - name: Чат с сайта — сообщение, ответ, заявка из чата
        run: |
          set -e
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j5
          SID=chatTEST0123456789abcdefXYZ
          post() { curl -sk $R -H 'Origin: https://nashdekor.ru' -H 'Content-Type: application/json' -d "$1" https://$H/api/chat; }
          echo "без согласия: $(curl -sk $R -o /dev/null -w '%{http_code}' -H 'Origin: https://nashdekor.ru' -H 'Content-Type: application/json' -d '{"sid":"'$SID'","text":"Привет"}' https://$H/api/chat)"
          post '{"sid":"'$SID'","text":"Есть A907 в наличии?","consent":true,"page":"/p/a907/"}' | head -c 200; echo
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          curl -sk $R -c $J -b $J https://$H/ | grep -o 'Чат<span class="badge">[0-9]*' | head -n1
          cid=$(curl -sk $R -c $J -b $J https://$H/chats | grep -o '/chats/[0-9]*' | head -n1); echo "чат: $cid"
          T=$(curl -sk $R -c $J -b $J "https://$H$cid" | tok)
          curl -sk $R -c $J -b $J -o /dev/null -w 'ответ: %{http_code}\n' --data-urlencode "csrf=$T" --data-urlencode "text=Да, есть. Сколько нужно?" "https://$H$cid/reply"
          curl -sk $R -H 'Origin: https://nashdekor.ru' "https://$H/api/chat?sid=$SID&after=0" | python3 -c "import json,sys; d=json.load(sys.stdin); print('клиент видит:', [(m['who'], m['text']) for m in d['msgs']])"
          post '{"sid":"'$SID'","text":"12 шт, телефон +7 921 555-44-33","name":"Ольга"}' >/dev/null
          curl -sk $R -c $J -b $J "https://$H$cid" | grep -o 'Заявка №[0-9]* · [^<]*' | head -n1
          curl -sk $R -c $J -b $J https://$H/settings | grep -o 'Чат на сайте<span class="d">[^<]*\|pill good">работает\|pill warn">новых [0-9]*' | head -n3
      - name: Точка Банк — страницы, вебхук, ключ банка, опрос
        run: |
          set +e
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j6; CA=/opt/prostranstvo-crm/src/crm/russian_trusted_ca.pem; ok=1
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          echo "/money: $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' https://$H/money)"
          curl -sk $R -c $J -b $J https://$H/settings | grep -o 'Точка Банк<span class="d">[^<]*\|pill">не подключена\|id="tochka"' | head -n3
          echo "--- TLS Точки: без сертификата Минцифры / с ним (только для Точки):"
          curl -s -m 20 -o /dev/null https://enter.tochka.com/doc/openapi/static/keys/public; echo "системные корни Ubuntu: curl exit $? (60 — сертификат неизвестен)"
          curl -s -m 20 --cacert $CA -o /dev/null -w 'с russian_trusted_ca.pem: %{http_code}\n' https://enter.tochka.com/doc/openapi/static/keys/public
          echo "--- открытый ключ Точки:"; curl -s -m 20 --cacert $CA https://enter.tochka.com/doc/openapi/static/keys/public | head -c 300; echo
          echo "--- API Точки без ключа (формат ошибки):"; curl -s -m 20 --cacert $CA -w '\nHTTP %{http_code}\n' https://enter.tochka.com/uapi/open-banking/v1.0/customers | head -c 400; echo
          c=$(curl -sk $R -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: text/plain' --data 'x' https://$H/api/tochka/webhook); echo "вебхук — мусор: $c (ждём 400)"; [[ $c == 400 ]] || ok=0
          B=$(python3 -c "import base64,json;e=lambda d:base64.urlsafe_b64encode(json.dumps(d).encode()).rstrip(b'=').decode();print(e({'alg':'RS256','typ':'JWT'})+'.'+e({'webhookType':'acquiringInternetPayment','customerCode':'300123123','operationId':'x','status':'APPROVED'})+'.c2ln')")
          c=$(curl -sk $R -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: text/plain' --data "$B" https://$H/api/tochka/webhook); echo "вебхук с поддельной подписью: $c (ждём 400: CRM скачала ключ банка и подпись не сошлась)"; [[ $c == 400 ]] || ok=0
          n=$(sudo sqlite3 /var/lib/prostranstvo/crm.db "select length(value) from settings where key='tochka_jwk'"); echo "ключ банка в CRM: ${n:-0} символов"; [[ ${n:-0} -gt 100 ]] || ok=0
          sudo journalctl -u prostranstvo-crm --no-pager -n 20 | grep -i 'точка' | tail -n 3 | cut -c1-200
          echo "--- подпись настоящего вебхука Точки (тестовая отправка банка из открытой интеграции) — ключом с сайта Точки, кодом CRM:"
