name: crm-test
# Проверка setup-crm.sh на чистой Ubuntu 24.04: сайт → почта → CRM, вход, заявки, защита.
on:
  push:
    branches: [domain-check]
    paths: ["crm-test/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка раннера
        run: |
          cp crm-test/*.sh .
          sudo systemctl stop apache2 nginx mysql postgresql 2>/dev/null || true
          sudo apt-get purge -y -q 'apache2*' >/dev/null 2>&1 || true
          shellcheck -S warning -e SC2034,SC1090,SC1091 setup-crm.sh || true
      - name: Сайт и почта
        run: |
          sudo bash setup-prostranstvo.sh nashdekor.ru test@example.com --force 2>&1 | tail -n 5
          sudo bash setup-pochta.sh 2>&1 | grep -E 'ПОЧТА|НЕТ|ВНИМАНИЕ' || true
      - name: CRM — установка
        run: sudo bash setup-crm.sh 2>&1
      - name: CRM — повторная установка (пароли не меняются)
        run: |
          before=$(sudo md5sum /etc/prostranstvo/crm-paroli.txt)
          sudo bash setup-crm.sh 2>&1 | tail -n 14
          after=$(sudo md5sum /etc/prostranstvo/crm-paroli.txt)
          [[ $before == "$after" ]] && echo "ПАРОЛИ НЕ ИЗМЕНИЛИСЬ — хорошо" || { echo "ПАРОЛИ ИЗМЕНИЛИСЬ"; exit 1; }
      - name: CRM — вход и работа через https
        run: |
          set -e
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok); echo "csrf ${T:0:5}…"
          code=$(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login)
          echo "вход: $code"; [[ $code == 302 ]]
          curl -sk $R -c $J -b $J https://$H/ | grep -q 'Сегодня' && echo "главная открылась"
          T=$(curl -sk $R -c $J -b $J https://$H/deals/new | tok)
          loc=$(curl -sk $R -c $J -b $J -o /dev/null -w '%{redirect_url}' --data-urlencode "csrf=$T" --data-urlencode "name=Тест Клиент" --data-urlencode "phone=+7 900 000 00 00" --data-urlencode "source=avito" --data-urlencode "want=A912 на стену" https://$H/deals/new)
          echo "новая заявка: $loc"; [[ $loc == */deals/* ]]
          T=$(curl -sk $R -c $J -b $J "$loc" | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "article=A912" --data-urlencode "qty=10" "$loc/lines"
          curl -sk $R -c $J -b $J "$loc" | grep -o '[0-9 ]*₽' | head -n 3
          curl -sk $R -c $J -b $J https://$H/stock | grep -c 'name="qty"' | xargs echo "строк на складе:"
          for p in /board /clients /tasks /reports /settings; do echo "$p $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' https://$H$p)"; done
          curl -sk $R -I https://$H/login | grep -iE 'content-security|strict-transport|x-frame' || true
      - name: Заявка с сайта (выключена → включена) и письмо на zakaz@
        run: |
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"
          body='{"name":"Сайт Тест","contact":"+7 911 222-33-44","consent":true,"message":"Нужен расчёт","consentVersion":"2026-10-29"}'
          curl -sk $R -o /dev/null -w 'выключено: %{http_code}\n' -H 'Origin: https://nashdekor.ru' -H 'Content-Type: application/json' -d "$body" https://$H/api/lead
          sudo prostranstvo-crm site-leads on
          sleep 3
          curl -sk $R -D - -H 'Origin: https://nashdekor.ru' -H 'Content-Type: application/json' -d "$body" https://$H/api/lead | grep -iE '^HTTP|access-control-allow-origin|"ok"'
          curl -sk $R -o /dev/null -w 'preflight: %{http_code}\n' -X OPTIONS -H 'Origin: https://nashdekor.ru' -H 'Access-Control-Request-Method: POST' https://$H/api/lead
          sleep 8
          echo "писем у zakaz@: $(sudo doveadm search -u zakaz@nashdekor.ru mailbox INBOX all | wc -l)"
          f=$(sudo ls -1t /var/mail/vhosts/nashdekor.ru/zakaz/Maildir/new/ 2>/dev/null | head -n1)
          [[ -n $f ]] && sudo grep -m4 -E '^(Subject|From|To|DKIM-Signature):' "/var/mail/vhosts/nashdekor.ru/zakaz/Maildir/new/$f" || echo "письма на zakaz@ нет"
          sudo journalctl -t postfix/lmtp -t postfix/smtpd --no-pager -n 6 | cut -c1-200
      - name: Счётчик — свои IP не считаются, обнуление
        run: |
          set -e
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j2
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          cnt() { sudo python3 -c "import sqlite3;print(sqlite3.connect('/var/lib/prostranstvo/crm.db').execute('select count(*) from visits').fetchone()[0])"; }
          hit() { curl -s -o /dev/null -w '%{http_code} ' -H "X-Forwarded-For: $1" -H 'Origin: https://nashdekor.ru' -H 'Content-Type: text/plain' -H 'User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) AppleWebKit/605.1.15 Version/18.1 Mobile/15E148 Safari/604.1' -d '{"e":[["view","/"]],"r":"","u":"","m":1}' http://127.0.0.1:8081/api/hit; }
          hit 198.51.100.7; sleep 1; a=$(cnt); echo "отметок после чужого захода: $a"; [[ $a -ge 1 ]]
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          T=$(curl -sk $R -c $J -b $J https://$H/settings | tok)
          curl -sk $R -c $J -b $J -o /dev/null -w 'свои IP сохранены: %{http_code}\n' --data-urlencode "csrf=$T" --data-urlencode "ips=198.51.100.7" https://$H/settings/hit-ips
          curl -sk $R -c $J -b $J https://$H/settings | grep -o 'Обнулить статистику ([0-9]*)'
          hit 198.51.100.7; hit 198.51.100.7; sleep 1; b=$(cnt); echo "после своих заходов: $b (должно быть $a)"; [[ $b -eq $a ]]
          hit 203.0.113.77; sleep 1; c=$(cnt); echo "после чужого: $c (должно быть больше $a)"; [[ $c -gt $a ]]
          T=$(curl -sk $R -c $J -b $J https://$H/settings | tok)
          curl -sk $R -c $J -b $J -o /dev/null -w 'обнуление: %{http_code}\n' --data-urlencode "csrf=$T" --data-urlencode "reset=1" https://$H/settings/hit-ips
          d=$(cnt); echo "после обнуления: $d"; [[ $d -eq 0 ]]
      - name: Воронка — автозадачи, стража «Расчёт отправлен», заказ с сайта
        run: |
          set -e
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j3
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          # заказ с сайта («Купить»): позиции сразу в расчёте, адрес, задача «Связаться»
          body='{"name":"Покупатель","contact":"+7 921 000-11-22","email":"buyer@example.com","consent":true,"intent":"buy","address":"СПб, Невский пр., 1","message":"Хочу купить","calc":"Товар: A912 (реечная панель) — 6 шт, цвет: белый\nИтого ≈ 5 940 ₽","consentVersion":"2026-10-29"}'
          id=$(curl -sk $R -H 'Origin: https://nashdekor.ru' -H 'Content-Type: application/json' -d "$body" https://$H/api/lead | grep -o '"id": *[0-9]*' | grep -o '[0-9]*')
          echo "заказ с сайта: сделка №$id"; [[ -n $id ]]
          page=$(curl -sk $R -c $J -b $J https://$H/deals/$id)
          echo "$page" | grep -q 'ЗАКАЗ' && echo "помечен как ЗАКАЗ"
          echo "$page" | grep -q 'Невский' && echo "адрес доставки записан"
          echo "$page" | grep -q 'A912' && echo "позиция A912 в расчёте"
          echo "$page" | grep -o 'Следующий шаг: <a href="#tasks">[^<]*' | sed 's/.*">//'
          # «Дальше» из «Новая» → «В работе», затем «Дальше» → «Расчёт отправлен» должен сработать только через письмо
          T=$(echo "$page" | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "next=1" https://$H/deals/$id/stage
          curl -sk $R -c $J -b $J https://$H/deals/$id | grep -o 'Следующий шаг: <a href="#tasks">[^<]*' | sed 's/.*">/после «В работе»: /'
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "next=1" https://$H/deals/$id/stage
          page=$(curl -sk $R -c $J -b $J https://$H/deals/$id)
          echo "$page" | grep -o 'Расчёт отправлен на [^,]*' || echo "$page" | grep -o 'Этап не сменён[^<]*'
          echo "$page" | grep -o '<option value="[a-z]*" selected' | sed 's/.*value="/этап: /;s/" selected//'
          echo "$page" | grep -o 'Следующий шаг: <a href="#tasks">[^<]*' | sed 's/.*">/задача: /'
          sleep 6; echo "писем у buyer (локально не доставляется — смотрим очередь postfix):"; sudo postqueue -p | tail -n 3 || true
          curl -sk $R -c $J -b $J 'https://'$H'/board?hot=1' | grep -o 'горит [0-9]*\|card warm\|card hot' | sort | uniq -c
      - name: fail2ban видит подбор пароля
        run: |
          for i in $(seq 1 9); do curl -s -o /dev/null -H 'X-Forwarded-For: 203.0.113.5' --data 'login=yulia&password=bad' http://127.0.0.1:8081/login; done
          T=$(curl -s -c /tmp/k -b /tmp/k http://127.0.0.1:8081/login | grep -o 'name="csrf" value="[^"]*"' | sed 's/.*value="//;s/"$//')
          for i in $(seq 1 9); do curl -s -o /dev/null -c /tmp/k -b /tmp/k -H 'X-Forwarded-For: 203.0.113.5' --data-urlencode "csrf=$T" --data 'login=yulia&password=bad-password' http://127.0.0.1:8081/login; done
          sleep 5
          sudo journalctl -u prostranstvo-crm --no-pager -n 3 | cut -c1-160
          sudo fail2ban-client status prostranstvo-crm | grep -E 'Total failed|Banned IP'
      - name: Страница CRM «Сервер»
        if: always()
        run: |
          mkdir -p status; O=status/crm-server-page.md
          {
          echo "# Страница CRM «Сервер» — $(date -u '+%F %H:%M') UTC"; echo; echo '```'
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j2
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          echo "cron: $(grep -c server-page /etc/cron.d/prostranstvo-crm) строк"
          echo "файл отчёта: $(sudo stat -c '%U %a %s байт' /var/lib/prostranstvo/server-status.txt 2>&1)"
          echo "/server: $(curl -sk $R -c $J -b $J -o /tmp/srv.html -w '%{http_code}' https://$H/server)"
          grep -c 'Обновлено' /tmp/srv.html | xargs echo "строк «Обновлено» на странице:"
          T=$(curl -sk $R -c $J -b $J https://$H/server | tok)
          echo "кнопка Обновить: $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' --data-urlencode "csrf=$T" https://$H/server/refresh)"
          echo "просьба на диске: $(sudo ls /var/lib/prostranstvo/server-request 2>&1)"
          sudo /usr/local/sbin/prostranstvo-crm server-page; echo "после cron просьба: $(sudo ls /var/lib/prostranstvo/server-request 2>&1 | head -c 60)"
          echo; echo "--- отчёт (начало) ---"
          sudo head -n 60 /var/lib/prostranstvo/server-status.txt
          echo '```'
          } > "$O" 2>&1
          cat "$O"
          git config user.name crm-test; git config user.email crm-test@users.noreply.github.com
          git add status; git commit -m "crm-test server page $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check || true
      - name: Счётчик посещений (вкладка «Сайт»)
        if: always()
        run: |
          mkdir -p status; O=status/crm-site-stats.md
          {
          echo "# Счётчик посещений — $(date -u '+%F %H:%M') UTC"; echo; echo '```'
          H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j3
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.1 Mobile/15E148 Safari/604.1'
          B='{"e":[["view","/",""],["sec","catalog",""],["item","A907","use"],["item","A910","ask"],["calcpanel","A910",""],["3d","",""],["lead","",""]],"r":"yandex.ru","u":"","m":1}'
          echo "--- отметка с сайта:"
          curl -sk $R -D - -o /dev/null -A "$UA" -H 'Origin: https://nashdekor.ru' -H 'Content-Type: text/plain;charset=UTF-8' --data-binary "$B" https://$H/api/hit | grep -iE '^HTTP|set-cookie' || true
          echo "cookie посетителю: $(curl -sk $R -D - -o /dev/null -A "$UA" -H 'Origin: https://nashdekor.ru' --data-binary "$B" https://$H/api/hit | grep -ci set-cookie)"
          echo "чужой сайт: $(curl -sk $R -o /dev/null -w '%{http_code}' -A "$UA" -H 'Origin: https://evil.example' --data-binary "$B" https://$H/api/hit)"
          echo "бот: $(curl -sk $R -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (compatible; YandexBot/3.0)' -H 'Origin: https://nashdekor.ru' --data-binary "$B" https://$H/api/hit)"
          echo "записей в базе: $(sudo sqlite3 /var/lib/prostranstvo/crm.db 'select count(*) from visits' 2>&1)"
          echo "IP в базе: $(sudo sqlite3 /var/lib/prostranstvo/crm.db 'select count(*) from visits where vid like "%127.0.0.1%" or key like "%127.0.0.1%" or src like "%127.0.0.1%"' 2>&1)"
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          echo "/site: $(curl -sk $R -c $J -b $J -o /tmp/site.html -w '%{http_code}' 'https://'$H'/site?d=1')"
          for s in 'Посещаемость сайта' 'A907' 'A910' 'Яндекс' 'Телефон' 'Отправили заявку'; do echo "  «$s»: $(grep -c "$s" /tmp/site.html)"; done
          echo "вкладка «Сайт» в меню: $(curl -sk $R -c $J -b $J https://$H/board | grep -c 'ic-site')"
          echo "на «Сегодня»: $(curl -sk $R -c $J -b $J https://$H/ | grep -o 'На сайте сегодня: [0-9]* [а-я]*')"
          echo "свой визит (вошли в CRM) записался: $(curl -sk $R -c $J -b $J -o /dev/null -w '%{http_code}' -A "$UA" -H 'Origin: https://nashdekor.ru' --data-binary "$B" https://$H/api/hit); записей: $(sudo sqlite3 /var/lib/prostranstvo/crm.db 'select count(*) from visits')"
          echo "X-Robots-Tag CRM: $(curl -sk $R -I https://$H/login | grep -i x-robots | tr -d '\r')"
          echo "тесты CRM при установке: $(sudo grep -c 'FAILED\|Error' /var/log/prostranstvo-crm-setup-details.log) ошибок; $(sudo grep -o 'Ran [0-9]* tests' /var/log/prostranstvo-crm-setup-details.log | tail -n1)"
          echo '```'
          } > "$O" 2>&1
          cat "$O"
          git config user.name crm-test; git config user.email crm-test@users.noreply.github.com
          git add status; git commit -m "crm-test site stats $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check || true
      - name: Кнопки страницы «Сервер»
        if: always()
        run: |
          mkdir -p status; O=status/crm-server-actions.md
          {
          echo "# Кнопки «Сервер» — $(date -u '+%F %H:%M') UTC"; echo; echo '```'
          D=/var/lib/prostranstvo; H=crm.nashdekor.ru; R="--resolve $H:443:127.0.0.1"; J=/tmp/j4
          run_page() { sudo timeout 1800 /usr/local/sbin/prostranstvo-crm server-page; echo "  (server-page код $?)"; }
          state() { sudo sed -n 's/^Состояние: //p' $D/server-action.txt 2>/dev/null | head -n1; }
          tok() { grep -o 'name="csrf" value="[^"]*"' | head -n1 | sed 's/.*value="//;s/"$//'; }
          PW=$(sudo awk '$1=="yulia"{print $2}' /etc/prostranstvo/crm-paroli.txt)
          T=$(curl -sk $R -c $J -b $J https://$H/login | tok)
          curl -sk $R -c $J -b $J -o /dev/null --data-urlencode "csrf=$T" --data-urlencode "login=yulia" --data-urlencode "password=$PW" https://$H/login
          press() { local t; t=$(curl -sk $R -c $J -b $J https://$H/server | tok); curl -sk $R -c $J -b $J -o /dev/null -w "%{http_code}" --data-urlencode "csrf=$t" --data-urlencode "action=$1" ${2:+--data-urlencode "confirm=1"} https://$H/server/run; }
          echo "1) кнопка «Копия баз»: $(press backup); просьба: $(sudo cat $D/server-request 2>&1)"; run_page; echo "   состояние: $(state)"
          echo "   на странице: $(curl -sk $R -c $J -b $J https://$H/server | grep -c 'Сделать копию баз')"
          echo "2) «Выключить заявки»: $(press leads-off)"; run_page; echo "   состояние: $(state); SITE_LEADS=$(sudo grep -o 'SITE_LEADS=.' /etc/prostranstvo/crm.env)"
          echo "   «Включить заявки»: $(press leads-on)"; run_page; echo "   состояние: $(state); SITE_LEADS=$(sudo grep -o 'SITE_LEADS=.' /etc/prostranstvo/crm.env)"
          echo "3) «Перезапустить CRM»: $(press restart-crm)"; run_page; echo "   состояние: $(state)"; sleep 3
          echo "4) «Перезапустить почту»: $(press restart-mail)"; run_page; echo "   состояние: $(state)"
          echo "5) «Перезапустить веб-сервер»: $(press reload-web)"; run_page; echo "   состояние: $(state)"
          echo "6) «Снять блокировки»: $(press unban)"; run_page; echo "   состояние: $(state)"
          echo "7) «Обновить сайт»: $(press sync)"; run_page; echo "   состояние: $(state)"
          echo "8) чужая команда в файле-просьбе:"
          sudo -u prostranstvo bash -c "printf 'rm -rf / x\n' > $D/server-request"; before=$(sudo md5sum $D/server-action.txt); run_page
          echo "   файл результата не изменился: $([[ $(sudo md5sum $D/server-action.txt) == "$before" ]] && echo да || echo НЕТ)"; sudo journalctl -t prostranstvo-server --no-pager -n 3 | grep -o 'неизвестное.*' | tail -n1
          echo "   FIFO вместо файла:"; sudo -u prostranstvo mkfifo $D/server-request; run_page; echo "   FIFO убран: $([[ -e $D/server-request ]] && echo НЕТ || echo да)"
          echo "   ссылка на /etc/shadow вместо результата:"; sudo -u prostranstvo ln -sfn /etc/shadow $D/server-action.txt; echo "   нажатие: $(press backup)"; run_page; echo "   результат — обычный файл: $([[ -L $D/server-action.txt ]] && echo НЕТ || echo да); /etc/shadow цел: $(sudo head -c 5 /etc/shadow | grep -c root)"
          echo "   перезагрузка без галочки: $(press reboot); просьба: $(sudo ls $D/server-request 2>&1 | grep -c request)"
          echo "9) «Обновить CRM» (полное обновление):  $(press update)"; run_page; echo "   состояние: $(state)"
          sudo tail -n 12 $D/server-action.txt
          echo "   CRM после обновления: $(curl -sk $R -o /dev/null -w '%{http_code}' https://$H/login); на странице: $(curl -sk $R -c $J -b $J https://$H/server | grep -c 'CRM УСТАНОВЛЕНА')"
          echo '```'
          } > "$O" 2>&1
          cat "$O"
          git config user.name crm-test; git config user.email crm-test@users.noreply.github.com
          git add status; git commit -m "crm-test server actions $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check || true
      - name: Состояние
        if: always()
        run: |
          sudo prostranstvo-crm || true
          sudo prostranstvo-crm backup && echo 'копия: ок'; sudo bash -c 'ls -la /var/backups/prostranstvo/*/' | head
          systemctl show prostranstvo-crm -p MemoryCurrent
          sudo tail -n 40 /var/log/prostranstvo-crm-setup-details.log
