name: shorts-barsik
on:
  push:
    branches: [shorts]
    paths: [run.txt]
  workflow_dispatch:
    inputs:
      count:
        description: 'Сколько роликов сделать (1–3)'
        default: '2'
      episode:
        description: 'Серия (номер/часть названия/ID) — пусто = по очереди'
        default: ''
permissions:
  contents: write
concurrency: shorts-barsik
jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: mebel
          path: mebel
      - name: tools
        run: |
          python3 -m pip install -q -U yt-dlp
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core > /dev/null
      - name: cut
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ github.event.inputs.count }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: python3 cut.py
      - name: save state
        run: |
          git config user.name "shorts-bot"
          git config user.email "noreply@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "shorts: $(date -u +%F)"
          git push origin HEAD:shorts || true
          cd mebel
          git config user.name "shorts-bot"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "shorts feed $(date -u +%F)"
          git pull --rebase origin mebel || true
          git push origin HEAD:mebel || true
      - name: проверка сервера
        run: |
          sleep 80
          echo "--- страница:"; curl -s -o /dev/null -w "%{http_code} %{size_download} байт\n" http://89.126.192.214:8080/mebel/s9kbars/
          echo "--- лента:"; curl -s http://89.126.192.214:8080/mebel/s9kbars/feed.json | python3 -c "import json,sys; f=json.load(sys.stdin); print('обновлено', f.get('updated')); [print(' ', i['date'], i['file'], '|', i['title']) for i in f['items']]"
          echo "--- скачивание ролика:"; curl -sL -o /dev/null -w "%{http_code} %{size_download} байт\n" "$(curl -s http://89.126.192.214:8080/mebel/s9kbars/feed.json | python3 -c "import json,sys; print(json.load(sys.stdin)['items'][0]['url'])")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-out
          path: |
            out/*.mp4
            out/*.jpg
            out/log.txt
          retention-days: 5
