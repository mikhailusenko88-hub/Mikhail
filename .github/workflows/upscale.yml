name: upscale
# Увеличение фото товаров «Наш декор» нейросетью (Real-ESRGAN через spandrel, CPU).
# Запуск — изменение run.txt в ветке img-upscale. Строка: «<имя> model=<general|x4plus|both> files=<A907.jpg,3-7.jpg|all> scale=2».
# Результат — out/<имя>/<model>/<файл>.jpg (в 2 раза больше исходника) и сравнение out/<имя>/compare_*.jpg.
on:
  push:
    branches: [img-upscale]
    paths: ['run.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upscale
  cancel-in-progress: false
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: img-upscale, path: work, fetch-depth: 1 }
      - uses: actions/checkout@v4
        with: { ref: mebel, path: site, fetch-depth: 1, sparse-checkout: 0f7s1eez/img, sparse-checkout-cone-mode: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Библиотеки
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q spandrel pillow numpy
      - name: Веса моделей
        run: |
          mkdir -p w
          curl -sSL -o w/general.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -sSL -o w/x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          ls -la w
      - name: Увеличить
        run: |
          cd work
          python upscale.py "$(tail -n 1 run.txt)" ../site/0f7s1eez/img ../w
      - name: Сохранить
        run: |
          cd work
          git config user.name "upscale"; git config user.email "upscale@users.noreply.github.com"
          git add out
          git commit -q -m "upscale: $(tail -n 1 run.txt | cut -d' ' -f1)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin img-upscale && git push -q origin HEAD:img-upscale && break; sleep 5; done
