name: Авито — фид из CRM

# Раз в час берёт цены и свободные остатки из CRM (https://crm.nashdekor.ru/api/catalog),
# собирает фид Авито генератором из ветки avito и, если что-то поменялось,
# кладёт его в ветку mebel: 0f7s1eez/avito.xml → https://nashdekor.ru/avito.xml.
# Если CRM не ответила, фид не собирается и на сайте остаётся прежний.

on:
  schedule:
    - cron: "17 * * * *"      # каждый час в :17 (UTC; в МСК тоже :17)
  push:
    branches: [main]
    paths: [".github/workflows/avito-feed.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avito-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Генератор (ветка avito)
        uses: actions/checkout@v4
        with:
          ref: avito
          path: avito
          fetch-depth: 1

      - name: Сайт (ветка mebel, только каталог)
        uses: actions/checkout@v4
        with:
          ref: mebel
          path: mebel
          fetch-depth: 1
          sparse-checkout: 0f7s1eez
          sparse-checkout-cone-mode: true

      - name: Собрать фид с ценами и наличием из CRM
        id: build
        run: |
          set -o pipefail
          python3 avito/build_feed.py avito/config.json \
            --catalog=mebel/0f7s1eez/index.html --out=new_avito.xml | tee build.log
          {
            echo "### Фид Авито"
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Опубликовать, если изменился
        run: |
          if cmp -s new_avito.xml mebel/0f7s1eez/avito.xml; then
            echo "Фид не изменился — публиковать нечего." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp new_avito.xml mebel/0f7s1eez/avito.xml
          cd mebel
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 0f7s1eez/avito.xml
          git commit -q -m "Фид Авито: цены и наличие из CRM ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for i in 1 2 3; do
            if git push -q origin HEAD:mebel; then
              echo "Фид обновлён и опубликован." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git pull -q --rebase --depth 50 origin mebel || true
            sleep 5
          done
          echo "Не удалось отправить фид в ветку mebel." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
