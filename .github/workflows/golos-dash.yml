name: golos-dash
# Проба: что ставить на месте тире, чтобы была пауза, а голос перед ней не падал как перед точкой.
# Одни и те же фразы — несколькими способами (строки mode: в dash_request.txt). Ветки бота не меняются.
on:
  push:
    branches: [golos]
    paths: [dash_request.txt]
permissions:
  contents: write
jobs:
  dash:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo mkdir -p /opt/multik-tts && sudo chown $USER /opt/multik-tts
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
            /opt/multik-tts/hf
            /opt/multik-tts/v5_cis_base.pt
          key: golos-probe-v1
      - name: Озвучщик бота + пробные правила
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          git clone -q --depth 1 --branch pochemu-albina --single-branch https://github.com/mikhailusenko88-hub/Mikhail pa
          cp stage/patch_server.py stage/albina.py stage/albina_fix.json pa/
          python -m venv /opt/multik-tts/venv
          timeout 900 /opt/multik-tts/venv/bin/pip install -q --timeout 30 --retries 5 torch --index-url https://download.pytorch.org/whl/cpu
          timeout 600 /opt/multik-tts/venv/bin/pip install -q --timeout 30 --retries 5 numpy ruaccent praat-parselmouth
          [ -s /opt/multik-tts/v5_cis_base.pt ] || curl -fsSL --retry 3 --connect-timeout 20 --max-time 900 -o /opt/multik-tts/v5_cis_base.pt https://models.silero.ai/models/tts/ru/v5_cis_base.pt
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 -o /opt/multik-tts/server.py https://raw.githubusercontent.com/mikhailusenko88-hub/Mikhail/mebel-3d/tools/multik/tts/server.py
          python pa/patch_server.py /opt/multik-tts/server.py
          cp pa/albina_worker.py /opt/multik-tts/
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth ruaccent matplotlib faster-whisper numpy
      - name: Озвучка и проверка каждым способом
        run: |
          BANK=$(grep '^bank:' dash_request.txt | cut -d: -f2 | tr -d ' '); BANK=${BANK:-dash_bank.json}
          mkdir -p dash_out
          grep '^mode:' dash_request.txt | while read -r _ TAG MODE MS; do
            echo "=== $TAG: $MODE $MS"
            rm -rf pa/albina_cache part_$TAG
            ( cd pa && BOT_DASH_MODE=$MODE BOT_DASH_MS=${MS:-220} ALBINA_NO_GH=1 python farm.py ../$BANK ../part_$TAG ) || continue
            python stage_check.py part_$TAG dash_out/$TAG.json || true
            mkdir -p dash_out/$TAG && cp part_$TAG/v/*.mp3 dash_out/$TAG/ && cp part_$TAG/index.json dash_out/$TAG/
          done
      - name: Commit result
        if: always()
        run: |
          git config user.name golos
          git config user.email golos@users.noreply.github.com
          mkdir -p /tmp/res && cp -r dash_out /tmp/res/ 2>/dev/null || true
          for i in 1 2 3 4 5 6; do
            git fetch -q origin golos && git reset -q --hard origin/golos
            mkdir -p dash_out && cp -r /tmp/res/dash_out/. dash_out/ 2>/dev/null || true
            git add -A dash_out 2>/dev/null || true
            git commit -qm "проба паузы на тире" || { echo nothing; break; }
            git push -q origin HEAD:golos && break
            sleep $((RANDOM % 15 + 5))
          done
