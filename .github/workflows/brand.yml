name: brand-assets
on:
  push:
    branches: [brand]
    paths: ['brand/build.py', '.github/workflows/brand.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q fonttools uharfbuzz pillow playwright
      - run: python brand/build.py
      - run: |
          git config user.name "brand"
          git config user.email "brand@users.noreply.github.com"
          git add -A brand/files
          git commit -m "brand files $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin brand && git push origin HEAD:brand
