name: site-check
# Проверка сайта снаружи (индексация, SEO, форма заявки без создания заявки). Запуск — изменение site-check.txt
# в ветке domain-check или вручную. Результат — status/site.md
on:
  push:
    branches: [domain-check]
    paths: ['site-check.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Проверить
        run: bash site_check.sh
      - name: Сохранить результат
        run: |
          git config user.name "site-check"
          git config user.email "site-check@users.noreply.github.com"
          git add status
          git commit -m "site $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check
