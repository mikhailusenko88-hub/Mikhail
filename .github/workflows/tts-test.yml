name: tts-test
on:
  push:
    branches: [multik-tts-test]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q "numpy<2" onnx onnxruntime
      - name: Probe
        run: python probe2.py 2>&1 | tail -80
        continue-on-error: true
      - name: Commit result
        if: always()
        run: |
          git config user.name tts-test; git config user.email tts-test@users.noreply.github.com
          rm -rf out/onnx; git add -A out; git commit -m "tts-test result" || echo nothing; git push
