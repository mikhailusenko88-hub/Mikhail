name: tts-test
on:
  push:
    branches: [multik-tts-test]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install -q "numpy<2" onnx onnxruntime "transformers==4.46.3"
      - name: Get current voice branch
        run: git clone -q --depth 1 -b multik-voice https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} vb
      - name: Probe xenia
        run: python probe_xenia.py > vb/probe_xenia_run.log 2>&1 || (tail -60 vb/probe_xenia_run.log; exit 1)
      - name: Publish
        if: always()
        run: |
          cd vb && git add -A && git -c user.name=voice-build -c user.email=voice-build@users.noreply.github.com commit -qm "xenia: разведка входов модели" && git push -q origin multik-voice
