name: svoy-bank
# Запас сценариев «Почему так?»: что бот выложил на сервере как будущие ролики (bank.json) — снять и положить в ветку
on:
  push:
    branches: [svoy-golos]
    paths: ['svoy-bank-request.txt']
permissions:
  contents: write
jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Снять
        run: |
          mkdir -p bank
          for i in 1 2 3; do curl -sS -m 40 -D bank/headers.txt -o bank/bank.json http://89.126.192.214:8080/albina/bank.json && break; sleep 10; done
          ls -la bank; head -c 600 bank/bank.json; echo
          python3 - <<'PY'
          import json
          d = json.load(open("bank/bank.json", encoding="utf-8"))
          sc = d.get("scripts", d) if isinstance(d, dict) else d
          print("ключи:", list(d)[:12] if isinstance(d, dict) else type(d))
          print("сценариев:", len(sc))
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name svoy-golos
          git config user.email svoy-golos@users.noreply.github.com
          git add -A bank
          git commit -m "svoy-bank result" || echo nothing
          for i in 1 2 3; do git fetch -q origin svoy-golos && git rebase -q FETCH_HEAD && git push origin HEAD:svoy-golos && break; sleep 5; done
