name: llm-probe
# Разведка для «Помощника» в «Замер 3D»: свежий llama.cpp для iPhone (xcframework, контрольная сумма, llama.h)
# и где лежат открытые модели Qwen в формате GGUF (имена файлов и размеры).
on:
  push:
    branches: [domain-check]
    paths: ["llm-probe/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp и модели
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p status/llm; O=status/llm.md
          {
          echo "# Нейросеть для телефона — $(date -u '+%F %H:%M') UTC"; echo; echo '```'
          R=$(curl -fsSL https://api.github.com/repos/ggml-org/llama.cpp/releases/latest || curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ggml-org/llama.cpp/releases/latest); echo "ответ API: ${#R} байт"
          TAG=$(jq -r .tag_name <<<"$R"); echo "llama.cpp: $TAG ($(jq -r .published_at <<<"$R"))"
          jq -r '.assets[]|select(.name|test("xcframework"))|.name+" "+(.size|tostring)+" "+.browser_download_url' <<<"$R"
          U=$(jq -r '[.assets[]|select(.name|test("xcframework.zip$"))][0].browser_download_url' <<<"$R")
          curl -fsSL -o /tmp/x.zip "$U" && echo "sha256: $(sha256sum /tmp/x.zip | cut -d' ' -f1)" && echo "url: $U"
          mkdir -p /tmp/x && cd /tmp/x && unzip -q /tmp/x.zip && cd - >/dev/null
          find /tmp/x -maxdepth 4 -type d | sed 's|/tmp/x/||' | head -40
          du -sh /tmp/x/*/*/* 2>/dev/null | head -20
          F=$(find /tmp/x -path '*ios-arm64/*' -name llama.h | head -n1); echo "llama.h: $F"
          cp "$F" status/llm/llama.h 2>/dev/null || true
          for h in ggml.h ggml-backend.h ggml-cpu.h ggml-metal.h gguf.h; do G=$(find /tmp/x -path '*ios-arm64/*' -name $h | head -n1); [ -n "$G" ] && cp "$G" status/llm/; done
          M=$(find /tmp/x -path '*ios-arm64/*' -name module.modulemap | head -n1); echo "--- module.modulemap"; cat "$M" 2>/dev/null
          P=$(find /tmp/x -maxdepth 2 -name Info.plist | head -n1); echo "--- Info.plist (xcframework)"; cat "$P" 2>/dev/null | head -80
          B=$(find /tmp/x -path '*ios-arm64/*' -type f -perm -u+x | head -n3); echo "--- бинарники ios-arm64:"; for b in $B; do ls -la "$b"; file "$b"; done
          echo; echo "=== Hugging Face"
          for id in Qwen/Qwen3.5-4B-GGUF unsloth/Qwen3.5-4B-GGUF Qwen/Qwen3.5-2B-GGUF unsloth/Qwen3.5-2B-GGUF unsloth/Qwen3-4B-Instruct-2507-GGUF Qwen/Qwen3-4B-Instruct-2507-GGUF bartowski/Qwen_Qwen3.5-4B-GGUF; do
            T=$(curl -fsS "https://huggingface.co/api/models/$id/tree/main" 2>/dev/null) || { echo "$id: нет"; continue; }
            echo "$id:"; jq -r '.[]|select(.path|test("(?i)(q4_k_m|q4_0|q5_k_m|q8_0).*gguf$"))|"  "+.path+" "+((.size//0)/1048576|floor|tostring)+" МБ"' <<<"$T" | head -8
            jq -r '.[]|select(.path|test("(?i)mmproj"))|"  (картинки) "+.path' <<<"$T" | head -2
          done
          echo; echo "=== проверка скачивания (первые 4 МБ) Qwen3.5-4B"
          for u in https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf https://huggingface.co/Qwen/Qwen3.5-4B-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf; do
            echo "$u → $(curl -sL -r 0-4194303 -o /tmp/h.bin -w '%{http_code} %{size_download}' "$u") $(head -c4 /tmp/h.bin 2>/dev/null)"
          done
          echo '```'
          } > "$O" 2>&1
          cat "$O"
          git config user.name llm-probe; git config user.email llm-probe@users.noreply.github.com
          git add status; git commit -m "llm-probe $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check
