name: golos-en
on:
  push:
    branches: [golos-en]
    paths: ['jobs.json', 'en_proby.py', 'request.txt', '.github/workflows/golos-en.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: golos-en
  cancel-in-progress: false
jobs:
  proby:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
          key: golos-en-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile edge-tts praat-parselmouth openai-whisper matplotlib
          python -m spacy download en_core_web_sm -q || true
      - name: Probes
        run: python en_proby.py
      - name: Commit result
        if: always()
        run: |
          git config user.name golos-en
          git config user.email golos-en@users.noreply.github.com
          git add -A out
          git commit -m "golos-en result" || echo nothing
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
