name: page-fetch
# Снять публичные страницы, которые не открываются из облака: список — pages/urls.txt (ветка domain-check).
# Результат — status/pages.md и status/pages/NN.txt (текст страницы + ссылки).
on:
  push:
    branches: [domain-check]
    paths: ['pages/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: page-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Снять страницы
        run: python3 pages/fetch.py
      - name: Сохранить
        run: |
          git config user.name page-fetch; git config user.email page-fetch@users.noreply.github.com
          git add status; git commit -m "page-fetch $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin domain-check || true
          git push origin HEAD:domain-check || true
