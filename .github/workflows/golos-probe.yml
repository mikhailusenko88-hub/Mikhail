name: golos-probe
# Пробы «было → стало» для бота «Почему так?»: озвучить фразы из probe_bank.json тем же способом, что бот
# (код из ветки pochemu-albina, только чтение), и проверить, куда встало ударение. Ветки бота не меняются.
on:
  push:
    branches: [golos]
    paths: [probe_request.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo mkdir -p /opt/multik-tts && sudo chown $USER /opt/multik-tts
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/torch
            /opt/multik-tts/hf
            /opt/multik-tts/v5_cis_base.pt
          key: golos-probe-v1
      - name: Озвучщик бота
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          git clone -q --depth 1 --branch pochemu-albina --single-branch https://github.com/mikhailusenko88-hub/Mikhail pa
          python -m venv /opt/multik-tts/venv
          timeout 900 /opt/multik-tts/venv/bin/pip install -q --timeout 30 --retries 5 torch --index-url https://download.pytorch.org/whl/cpu
          timeout 600 /opt/multik-tts/venv/bin/pip install -q --timeout 30 --retries 5 numpy ruaccent praat-parselmouth
          [ -s /opt/multik-tts/v5_cis_base.pt ] || curl -fsSL --retry 3 --connect-timeout 20 --max-time 900 -o /opt/multik-tts/v5_cis_base.pt https://models.silero.ai/models/tts/ru/v5_cis_base.pt
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 -o /opt/multik-tts/server.py https://raw.githubusercontent.com/mikhailusenko88-hub/Mikhail/mebel-3d/tools/multik/tts/server.py
          if grep -q '^mono' probe_request.txt; then python mono_patch.py pa/patch_server.py; fi
          python pa/patch_server.py /opt/multik-tts/server.py
          cp pa/albina_worker.py /opt/multik-tts/
      - name: Озвучка проб
        run: |
          cd pa && ALBINA_NO_GH=1 python farm.py ../probe_bank.json ../part
          ls -la ../part/v | head -40
      - name: Проверка проб
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth ruaccent matplotlib faster-whisper numpy
          TAG=${{ github.run_number }} python probe_check.py
      - name: Commit result
        if: always()
        run: |
          git config user.name golos
          git config user.email golos@users.noreply.github.com
          mkdir -p /tmp/res && cp -r probe_out /tmp/res/ 2>/dev/null || true
          for i in 1 2 3 4 5 6; do
            git fetch -q origin golos && git reset -q --hard origin/golos
            mkdir -p probe_out && cp -r /tmp/res/probe_out/. probe_out/ 2>/dev/null || true
            git add -A probe_out 2>/dev/null || true
            git commit -qm "пробы «Почему так?»: было → стало" || { echo nothing; break; }
            git push -q origin HEAD:golos && break
            sleep $((RANDOM % 15 + 5))
          done
