name: golos-probe
on:
  push:
    branches: [golos]
    paths: [probe_request.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Проба
        run: |
          swiftc -O tts_probe.swift -o /tmp/pr 2>&1 | tail -5
          N=$(python3 -c "import json;print(len(json.load(open('probe_jobs.json'))))"); mkdir -p /tmp/po
          for i in $(seq 0 $((N-1))); do perl -e 'alarm 90; exec @ARGV' /tmp/pr probe_jobs.json /tmp/po $i 2>&1 | tail -1 || echo "СБОЙ $i"; done
          mkdir -p /tmp/pv/v && for f in /tmp/po/*.caf; do n=$(basename "$f" .caf); afconvert -f WAVE -d LEI16@24000 -c 1 "$f" /tmp/pv/v/$n.wav 2>/dev/null || echo "не читается: $n"; done
          cp probe_jobs.json /tmp/pv/
      - name: В ветку
        run: |
          cd /tmp/pv && git init -q -b golos-probe-out && git config user.name golos && git config user.email golos@users.noreply.github.com
          git add -A && git commit -qm "проба: от чего зависит чтение"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:golos-probe-out
