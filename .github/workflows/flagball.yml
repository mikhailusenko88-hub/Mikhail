name: Flagball Arena — гонка

on:
  schedule:
    - cron: "30 3 * * *"    # 06:30 МСК → ролик на канале ~07:00
    - cron: "30 11 * * *"   # 14:30 МСК → ~15:00
    - cron: "30 19 * * *"   # 22:30 МСК → ~23:00
  push:
    branches: [flagball]
    paths: [request.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flagball
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flagball
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Подготовка
        run: bash ci_setup.sh
      - name: Гонка
        env:
          FLAGBALL_YT: ${{ secrets.FLAGBALL_YT }}
          EVENT: ${{ github.event_name }}
        run: python ci_run.py
      - name: Сохранить сезон и отчёт
        if: always()
        run: bash ci_commit.sh
