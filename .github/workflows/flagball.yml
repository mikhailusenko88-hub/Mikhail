name: Flagball Arena — гонка

on:
  schedule:
    - cron: "30 3 * * *"    # 06:30 МСК → ролик на канале ~07:00
    - cron: "30 11 * * *"   # 14:30 МСК → ~15:00
    - cron: "30 19 * * *"   # 22:30 МСК → ~23:00
  push:
    branches: [flagball]
    paths: [request.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flagball
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flagball
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Подготовка
        run: |
          pip install -q numpy pillow requests
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          gcc -O2 -o phys phys.c -lm
      - name: Гонка
        env:
          FLAGBALL_YT: ${{ secrets.FLAGBALL_YT }}
          EVENT: ${{ github.event_name }}
        run: python ci_run.py
      - name: Сохранить лигу и отчёт
        if: always()
        run: |
          git config user.name "flagball-bot"
          git config user.email "flagball-bot@users.noreply.github.com"
          git add league_state.json races status
          git diff --cached --quiet && exit 0
          git commit -qm "$(head -1 status/last.txt | cut -c1-120)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin flagball && git push -q origin HEAD:flagball && break
            sleep 7
          done
