name: golos-mac
# Голос iPhone (Пик, Рон в «Мультиках») на машине Mac: те же реплики без подсказок ударений и с подсказками (IPA), потом «слух» на Linux.
on:
  push:
    branches: [golos]
    paths: [mac_request.txt]
permissions:
  contents: write
jobs:
  voice:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Голос iPhone
        run: |
          swiftc -O tts_mac.swift -o /tmp/tts 2>&1 | tail -5
          N=$(python3 -c "import json;print(len(json.load(open('mac_jobs.json'))))"); mkdir -p /tmp/mac_out
          for i in $(seq 0 $((N-1))); do perl -e 'alarm 60; exec @ARGV' /tmp/tts mac_jobs.json /tmp/mac_out $i 2>&1 | tail -2 || echo "СБОЙ $i"; done
          mkdir -p /tmp/mv/v && for f in /tmp/mac_out/*.caf; do n=$(basename "$f" .caf); afconvert -f WAVE -d LEI16@24000 -c 1 "$f" /tmp/mv/v/$n.wav 2>/dev/null || echo "не читается: $n"; done
          cp mac_index.json /tmp/mv/index.json
          ls /tmp/mv/v | wc -l
      - name: Звук в ветку golos-mac-voice
        run: |
          cd /tmp/mv && git init -q -b golos-mac-voice19 && git config user.name golos && git config user.email golos@users.noreply.github.com
          git add -A && git commit -qm "голос iPhone: реплики без подсказок (a) и с подсказками ударений (b)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:golos-mac-voice19
