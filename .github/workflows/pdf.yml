name: brandbook-pdf
on:
  push:
    branches: [brandbook]
    paths: ['brandbook.html', 'make_pdf.py']
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright
      - run: python make_pdf.py
      - run: |
          git config user.name "brandbook"
          git config user.email "brandbook@users.noreply.github.com"
          git add -A "*.pdf" preview
          git commit -m "pdf $(date -u +%F_%H:%M)" || exit 0
          git pull --rebase origin brandbook && git push origin HEAD:brandbook
