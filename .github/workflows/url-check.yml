name: url-check
# Проверить, что страницы на сервере отдаются целиком: список адресов — urls.txt, отчёт — status/urls.txt
on:
  push:
    branches: [srv-check]
    paths: ['urls.txt']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: check urls
        run: |
          mkdir -p status
          { echo "Проверка: $(date -u '+%Y-%m-%d %H:%M UTC')"
            grep -v '^#' urls.txt | grep -v '^$' | while read -r u; do
              curl -s -o /tmp/f -w "%{http_code} %{size_download} %{content_type} $u\n" --max-time 90 "$u" || echo "000 0 - $u"
            done; } > status/urls.txt 2>&1
          cat status/urls.txt
      - name: save
        run: |
          git config user.name "srv-check"; git config user.email "srv-check@users.noreply.github.com"
          git add status; git commit -m "url status" || exit 0
          git pull --rebase origin srv-check || true; git push origin HEAD:srv-check
