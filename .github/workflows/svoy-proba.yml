name: svoy-proba
# Проба «образец → свой голос» на фразах вне подбора: лучший тембр + лучшая манера — svoy_proba.py. Запрос: svoy-proba-request.txt
on:
  push:
    branches: [svoy-golos]
    paths: ['svoy-proba-request.txt']
permissions:
  contents: write
concurrency:
  group: svoy-proba
  cancel-in-progress: false
jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [n4, xenia, kseniya]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
            ~/.cache/torch
            models
          key: sluh2-cache-v1
          restore-keys: |
            pik-free-cache-v2
            svoy-free-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth openai-whisper ruaccent matplotlib resemblyzer pyworld speechbrain scipy cma
      - run: python svoy_proba.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PB-${{ matrix.target }}
          path: cast10/proba_*
          retention-days: 7
  final:
    needs: [proba]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 'PB-*'
          merge-multiple: true
          path: cast10/
      - name: Commit
        timeout-minutes: 5
        run: |
          git config user.name svoy-golos
          git config user.email svoy-golos@users.noreply.github.com
          rm -rf /tmp/res && cp -r cast10 /tmp/res
          for i in 1 2 3; do
            git fetch -q origin svoy-golos && git checkout -q -f -B res FETCH_HEAD && mkdir -p cast10 && cp -r /tmp/res/. cast10/
            python3 svoy_proba.py merge
            git add -A cast10 sluh_add.json; git commit -q -m "svoy-proba result" || echo nothing
            git push origin HEAD:svoy-golos && break; sleep 5
          done
