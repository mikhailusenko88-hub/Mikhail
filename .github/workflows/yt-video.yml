name: yt-video
on:
  push:
    branches: [yt-video]
    paths: [request.txt]
  workflow_dispatch:
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          python3 -m pip install -q -U yt-dlp faster-whisper
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
      - name: fetch
        run: python3 fetch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: out/
          retention-days: 3
