name: shorts-check
on: push
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip -q install -U "yt-dlp[default]" >/dev/null 2>&1
          mkdir out
          yt-dlp --flat-playlist --print "%(id)s|%(duration)s|%(title)s" --playlist-end 80 https://www.youtube.com/@Cartoon_Friend3/videos > out/yt.txt 2> out/yt.err || true
          yt-dlp --flat-playlist --print "%(id)s|%(duration)s|%(title)s" --playlist-end 80 https://rutube.ru/channel/82826859/videos/ > out/rt.txt 2> out/rt.err || true
          cd out && git init -q && git checkout -q -b shorts-check-out && git add . && git -c user.name=bot -c user.email=bot@x commit -qm out
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} shorts-check-out
