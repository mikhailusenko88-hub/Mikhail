name: blender-tools
# Скачать Blender (Linux) и положить в релиз blender-tools — чтобы проверять сцену в песочнице Claude, где blender.org закрыт.
on:
  push:
    branches: [blender-27]
    paths: [tools.txt]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat tools.txt | head -1)
          F=$(curl -s https://download.blender.org/release/Blender$V/ | grep -o "blender-$V\.[0-9]*-linux-x64\.tar\.xz" | sort -V | tail -1)
          echo "файл: $F"; curl -sL -o "$F" "https://download.blender.org/release/Blender$V/$F"; ls -la "$F"
          split -b 1900m "$F" "$F.part-" || true
          gh release delete blender-tools -y --cleanup-tag >/dev/null 2>&1 || true
          gh release create blender-tools --target blender-27 --prerelease --title "Blender для проверок" --notes "$F" "$F"
