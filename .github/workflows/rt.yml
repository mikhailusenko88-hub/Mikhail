name: rt-look
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null; pip -q install yt-dlp
          an() { ffmpeg -hide_banner -ss 60 -t 40 -i "$1" -vf "tblend=all_mode=difference,signalstats,metadata=print:key=lavfi.signalstats.YAVG" -f null - 2>&1 | grep -o "YAVG=[0-9.]*" | cut -d= -f2 > d.txt; echo "кадров $(wc -l < d.txt), повторов $(awk '$1<0.08' d.txt | wc -l), тихих(<0.3) $(awk '$1<0.3' d.txt | wc -l)"; }
          for id in 27fc243ecd58bf78de1d3e02af67e40f afdd98ae45c0e0e83fb7e2d0046602be d21d392698c06f82fcc6cdd1965b4ffc ffee88438eea759d5b5eb4524c0435e2 165c1e364bcabea15f0d083e8ce2c2a7; do
            for h in 1080 720; do rm -f v.*; yt-dlp -f "bv*[height=$h]" -o "v.%(ext)s" "https://rutube.ru/video/$id/" >/dev/null 2>&1; f=$(ls v.* 2>/dev/null | head -1); [ -n "$f" ] || continue
              echo "== ${id:0:6} ${h}p: $(an "$f")"; done; done
