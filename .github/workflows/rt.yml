name: rt-look
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          echo "== YouTube 12 серия: какие кадры/с у исходника"
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36" -H "Accept-Language: ru" -b "CONSENT=YES+1" "https://www.youtube.com/watch?v=2HP0pF8_ZfU" -o yt.html; wc -c yt.html
          grep -o '"qualityLabel":"[^"]*"' yt.html | sort | uniq -c | head; grep -o '"fps":[0-9]*' yt.html | sort | uniq -c
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null; pip -q install yt-dlp
          yt-dlp -f "bv*[height=1080]" -o "v.%(ext)s" "https://rutube.ru/video/165c1e364bcabea15f0d083e8ce2c2a7/" >/dev/null 2>&1; f=$(ls v.* | head -1)
          ffmpeg -hide_banner -ss 60 -t 30 -i "$f" -vf "tblend=all_mode=difference,signalstats,metadata=print:key=lavfi.signalstats.YAVG" -f null - 2>&1 | grep -o "YAVG=[0-9.]*" | cut -d= -f2 > d.txt
          echo "== повторы кадров (номер кадра, где картинка не сменилась), 60–90 с:"; awk '$1<0.08{printf "%d ", NR}' d.txt; echo
          echo "== расстояния между повторами:"; awk '$1<0.08{if(p) printf "%d ", NR-p; p=NR}' d.txt; echo
          echo "== кадров: $(wc -l < d.txt), повторов: $(awk '$1<0.08' d.txt | wc -l)"
          echo "== длительности кадров (pts) в потоке Rutube, первые 40:"; ffprobe -v error -select_streams v -show_entries packet=pts_time,duration_time -read_intervals "60%+2" -of csv=p=0 "$f" | head -40 | tr '\n' ' '
