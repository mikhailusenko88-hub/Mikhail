name: rt-look
on: push
permissions: { contents: write }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null; pip -q install yt-dlp
          mkdir -p rt2; U=https://rutube.ru/video/165c1e364bcabea15f0d083e8ce2c2a7/
          for h in 1080 720 476; do
            yt-dlp -f "bv*[height=$h]" -o "v$h.%(ext)s" "$U" >/dev/null 2>&1; f=$(ls v$h.* | head -1)
            ffmpeg -v error -y -ss 150 -i "$f" -frames:v 1 -vf "scale=1920:1080:flags=bicubic,crop=960:540:480:440" -q:v 2 rt2/q${h}_150.jpg
            ffmpeg -v error -y -ss 75 -i "$f" -frames:v 1 -vf "scale=1920:1080:flags=bicubic" -q:v 3 rt2/q${h}_75.jpg
            echo "$h: $(ffprobe -v error -show_entries format=bit_rate -of csv=p=0 "$f")"
          done
          git config user.name ci; git config user.email ci@local; git add rt2; git commit -q -m "rt2"; git push -q
