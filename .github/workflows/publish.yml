name: publish
# «Кот Барсик»: выкладка серии на YouTube. Запуск — строка в publish.txt (см. publish.py): check | draft | plan | cancel | stats.
# Серия всегда уходит закрытой: черновиком или с таймером выхода. Вход — секрет BARSIK_YT (barsik-login.sh).
on:
  push:
    branches: [studio]
    paths: [publish.txt]
permissions:
  contents: write
concurrency:
  group: barsik-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Выкладка
        env:
          BARSIK_YT: ${{ secrets.BARSIK_YT }}
        run: |
          pip install -q requests
          python3 publish.py
      - name: Итог — в ветку
        if: always()
        run: |
          git config user.name "studio"; git config user.email "actions@users.noreply.github.com"
          git add youtube 2>/dev/null || exit 0
          git commit -qm "выкладка: $(head -1 youtube/status.txt | cut -c1-70)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin studio && git push -q && break; sleep 7; done
