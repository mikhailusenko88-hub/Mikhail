name: svoy-omo
# Голос №4: все омографы (словарь ruaccent) — проверка на 30 фразах с ручным эталоном
on:
  push:
    branches: [svoy-golos]
    paths: ['svoy-omo-request.txt', 'svoy_omo.py', '.github/workflows/svoy-omo.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: svoy-omo
  cancel-in-progress: false
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        v: [A, E, K]
        part: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
            ~/.cache/torch
            models
          key: svoy2-cache-v1
          restore-keys: svoy-golos-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers phonemizer praat-parselmouth openai-whisper ruaccent matplotlib edge-tts
      - run: python svoy_omo.py gen ${{ matrix.v }} ${{ matrix.part }} 3
      - run: python voice_check.py
      - if: always()
        run: python svoy2.py pack && (cp out/O__*.png pack/ || true) && (cp in/*.sent pack/ || true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: O-${{ matrix.v }}-${{ matrix.part }}
          path: pack/
  final:
    needs: v
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'O-*'
          merge-multiple: true
          path: pack/
      - name: Итог
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy
          python svoy_omo.py final
          mkdir -p cast5/sent && cp pack/*.sent cast5/sent/ 2>/dev/null || true
          ls -la cast5
      - name: Commit
        if: always()
        timeout-minutes: 5
        run: |
          git config user.name svoy-golos
          git config user.email svoy-golos@users.noreply.github.com
          git add -A cast5
          git commit -m "svoy-omo result" || echo nothing
          for i in 1 2 3; do git fetch -q origin svoy-golos && git rebase -q FETCH_HEAD && git push origin HEAD:svoy-golos && break; sleep 5; done
