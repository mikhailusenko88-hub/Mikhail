name: svoy-kot-final
# Пересобрать пробу по артефактам прошедшего запуска svoy-kot2: в svoy-kot-final.txt — номер запуска и выбор вариантов
on:
  push:
    branches: [svoy-golos]
    paths: ['svoy-kot-final.txt']
permissions:
  contents: write
  actions: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Запрос
        id: rq
        run: |
          echo "id=$(grep -o '[0-9]\{8,\}' svoy-kot-final.txt | head -1)" >> "$GITHUB_OUTPUT"
          echo "choice=$(grep -o '[A-Z0-9]*=[a-z][,A-Z0-9=a-z]*' svoy-kot-final.txt | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: 'K2-*'
          merge-multiple: true
          path: pack/
          run-id: ${{ steps.rq.outputs.id }}
          github-token: ${{ github.token }}
      - name: Итог
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q numpy
          python svoy_kot2.py final "${{ steps.rq.outputs.choice }}"
          ls -la cast8
      - name: Commit
        timeout-minutes: 5
        run: |
          git config user.name svoy-golos
          git config user.email svoy-golos@users.noreply.github.com
          git add -A cast8
          git commit -m "svoy-kot-final result" || echo nothing
          for i in 1 2 3; do git fetch -q origin svoy-golos && git rebase -q FETCH_HEAD && git push origin HEAD:svoy-golos && break; sleep 5; done
