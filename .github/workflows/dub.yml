name: dub
# Дубляж серии на другие языки голосами героев. Запуск — строка в dub-request.txt: «<сборка> <язык> [<язык>…]», например «36dub en es pt».
on:
  push:
    branches: [golos-en]
    paths: ['dub-request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dub-${{ github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.r.outputs.name }}
      langs: ${{ steps.r.outputs.langs }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          L=$(grep -v '^#' dub-request.txt | head -1); set -- $L
          echo "name=$1" >> $GITHUB_OUTPUT; shift
          printf 'langs=%s\n' "$(printf '%s\n' "$@" | python3 -c 'import sys,json;print(json.dumps([x.strip() for x in sys.stdin if x.strip()]))')" >> $GITHUB_OUTPUT
          echo "Сборка $L"
  dub:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.plan.outputs.langs) }}
    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      TOKENIZERS_PARALLELISM: 'false'
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.plan.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/whisper
          key: golos-lab-cache-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" piper-tts speechbrain openai-whisper faster-whisper praat-parselmouth soundfile edge-tts --extra-index-url https://download.pytorch.org/whl/cpu
          python -m spacy download en_core_web_sm -q || true
      - name: SILMA TTS для арабского (26.11; одним заданием ~4 ч — быстрее через dub-parts, 6 долей)
        if: matrix.lang == 'ar'
        run: |
          python -m venv ~/silma
          ~/silma/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          ~/silma/bin/pip install -q --no-deps silma-tts==1.0.5
          ~/silma/bin/pip install -q cached_path click "ema_pytorch>=0.5.2" "hydra-core>=1.3.0" omegaconf librosa matplotlib "numpy<=1.26.4" pydub safetensors soundfile tomli torchdiffeq tqdm transformers unidecode vocos "x_transformers>=1.31.14" huggingface_hub onnxruntime "catt_tashkeel==1.0.2" "torch==2.6.0" --extra-index-url https://download.pytorch.org/whl/cpu
          curl -fsSL -o ~/silma_ref.wav https://raw.githubusercontent.com/SILMA-AI/silma-tts/main/src/silma_tts/infer/ref_audio_samples/silma-ref-voice-commercial.wav
      - name: Файлы сборки
        run: |
          mkdir -p "tmp_dubsrc/$NAME"
          gh release download "studio-$NAME" -R ${{ github.repository }} -p dub.zip -D "tmp_dubsrc/$NAME" || gh release download "dubsrc-$NAME" -R ${{ github.repository }} -p dub.zip -D "tmp_dubsrc/$NAME"   # серии из телефона — исходники из готового ролика (dubsrc.yml)
          [ -f "tmp_dubsrc/$NAME/ep-$NAME-540.mp4" ] || gh release download "dubsrc-$NAME" -R ${{ github.repository }} -p "ep-$NAME-540.mp4" -D "tmp_dubsrc/$NAME" || true
          gh release download "studio-$NAME" -R ${{ github.repository }} -p "ep-$NAME-540.mp4" -D "tmp_dubsrc/$NAME" || true
          ls -la "tmp_dubsrc/$NAME"
      - name: Дубляж
        run: python dub.py "$NAME" "${{ matrix.lang }}"
      - name: Превью и релиз
        if: always()
        run: |
          O="out_dub/$NAME"; L="${{ matrix.lang }}"; V="tmp_dubsrc/$NAME/ep-$NAME-540.mp4"
          if [ -f "$O/dub_$L.wav" ] && [ -f "$V" ]; then ffmpeg -y -loglevel error -i "$V" -i "$O/dub_$L.wav" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 128k -shortest -movflags +faststart "$O/ep-$NAME-$L-540.mp4"; fi
          if [ -f "$O/dub_$L.wav" ]; then ffmpeg -y -loglevel error -i "$O/dub_$L.wav" -c:a libmp3lame -b:a 192k "$O/dub_$L.mp3"; fi
          gh release create "dub-$NAME" --target golos-en --prerelease --title "Дубляж: $NAME" --notes "Дорожки на других языках для YouTube Studio → Языки → Дубляж. Отчёты — ветка golos-en, out_dub/$NAME." >/dev/null 2>&1 || true
          gh release upload "dub-$NAME" --clobber $(ls $O/dub_$L.wav $O/dub_$L.mp3 $O/ep-$NAME-$L-540.mp4 2>/dev/null) || true
      - name: Дорожка — в ветку dub-files (оттуда страница Studio берёт файл для загрузки)
        if: always()
        run: |
          O="out_dub/$NAME"; L="${{ matrix.lang }}"; [ -f "$O/dub_$L.mp3" ] || exit 0
          git clone -q --depth 1 -b dub-files "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" df
          mkdir -p "df/$NAME"; cp "$O/dub_$L.mp3" "df/$NAME/"
          cd df && git config user.name dub && git config user.email dub@users.noreply.github.com
          git add "$NAME/dub_$L.mp3" && git commit -qm "dub-files: $NAME $L" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
      - name: Отчёт — в ветку
        if: always()
        run: |
          git config user.name dub; git config user.email dub@users.noreply.github.com
          git add out_dub/$NAME/report_${{ matrix.lang }}.md out_dub/$NAME/report_${{ matrix.lang }}.json 2>/dev/null || true
          git commit -qm "dub $NAME ${{ matrix.lang }}" || echo nothing
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
