name: hosts-check
# Открываются ли из России адреса хостеров (check-host.net). Список — hosts.txt, отчёт — status/hosts.txt
on:
  push:
    branches: [srv-check]
    paths: ['hosts.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get -qq update >/dev/null 2>&1; sudo apt-get -qq install -y nmap >/dev/null 2>&1 || true
      - name: check
        run: mkdir -p status && python3 srv/hosts_ru.py > status/hosts.txt 2>&1; cat status/hosts.txt
      - name: save
        run: |
          git config user.name "srv-check"; git config user.email "srv-check@users.noreply.github.com"
          git add status; git commit -m "hosts status" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin srv-check && git push -q origin HEAD:srv-check && break; sleep 5; done
