name: voice-check-mac
# То же, что voice-check, но на Mac GitHub (когда очередь ubuntu занята дубляжом). Запуск — изменение request-mac.txt.
on:
  push:
    branches: [voice-check]
    paths: ['request-mac.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          brew install espeak-ng ffmpeg >/dev/null 2>&1 || brew install espeak-ng ffmpeg
          pip install -q torch torchaudio
          pip install -q transformers phonemizer praat-parselmouth openai-whisper ruaccent matplotlib edge-tts
          echo "PHONEMIZER_ESPEAK_LIBRARY=$(brew --prefix espeak-ng)/lib/libespeak-ng.dylib" >> $GITHUB_ENV
      - name: Generate audio from gen.txt
        if: hashFiles('gen.txt') != ''
        run: python gen.py
      - name: Analyze
        run: python voice_check.py
      - name: Commit result
        if: always()
        run: |
          git config user.name voice-check
          git config user.email voice-check@users.noreply.github.com
          git add in out 2>/dev/null || true
          git commit -qm "voice-check (mac) result" || echo nothing
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
