<style>
:root{
  --bg:#eceef0; --panel:#ffffff; --fg:#1d2328; --muted:#5f6b75; --accent:#2f6f8f; --line:#d3d8dc;

}
@media (prefers-color-scheme: dark){:root{--bg:#1a1e22;--panel:#23292e;--fg:#e6eaed;--muted:#9aa6af;--accent:#6fb3d4;--line:#38424a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#view{position:relative;flex:1 1 auto;min-height:240px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ttl{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));font-size:14px;font-weight:600;margin:0;pointer-events:none;color:var(--muted)}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:8px;font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .6s}
.bar{flex:0 0 auto;max-height:44vh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:8px}
@media (min-width:900px){#app{flex-direction:row}.bar{width:400px;max-height:none;height:100%;border-top:0;border-left:1px solid var(--line)}}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:12px;color:var(--muted);min-width:74px}
.note{font-size:12.5px;margin:0;color:var(--muted);line-height:1.35}
.sum{font-size:13px;font-weight:600;line-height:1.4;margin:0;padding:7px 9px;border-left:3px solid var(--accent);background:rgba(47,111,143,.09);border-radius:4px}
.sel{font-size:12px;margin:0;color:var(--muted)}
button{font:500 12.5px var(--f-ui);padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:13px var(--f-ui);padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--fg);max-width:100%}
.sw{display:flex;gap:6px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.sw .dot{width:26px;height:26px;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.sw .dot[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px;background-clip:padding-box}
.own{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.own input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:transparent}
.own input[type=text]{font:12.5px var(--f-ui);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);width:170px}
.dims{display:grid;grid-template-columns:1fr;gap:0;font-size:12.5px;margin:0}
.dims div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 0}
.dims span{color:var(--muted)} .dims b{font-weight:500;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}

</style>

function buildLayout(id){const L=LAYS[id];L.root=new THREE.Group();L.root.visible=false;scene.add(L.root);L.mods=[];
  L.top.forEach(([x,z,w,d])=>box(w,CT,d,x,PL+BH,z,MATS.top,L.root));

  if(L.splash.left)box(8,UY-TOP,L.splash.left,0,TOP,0,MATS.splash,L.root);
  if(L.splash.right)box(8,UY-TOP,L.splash.right,RW-8,TOP,0,MATS.splash,L.root);
  L.specList.forEach(sp=>{
    const g=new THREE.Group();
    if(sp.wall==='left'){g.position.set(0,0,(sp.at+sp.w)*S);g.rotation.y=Math.PI/2}

      mats:{front:new THREE.MeshLambertMaterial({color:col}),flute:new THREE.MeshLambertMaterial({color:col,map:FLUTE})}
      });

    g.traverse(o=>{if(o.isMesh)o.userData.mod=mod});
    L.mods.push(mod);
  });

  (L.zones||[]).forEach(([x,z,w,d,t])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry((w-24)*S,(d-24)*S),ZONE_MAT);m.rotation.x=-Math.PI/2;

function modColor(code){return state.mods[code]||(isLow(code)?state.low:isUp(code)?state.up:null)||state.all}
function applyAll(){
  Object.values(LAYS).forEach(L=>L.mods.forEach(m=>{const c=modColor(m.code).c;m.mats.front.color.set(c);m.mats.flute.color.set(c)}));
  FRONTS.forEach(applyFront); VIS.forEach(applyVis);
  MATS.top.color.set(state.top.c); MATS.splash.color.set(state.splash.c); MATS.frame.color.set(state.frame.c);
  MATS.frame.emissive.set(state.frame.n==='Золото'?0x3a2a08:0x000000);
}
function targets(){const L=LAYS[state.lay];const t=[['all','Все фасады'],['low','Все нижние и пеналы'],['up','Все верхние']];
  L.mods.filter(m=>m.hasFront).forEach(m=>t.push([m.code,`${m.code} — ${m.name}`]));
  t.push(['top','Столешница'],['splash','Фартук (стеновая панель)'],['frame','Рамки витрин и профиль Gola']);return t}
let tgt='all';
function tgtColor(){if(['top','splash','frame'].includes(tgt))return state[tgt];if(tgt==='all')return state.all;if(tgt==='low')return state.low||state.all;if(tgt==='up')return state.up||state.all;return modColor(tgt)}
function palette(){return tgt==='frame'?FRAME_COLORS:(tgt==='top'||tgt==='splash')?STONE_COLORS:FRONT_COLORS}
function setColor(c,n){const v={c,n:n||c};
  if(['top','splash','frame'].includes(tgt))state[tgt]=v;
  else if(tgt==='all'){state.all=v;state.low=null;state.up=null;state.mods={}}
  else if(tgt==='low'){state.low=v;Object.keys(state.mods).forEach(k=>{if(isLow(k))delete state.mods[k]})}
  else if(tgt==='up'){state.up=v;Object.keys(state.mods).forEach(k=>{if(isUp(k))delete state.mods[k]})}
  else state.mods[tgt]=v;
  applyAll();save();drawSw();drawSel();
}

function drawSw(){swEl.innerHTML='';const cur=tgtColor();
  palette().forEach(([n,c])=>{const b=document.createElement('button');b.className='dot';b.style.background=c;b.title=n;b.setAttribute('aria-label',n);
    b.setAttribute('aria-pressed',cur.c.toLowerCase()===c&&cur.n===n);b.onclick=()=>{setColor(c,n);ownName.value=''};swEl.appendChild(b)});
  ownEl.value=cur.c; if(!palette().some(p=>p[0]===cur.n)&&cur.n!==cur.c)ownName.value=cur.n; else ownName.value='';
}
ownEl.oninput=()=>setColor(ownEl.value,ownName.value.trim()||('свой цвет '+ownEl.value));
ownName.onchange=()=>setColor(ownEl.value,ownName.value.trim()||('свой цвет '+ownEl.value));
const tgtEl=document.getElementById('tgt');
function drawTargets(){tgtEl.innerHTML='';const t=targets();if(!t.some(x=>x[0]===tgt))tgt='all';
  t.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;tgtEl.appendChild(o)});tgtEl.value=tgt}
tgtEl.onchange=()=>{tgt=tgtEl.value;drawSw()};
function drawSel(){const L=LAYS[state.lay];const parts=[`Фасады: ${state.all.n}`];
  if(state.low)parts.push(`нижние и пеналы: ${state.low.n}`); if(state.up)parts.push(`верхние: ${state.up.n}`);
  L.mods.forEach(m=>{if(state.mods[m.code])parts.push(`${m.code}: ${state.mods[m.code].n}`)});
  parts.push(`столешница: ${state.top.n}`,`фартук: ${state.splash.n}`,`рамки: ${state.frame.n}`);
  document.getElementById('sel').textContent='Выбор: '+LAYS[state.lay].name+', '+MATV[state.mat].name.split(',')[0]+'. '+parts.join('; ')+'.'}

// ---------- переключатели
function seg(el,items,cur,on){el.innerHTML='';items.forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-pressed',String(v)===String(cur));b.onclick=()=>on(v);el.appendChild(b)})}
function setLayout(id){const prev=state.lay;state.lay=+id;Object.keys(LAYS).forEach(k=>{LAYS[k].root.visible=(+k===state.lay)});save();refresh();if(LAYS[prev].cam||LAYS[state.lay].cam)V3D()}
function setMat(v){state.mat=v;applyAll();save();refresh()}
function refresh(){
  seg(document.getElementById('segLay'),Object.keys(LAYS).map(k=>[k,LAYS[k].name]),state.lay,setLayout);
  seg(document.getElementById('segMat'),Object.keys(MATV).map(k=>[k,MATV[k].name]),state.mat,setMat);
  document.getElementById('note').textContent=LAYS[state.lay].note+' '+MATV[state.mat].note;
  document.getElementById('sum').textContent=LAYS[state.lay].sum;
  drawTargets();drawSw();drawSel();drawTab();
  
  setOpenBtn();
}
function drawTab(){const L=LAYS[state.lay];const fr=L.mods.find(m=>m.type==='fridge');
  const rows=[['Кухня по стенам',L.walls||'2800 × 1600'],['Ножки и цоколь',`${PL}`],['Нижние модули, корпус',`выс. ${BH}, гл. ${BD}`],['Столешница 38 мм, верх от пола',`${TOP}`],
    ['Фартук (стеновая панель)',`${TOP} – ${UY}`],['Верхние: низ / верх',`${UY} / ${UTOP}`]];
  L.mods.forEach(m=>rows.push([`${m.code} ${m.name}`,m.size]));
  rows.push(['Холодильник встраиваемый 75 см (уточнить модель)',`ниша ${fr?fr.iw:768} × ${FR.h}`]);
  rows.push(['Техника и мойка','по вашим моделям, ниши уточним']);
  document.getElementById('tab').innerHTML='<div class="dims">'+rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')+'</div>'}
function tog(id,get,set){const b=document.getElementById(id);b.onclick=()=>{set(!get());b.setAttribute('aria-pressed',get())}}
tog('bCodes',()=>showCodes,v=>{showCodes=v;CODES.forEach(s=>s.visible=v)});
tog('bDims',()=>showDims,v=>{showDims=v;DIMS.forEach(s=>s.visible=v);Object.values(LAYS).forEach(L=>L.dimsGroup.visible=v)});
tog('bZones',()=>showZones,v=>{showZones=v;Object.values(LAYS).forEach(L=>L.zonesGroup.visible=v)});
tog('bFr',()=>showFronts,v=>{showFronts=v;FRONTS.forEach(m=>m.visible=v);FRAMES.forEach(f=>f.visible=v)});
document.getElementById('bTab').onclick=e=>{const t=document.getElementById('tab');t.hidden=!t.hidden;e.target.setAttribute('aria-pressed',!t.hidden)};
function curMods(){return LAYS[state.lay].mods}
function setOpen(m,o,all){m.open=o;m.op.forEach(p=>{if(!(all&&p.ap&&o))p.t=o?1:0})}
function setOpenBtn(){const any=curMods().some(m=>m.open);const b=document.getElementById('bOpen');b.textContent=any?'Закрыть всё':'Открыть всё';b.setAttribute('aria-pressed',any)}
document.getElementById('bOpen').onclick=()=>{const any=curMods().some(m=>m.open);curMods().forEach(m=>setOpen(m,!any,true));setOpenBtn()};

// ---------- камера: вращение одним пальцем, приближение и сдвиг двумя
const ctl={t:new THREE.Vector3(),r:4,th:0,ph:1.2};
function camUpd(){const sp=Math.sin(ctl.ph);cam.position.set(ctl.t.x+ctl.r*sp*Math.sin(ctl.th),ctl.t.y+ctl.r*Math.cos(ctl.ph),ctl.t.z+ctl.r*sp*Math.cos(ctl.th));cam.lookAt(ctl.t);cam.updateMatrixWorld()}
function setView(p,t){ctl.t.set(...t);const d=new THREE.Vector3(...p).sub(ctl.t);const L0=d.length(),asp=cam.aspect||1;ctl.ph=Math.acos(d.y/L0);ctl.th=Math.atan2(d.x,d.z);ctl.r=L0*1.06*(asp<1.35?Math.pow(1.35/asp,0.75):1);camUpd()}
const upVis=v=>Object.values(LAYS).forEach(L=>L.mods.forEach(m=>{if(/^(up|upHood|upMicro|glass|cornerUp|upTall|fill)$/.test(m.type))m.g.visible=v}));
const V3D=()=>{upVis(true);const c=LAYS[state.lay].cam;setView(c?c[0]:[2.25,1.75,3.85],c?c[1]:[1.25,1.15,0.6])}, VFR=()=>{upVis(true);setView([1.4,1.35,3.9],[1.4,1.3,0.4])}, VPL=()=>{upVis(false);setView([1.4,4.4,1.05],[1.4,0.6,0.95])};
document.getElementById('b3d').onclick=V3D;document.getElementById('bFront').onclick=VFR;
document.getElementById('bPlan').onclick=()=>{VPL();if(!showDims)document.getElementById('bDims').click()};
const pts=new Map();let gest=null;
function pan(dx,dy){const k=ctl.r*0.0013*(cam.fov/42);const rt=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0),up=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1);
  ctl.t.addScaledVector(rt,-dx*k).addScaledVector(up,dy*k);ctl.t.y=Math.max(0,Math.min(2.6,ctl.t.y));camUpd()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)gest={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,multi:false,btn:e.button,shift:e.shiftKey};else if(gest)gest.multi=true});
canvas.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(pts.size===1){if(gest)gest.moved+=Math.abs(dx)+Math.abs(dy);
    if(gest&&(gest.btn===2||gest.shift))pan(dx,dy);else{ctl.th-=dx*0.0065;ctl.ph=Math.max(0.12,Math.min(1.72,ctl.ph-dy*0.0065));camUpd()}}
  else if(pts.size===2){const a=[...pts.values()];const o=a.find(q=>q!==p);
    const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);if(d1>0&&d0>0){ctl.r=Math.max(0.6,Math.min(9,ctl.r*d0/d1))}
    pan(dx/2,dy/2)}
  p.x=e.clientX;p.y=e.clientY});
function up_(e){if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
  if(pts.size===0&&gest){if(!gest.multi&&gest.moved<8&&performance.now()-gest.t<500&&gest.btn===0)pick(e.clientX,e.clientY);gest=null}}
canvas.addEventListener('pointerup',up_);canvas.addEventListener('pointercancel',up_);
canvas.addEventListener('wheel',e=>{e.preventDefault();ctl.r=Math.max(0.6,Math.min(9,ctl.r*(1+e.deltaY*0.0012)));camUpd()},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const ray=new THREE.Raycaster();ray.camera=cam;
function pick(cx,cy){const r=canvas.getBoundingClientRect();
  ray.setFromCamera({x:(cx-r.left)/r.width*2-1,y:-(cy-r.top)/r.height*2+1},cam);
  const hits=ray.intersectObject(LAYS[state.lay].root,true);
  for(const h of hits){if(h.object.isSprite||h.object.isLine||!h.object.visible||h.object.userData.noPick)continue;let o=h.object,m=null;while(o&&!m){m=o.userData.mod;o=o.parent}
    if(m){if(m.op.length)setOpen(m,!m.open);if(m.hasFront){tgt=m.code;tgtEl.value=tgt;drawSw()}setOpenBtn();document.getElementById('hint').style.opacity=0;return}
    break}
}



// ---------- старт
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
if(window.ResizeObserver)new ResizeObserver(resize).observe(view); window.addEventListener('resize',resize);
applyAll(); setLayout(state.lay); resize(); V3D();
(function loop(){curMods().forEach(m=>m.op.forEach(p=>{if(Math.abs(p.t-p.c)<0.001){p.c=p.t}else p.c+=(p.t-p.c)*0.14;
   if(p.k==='door')p.g.rotation.y=p.c*p.dir*1.75; else if(p.k==='slide')p.g.position.z=p.c*p.dist*S; else if(p.k==='lift')p.g.rotation.x=-p.c*1.25; else if(p.k==='flap')p.g.rotation.x=p.c*p.a; else if(p.k==='fold'){p.g.rotation.x=-p.c*1.5;p.g2.rotation.x=p.c*2.9}}));
  renderer.render(scene,cam);requestAnimationFrame(loop)})();
</script>
</body>
