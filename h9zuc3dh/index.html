<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>CRM «Пространство»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first рабочее приложение — шапка, один экран за раз, нижняя навигация; на широком экране навигация слева */
:root{
  --bg:#eef1ef; --surface:#ffffff; --sunk:#e4e9e6; --ink:#17201d; --muted:#5b6964; --line:#d3dbd7;
  --accent:#1d5e57; --accent-ink:#ffffff; --accent-soft:#d6e8e4;
  --good:#2b7a4b; --good-soft:#dcefe3; --warn:#9a6212; --warn-soft:#f6e9d2; --crit:#b3261e; --crit-soft:#f8dedb;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --sunk:#0d1311; --ink:#e6ece9; --muted:#9aa9a3; --line:#2b3632;
  --accent:#5fb5a8; --accent-ink:#0b1513; --accent-soft:#1c3631;
  --good:#6cc493; --good-soft:#163323; --warn:#e2ac57; --warn-soft:#3a2b12; --crit:#f08a80; --crit-soft:#3d1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --sunk:#0d1311; --ink:#e6ece9; --muted:#9aa9a3; --line:#2b3632;
  --accent:#5fb5a8; --accent-ink:#0b1513; --accent-soft:#1c3631;
  --good:#6cc493; --good-soft:#163323; --warn:#e2ac57; --warn-soft:#3a2b12; --crit:#f08a80; --crit-soft:#3d1a17; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.demo{margin-left:auto;flex:none;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
main{overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px;
  max-width:1100px;width:100%;margin:0 auto;min-width:0}
h1{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 0 8px}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a .dot{position:relative}
nav.tabs a .badge{position:absolute;top:-4px;right:-10px;background:var(--crit);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto 1fr}
  header.top{grid-column:1/-1}
  nav.tabs{position:sticky;top:60px;align-self:start;grid-row:2;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);background:transparent;padding:12px 8px}
  nav.tabs a{flex-direction:row;gap:10px;font-size:14px;padding:10px 12px;border-radius:8px}
  nav.tabs a[aria-current="page"]{background:var(--accent-soft)}
  main{padding-bottom:40px}
}
/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .d{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row.btn{background:none;border:0;width:100%;text-align:left;border-top:1px solid var(--line)}
.row.btn:first-child{border-top:0}
.row.btn:hover{background:var(--sunk)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.btn-p,.btn-s,.btn-g{border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;border:1px solid transparent}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-s{background:var(--surface);border-color:var(--line)}
.btn-g{background:none;color:var(--accent);padding:6px 8px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
/* funnel */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,80%);gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
@media (min-width:900px){.board{grid-auto-columns:minmax(200px,1fr)}}
.col{background:var(--sunk);border-radius:var(--r);padding:8px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{margin:4px 6px;font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;width:100%;display:flex;flex-direction:column;gap:4px}
.card .t{font-weight:600}
.card .d{color:var(--muted);font-size:13px}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.sheet-bg{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet .bar{display:flex;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding-block:6px;z-index:1}
.sheet .bar h1{flex:1;margin:0;font-size:18px}
.close{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;font-size:18px;line-height:1}
.chat{display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:8px 11px;border-radius:12px;font-size:14px}
.msg.c{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.b{background:var(--accent-soft);align-self:flex-end}
.msg.m{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.msg small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.step{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.step.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.step.now{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note{font-size:13px;color:var(--muted)}
.ed{width:72px;min-width:64px;padding:5px 7px;text-align:right}
.bar-c{height:8px;border-radius:4px;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

}
const view = () => { const h = location.hash.slice(1); return [...VIEWS.map(v=>v[0]), ...Object.keys(SUBVIEWS)].includes(h) ? h : "today"; };

function render(){
  nav();

/* ---------- Сегодня ---------- */
function today(){
  const t = today_();
  const newD = S.deals.filter(d => d.stage==="Новая");
  const tasks = S.deals.flatMap(d => d.tasks.filter(x => !x.done && x.due <= t).map(x => ({...x, d})));
  const unpaid = S.invoices.filter(i => !i.paid);
  const paidToday = S.invoices.filter(i => i.paid).reduce((s,i)=>s+i.sum,0);
  const low = CATALOG.filter(x => { const s = S.stock[x.a]; return s.q>0 && s.q - s.res < x.b * .5 });
  return `<h1>Сегодня</h1><p class="sub">${new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})} · клиенты и остатки в этом образце выдуманы</p>
  <div class="stats">
    <div class="stat"><b>${newD.length}</b><span>новых заявки</span></div>
    <div class="stat"><b>${tasks.length}</b><span>задач на сегодня</span></div>
    <div class="stat"><b>${unpaid.length}</b><span>счёт ждёт оплаты</span></div>
    <div class="stat"><b>${rub(paidToday)}</b><span>оплачено за неделю</span></div>
  </div>
  <h2>Новые заявки</h2>
  <div class="panel list">${newD.map(dRow).join("") || `<div class="row"><span class="d">Новых заявок нет</span></div>`}</div>
  <h2>Задачи</h2>
  <div class="panel list">${tasks.map(x => `<div class="row"><input type="checkbox" id="tk-${x.d.id}-${x.t.length}" data-task="${x.d.id}|${esc(x.t)}" aria-label="Готово"><button class="grow btn-g" style="text-align:left;color:inherit;padding:0" data-deal="${x.d.id}"><div class="t">${esc(x.t)}</div><div class="d">${esc(x.d.name)} · ${CH[x.d.ch]}</div></button>${x.due<t?'<span class="pill crit">просрочено</span>':'<span class="pill warn">сегодня</span>'}</div>`).join("") || `<div class="row"><span class="d">Всё сделано</span></div>`}</div>
  <h2>Деньги</h2>
  <div class="panel list">${unpaid.map(i => { const d=S.deals.find(x=>x.id===i.deal); return `<button class="row btn" data-deal="${d.id}"><div class="grow"><div class="t">${i.id} · ${esc(d.name)}</div><div class="d">${i.how} · срок ${fmtD(i.due)}</div></div><span class="num">${rub(i.sum)}</span></button>`}).join("")}
   ${S.unassigned.map(p => `<a class="row btn" href="#money" style="text-decoration:none;color:inherit"><div class="grow"><div class="t">Неразнесённый платёж ${p.id}</div><div class="d">${esc(p.from)} · ${p.purpose}</div></div><span class="pill warn">${rub(p.sum)}</span></a>`).join("")}</div>
  <h2>Склад: заканчивается</h2>
  <div class="panel list">${low.map(x => { const s=S.stock[x.a]; return `<div class="row"><div class="grow"><div class="t mono">${x.a}</div><div class="d">свободно ${s.q-s.res} шт · коробка ${x.b} шт</div></div><span class="pill warn">мало</span></div>`}).join("") || `<div class="row"><span class="d">Всего хватает</span></div>`}</div>
  <h2>Ближайшие сроки</h2>
  <div class="panel list">${taxList().slice(0,3).map(taxRow).join("")}</div>`;
}
const today_ = today_fn; function today_fn(){ return new Date().toISOString().slice(0,10) }
const dRow = d => `<button class="row btn" data-deal="${d.id}"><div class="grow"><div class="t">${esc(d.name)}</div><div class="d">${CH[d.ch]} · ${TYPES[d.type]} · ${esc(d.want)}</div></div><span class="num">${dealSum(d)?rub(dealSum(d)):""}</span></button>`;

const PST = ["Черновик","Оплачено поставщику","ДОПП подан","В пути","Принято на склад"];
function purchase(){
  return `<a href="#more" class="btn-g" style="padding-left:0">‹ Ещё</a><h1>Поставка №1 · ARTDEC</h1>
  <div class="steps">${PST.map((s,k)=>`<span class="step ${k<S.purchase.stage?"done":k===S.purchase.stage?"now":""}">${s}</span>`).join("")}</div>
  <p class="note">Здесь — закупки у поставщика: состав поставки, этапы до приёмки на склад, НДС при ввозе и себестоимость каждой позиции. В показательной версии суммы закупки скрыты.</p>`;
}

/* ---------- Деньги ---------- */
function money(){
  const unpaid = S.invoices.filter(i=>!i.paid), paid = S.invoices.filter(i=>i.paid);
  const inc = paid.reduce((s,i)=>s+i.sum,0), exp = S.expenses.reduce((s,e)=>s+e.sum,0);
  const invRow = i => { const d=S.deals.find(x=>x.id===i.deal); return `<div class="row"><div class="grow"><div class="t">${i.id} · ${esc(d.name)}</div><div class="d">${i.how} · срок ${fmtD(i.due)}</div></div><span class="num">${rub(i.sum)}</span>${i.paid?'<span class="pill good">оплачен</span>':`<button class="btn-s" data-pay="${i.id}">Оплачен</button>`}</div>` };
  return `<a href="#more" class="btn-g" style="padding-left:0">‹ Ещё</a><h1>Деньги</h1>
  <div class="stats"><div class="stat"><b>${rub(inc)}</b><span>поступило</span></div><div class="stat"><b>${rub(exp)}</b><span>расходы</span></div><div class="stat"><b>${rub(unpaid.reduce((s,i)=>s+i.sum,0))}</b><span>ждём оплаты</span></div></div>
  <h2>Ждём оплаты</h2><div class="panel list">${unpaid.map(invRow).join("")||'<div class="row"><span class="d">Все счета оплачены</span></div>'}</div>
  <h2>Неразнесённые платежи</h2><div class="panel list">${S.unassigned.map(p=>`<div class="row" style="flex-wrap:wrap"><div class="grow"><div class="t">${p.id} · ${rub(p.sum)}</div><div class="d">${esc(p.from)} · ${p.purpose} · ${fmtD(p.date)}</div></div>
    <select id="as-${p.id}" aria-label="К какому заказу" style="max-width:220px">${S.deals.filter(d=>!["Отказ","Отгружено"].includes(d.stage)).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select><button class="btn-s" data-assign="${p.id}">Разнести</button></div>`).join("")||'<div class="row"><span class="d">Всё разнесено</span></div>'}</div>
  <h2>Оплачено</h2><div class="panel list">${paid.map(invRow).join("")}</div>
  <h2>Расходы (для УСН)</h2><div class="panel list">${S.expenses.map(e=>`<div class="row"><div class="grow"><div class="t">${esc(e.what)}</div><div class="d">${e.cat} · ${fmtD(e.date)}</div></div><span class="num">${rub(e.sum)}</span></div>`).join("")}</div>`;
}

/* ---------- Налоги ---------- */
function taxList(){
  return [
    {d:"до ввоза −2 дня", t:"ДОПП и обеспечительный платёж 22%", w:"Поставка №1", s:"warn"},
    {d:"2026-11-20", t:"Декларация по косвенным налогам и заявление о ввозе", w:"если товар принят в октябре", s:""},
    {d:"2026-12-28", t:"Фиксированные взносы ИП за 2026", w:"пропорционально дням с регистрации", s:""},
    {d:"2027-04-25", t:"Декларация УСН за 2026 и уведомление об авансе за I кв.", w:"доходы минус расходы, 7%", s:""},
    {d:"2027-04-28", t:"Налог УСН за 2026 и аванс за I кв. 2027", w:"минимум 1% от выручки", s:""},
    {d:"2027-07-01", t:"Взнос 1% с дохода свыше 300 000 ₽", w:"за 2026", s:""}
  ];
}
const taxRow = x => `<div class="row"><div class="grow"><div class="t">${x.t}</div><div class="d">${x.w}</div></div><span class="pill ${x.s}">${/^\d/.test(x.d)?fmtD(x.d):x.d}</span></div>`;
function taxes(){
  return `<a href="#more" class="btn-g" style="padding-left:0">‹ Ещё</a><h1>Налоги</h1><p class="sub">ИП на УСН «доходы минус расходы», 7%. Суммы появятся, когда подключим банк.</p>
  <div class="panel list">${taxList().map(taxRow).join("")}</div>
  <p class="note">Сроки ориентировочные — сверим, когда придёт дата регистрации ИП.</p>`;
}

/* ---------- Отчёты ---------- */
function reports(){
  const by = Object.keys(CH).map(k => [k, S.deals.filter(d=>d.ch===k)]);
  const mx = Math.max(...by.map(b=>b[1].length));
  return `<a href="#more" class="btn-g" style="padding-left:0">‹ Ещё</a><h1>Отчёты</h1>
  <h2>Заявки по каналам</h2><div class="panel list">${by.map(([k,ds])=>{ const won=ds.filter(d=>["Оплачено","Отгружено"].includes(d.stage)).length;
    return `<div class="row"><div style="width:84px">${CH[k]}</div><div class="grow"><div class="bar-c" style="width:${ds.length/mx*100}%"></div></div><span class="num" style="width:120px;text-align:right">${ds.length} заявок · ${won} продаж</span></div>`}).join("")}</div>
  <h2>Отказы</h2><div class="panel list">${S.deals.filter(d=>d.stage==="Отказ").map(d=>`<div class="row"><span class="grow">${esc(d.name)}</span><span class="d">${esc(d.note)}</span></div>`).join("")}</div>`;
}

/* ---------- interactions ---------- */
function sheet(html){
  const l = document.getElementById("layer");
  l.innerHTML = `<div class="sheet-bg" data-close><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  bind(l);
  l.querySelector(".sheet").addEventListener("click", e => e.stopPropagation());
}
const closeSheet = () => { document.getElementById("layer").innerHTML = ""; render(); };
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1800); }

function bind(root){
  root.querySelectorAll("[data-deal]").forEach(b => b.onclick = () => openDeal(+b.dataset.deal));
  root.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
  root.querySelectorAll("[data-move]").forEach(b => b.onclick = () => { const d=S.deals.find(x=>x.id===+b.dataset.move); d.stage=STAGES[Math.min(STAGES.indexOf(d.stage)+1,4)]; save(); render(); toast(`${d.name}: ${d.stage}`); });
  root.querySelectorAll("[data-stage]").forEach(s => s.onchange = () => { S.deals.find(x=>x.id===+s.dataset.stage).stage=s.value; save(); toast("Этап изменён"); });
  root.querySelectorAll("[data-line]").forEach(i => i.onchange = () => { const [id,a]=i.dataset.line.split("|"); const d=S.deals.find(x=>x.id===+id); d.lines.find(l=>item(l[0]).a===a)[1]=Math.max(0,+i.value||0); save(); openDeal(+id); });
  root.querySelectorAll("[data-invoice]").forEach(b => b.onclick = () => { const d=S.deals.find(x=>x.id===+b.dataset.invoice); const n="С-"+String(S.invoices.length+4).padStart(4,"0");
    S.invoices.push({id:n,deal:d.id,sum:Math.round(dealSum(d)),how:d.type==="c"?"Счёт компании":"Ссылка на оплату",due:new Date(Date.now()+3*864e5).toISOString().slice(0,10),paid:false}); save(); openDeal(d.id); toast(`Счёт ${n} выставлен`); });
  root.querySelectorAll("[data-addtask]").forEach(b => b.onclick = () => { const d=S.deals.find(x=>x.id===+b.dataset.addtask); d.tasks.push({t:"Перезвонить клиенту",due:new Date(Date.now()+864e5).toISOString().slice(0,10),done:false}); save(); openDeal(d.id); toast("Задача на завтра"); });
  root.querySelectorAll("[data-dtask]").forEach(c => c.onchange = () => { const [id,k]=c.dataset.dtask.split("|"); S.deals.find(x=>x.id===+id).tasks[+k].done=c.checked; save(); });
  root.querySelectorAll("[data-task]").forEach(c => c.onchange = () => { const [id,t]=c.dataset.task.split("|"); const tk=S.deals.find(x=>x.id===+id).tasks.find(x=>x.t===t); if(tk) tk.done=true; save(); setTimeout(render,250); });
  root.querySelectorAll("[data-send]").forEach(b => b.onclick = () => { const id=+b.dataset.send; const i=document.getElementById("mi-"+id); if(!i.value.trim()) return; S.deals.find(x=>x.id===id).msgs.push(["m",i.value.trim()]); save(); openDeal(id); });
  root.querySelectorAll("[data-note]").forEach(t => t.oninput = () => { S.deals.find(x=>x.id===+t.dataset.note).note=t.value; save(); });
  root.querySelectorAll("[data-sq]").forEach(i => i.onchange = () => { S.stock[i.dataset.sq].q=Math.max(0,+i.value||0); save(); toast("Остаток сохранён"); });
  root.querySelectorAll("[data-sp]").forEach(i => i.onchange = () => { S.stock[i.dataset.sp].price=Math.max(0,+i.value||0); save(); toast("Цена сохранена"); });
  root.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { stockCat=b.dataset.cat; render(); });
  const sq=root.querySelector("#sq"); if(sq) sq.oninput = () => { stockQ=sq.value; const p=sq.selectionStart; render(); const n=document.getElementById("sq"); n.focus(); n.setSelectionRange(p,p); };
  const cq=root.querySelector("#cq"); if(cq) cq.oninput = () => { clientQ=cq.value; const p=cq.selectionStart; render(); const n=document.getElementById("cq"); n.focus(); n.setSelectionRange(p,p); };
  root.querySelectorAll("[data-newdeal]").forEach(b => b.onclick = () => { const id=Math.max(...S.deals.map(d=>d.id))+1; S.deals.push({id,name:"Новый клиент",type:"p",ch:"site",stage:"Новая",want:"Опишите запрос",lines:[["A912",0]],created:today_(),msgs:[],tasks:[],note:""}); save(); openDeal(id); });
  root.querySelectorAll("[data-pnext]").forEach(b => b.onclick = () => { S.purchase.stage++; if(S.purchase.stage===4){ S.purchase.lines.forEach(([a,bx])=>{ const x=pItem(a); S.stock[x.a].q+=bx*x.b; }); toast("Товар оприходован на склад"); } save(); render(); });
  root.querySelectorAll("[data-freight]").forEach(i => i.onchange = () => { S.purchase.freight=Math.max(0,+i.value||0); save(); render(); });
  root.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => { const inv=S.invoices.find(i=>i.id===b.dataset.pay); inv.paid=true; const d=S.deals.find(x=>x.id===inv.deal); if(STAGES.indexOf(d.stage)<3) d.stage="Оплачено"; save(); render(); toast(`${inv.id} оплачен`); });
  root.querySelectorAll("[data-assign]").forEach(b => b.onclick = () => { const p=S.unassigned.find(x=>x.id===b.dataset.assign); const did=+document.getElementById("as-"+p.id).value; S.invoices.push({id:"С-"+String(S.invoices.length+4).padStart(4,"0"),deal:did,sum:p.sum,how:"СБП (разнесено)",due:p.date,paid:true}); S.unassigned=S.unassigned.filter(x=>x!==p); save(); render(); toast("Платёж разнесён"); });
  root.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => { S=seed(); S.invoices.forEach(inv=>{ inv.sum=Math.round(dealSum(S.deals.find(d=>d.id===inv.deal))) }); save(); location.hash="today"; render(); toast("Пример восстановлен"); });
}
window.addEventListener("hashchange", () => { document.getElementById("layer").innerHTML=""; render(); });
render();
</script>
</body></html>
