*{box-sizing:border-box}

.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

h1{font-family:var(--f-display);font-size:22px;line-height:1.2;margin:16px 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:62ch}
.lay{display:grid;gap:14px;padding-bottom:60px}
