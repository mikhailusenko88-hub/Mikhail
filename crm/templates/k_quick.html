{% extends "base.html" %}
{% block title %}{{ t['title'] }} — №{{ d['id'] }}{% endblock %}
{% block main %}
<p><a href="{{ url_for('deal_view', did=d['id']) }}">← Заявка №{{ d['id'] }} · {{ d['client_name'] }}</a></p>
<h1>{{ t['title'] }}</h1>
<form class="panel pad grid2" method="post" action="{{ url_for('k_quick', did=d['id']) }}">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="t" value="{{ t['key'] }}">
  <label class="f span2">Текст — можно поправить перед отправкой<textarea name="body" id="kQuick" rows="10" maxlength="8000">{{ text }}</textarea></label>
  <div class="row wrap span2"><button class="btn-s" type="button" data-copy="#kQuick">Скопировать для мессенджера</button>
    {% if d['email'] %}<button class="btn-p">Отправить на {{ d['email'] }}</button>{% else %}<span class="d">У клиента нет e-mail — только скопировать.</span>{% endif %}</div>
</form>
{% endblock %}
