{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block solo %}
<form class="panel login" method="post" action="{{ url_for('login') }}">
  <div class="brand big">Наш декор<small>CRM</small></div>
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
  {% if err %}<div class="flash err" role="alert">{{ err }}</div>{% endif %}
  <label class="f">Логин<input name="login" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label class="f">Пароль<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn-p wide">Войти</button>
</form>
{% endblock %}
