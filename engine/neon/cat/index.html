<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Барсик в лесу</title>
<style>
  html,body{margin:0;background:#0b0c0e;color:#e8e6e0;font:15px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  #wrap{position:relative;width:100vw;aspect-ratio:16/9;background:#000;overflow:hidden;touch-action:none}
  #gl{width:100%;height:100%;display:block}
  #hud{position:absolute;left:8px;top:6px;font-size:12px;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:6px;pointer-events:none}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0c0e;font-size:16px;text-align:center;padding:20px}
  #ui{padding:10px 12px 28px;display:grid;gap:10px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:#1d2026;color:#e8e6e0;border:1px solid #363a44;border-radius:10px;padding:9px 13px;font-size:14px}
  button.on{background:#2f6b3a;border-color:#48a05a}
  input[type=range]{flex:1;min-width:120px}
  label{font-size:13px;color:#aeb2bb;min-width:92px}
  .note{font-size:13px;color:#aeb2bb}
  .val{font-variant-numeric:tabular-nums;min-width:52px;text-align:right;font-size:13px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="hud">загрузка…</div>
  <div id="load">Загружаю лес и Барсика…</div>
</div>
<div id="ui">
  <div class="row">
    <button id="bMode" class="on">Стало</button>
    <button id="bCam" class="on">Свободная камера</button>
    <button id="bWalk" class="on">Идёт</button>
    <button id="bRays">Лучи (экранные)</button>
    <button id="bQ" class="on">Качество: полное</button>
  </div>
  <div class="row"><label>Дымка</label><input id="fog" type="range" min="0" max="100" value="35"><span class="val" id="fogV">0.35</span></div>
  <div class="row"><label>Время суток</label><input id="tod" type="range" min="0" max="1000" value="0"><span class="val" id="todV">день</span></div>
  <div class="row"><label>Шерсть</label><input id="furD" type="range" min="10" max="100" value="100"><span class="val" id="furV">100%</span></div>
  <div class="row"><label>Ветер</label><input id="wind" type="range" min="0" max="300" value="100"><span class="val" id="windV">1.0</span></div>
  <div class="note" id="resV"></div>
  <div class="note">Крутить — одним пальцем, приближать — двумя. Кнопка «Стало/Было» — новое освещение (тень от солнца, свет под кронами, затенение в складках, свет в воздухе, моргание) против первой версии. Всё на диодах, без лучей в кадре.</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('gl'); const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){ $('load').textContent='Нужен WebGL2 (iOS 15+)'; throw new Error('no webgl2'); }
const extF=gl.getExtension('EXT_color_buffer_float'); const extHF=extF?null:gl.getExtension('EXT_color_buffer_half_float');
const HDR=!!(extF||extHF); const ENC=HDR?1.0:1/8; const PI=Math.PI;
let S=null, C=null;
async function load(){
  await new Promise(r=>setTimeout(r,0));
  const b64=(k)=>{ const s=window[k]; const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; };
  const parse=(ab,magic)=>{ const dv=new DataView(ab); const m=String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3)); if(m!==magic) throw new Error('bad '+magic); const hl=dv.getUint32(4,true); const hdr=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,8,hl))); const pad=(4-(hl%4))%4; return {hdr,ab,base:8+hl+pad}; };
  const ab1=window.NEON_SCENE_B64?b64('NEON_SCENE_B64'):await (await fetch('scene.bin')).arrayBuffer(); S=parse(ab1,'NEON');
  $('hud').textContent='лес загружен, кот…';
  const ab2=window.NEON_CAT_B64?b64('NEON_CAT_B64'):await (await fetch('cat.bin')).arrayBuffer(); C=parse(ab2,'NCAT');
  init();
}
load().catch(e=>{ $('load').textContent='Ошибка: '+e.message; console.error(e); });

// ============ шейдеры ============
const COMMON=`
const float PI=3.14159265;
uniform vec3 uSun; uniform vec3 uSunCol; uniform vec3 uSunBase; uniform float uSkyK; uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uCam;
vec3 ambientSky(vec3 n){ return mix(vec3(0.17,0.26,0.06), vec3(0.45,0.48,0.6), 0.5+0.5*n.y)*uSkyK; }
float ggxD(float nh,float a){ float a2=a*a; float d=nh*nh*(a2-1.0)+1.0; return a2/(PI*d*d+1e-9); }
float ggxG1(float nv,float a){ float k=a*a/2.0; return nv/(nv*(1.0-k)+k+1e-9); }
float fres(float vh,float f0){ float f=pow(1.0-vh,5.0); return f0+(1.0-f0)*f; }
vec3 skyCol(vec3 d, bool withSun){ float y=d.y; vec3 c; if(y>=0.0) c=mix(uHor,uZen,pow(y,0.42)); else c=mix(uHor,vec3(0.35,0.3,0.22)*uSkyK,clamp(-y*8.0,0.0,1.0));
  float s=max(0.0,dot(d,uSun)); c+=uSunBase*(0.10*pow(s,6.0)+0.5*pow(s,80.0)+0.9*pow(s,500.0)); c*=0.85; if(withSun && s>0.99997187) c+=uSunBase*220.0;
  float m=max(c.x,max(c.y,c.z)); if(m>40.0) c*=40.0/m; return c; }
uniform vec4 uOcc[4]; uniform int uMode; uniform sampler2D uCanopyT; uniform vec4 uCanopyRect; uniform mat4 uLightVP; uniform mediump sampler2DShadow uShadowT; uniform int uShadowOn;
vec2 canopy(vec3 wp){ if(uMode==0) return vec2(1.0); vec2 uv=(wp.xz-uCanopyRect.xy)*uCanopyRect.zw; if(uv.x<0.0||uv.y<0.0||uv.x>1.0||uv.y>1.0) return vec2(1.0); return texture(uCanopyT,uv).rg; }
float occShadow(vec3 p);
float shadowAt(vec3 wp, vec3 n){ if(uMode==0||uShadowOn==0) return occShadow(wp); vec3 no=n*(dot(n,uSun)>=0.0?1.0:-1.0); vec4 lp=uLightVP*vec4(wp+no*0.006,1.0); vec3 sc=lp.xyz/lp.w*0.5+0.5; if(sc.x<0.0||sc.x>1.0||sc.y<0.0||sc.y>1.0||sc.z>1.0) return 1.0; float d=0.75/1024.0; float z=sc.z-0.0012; float s=texture(uShadowT,vec3(sc.xy+vec2(-d,-d),z))+texture(uShadowT,vec3(sc.xy+vec2(d,-d),z))+texture(uShadowT,vec3(sc.xy+vec2(-d,d),z))+texture(uShadowT,vec3(sc.xy+vec2(d,d),z)); return s*0.25; }
float occShadow(vec3 p){ float s=1.0; for(int i=0;i<4;i++){ vec4 sp=uOcc[i]; if(sp.w<=0.0) continue; vec3 oc=sp.xyz-p; float tc=dot(oc,uSun); if(tc>0.0){ float d2=dot(oc,oc)-tc*tc; float r=sp.w; s*=smoothstep(r*r*0.55,r*r*1.3,d2); } } return s; }
`;
const VS_DIODE=`#version 300 es
precision highp float; precision highp int;
layout(location=0) in vec3 aPos; layout(location=1) in vec2 aNrm; layout(location=2) in vec3 aAlb; layout(location=3) in float aSunD; layout(location=4) in float aKv; layout(location=5) in float aS; layout(location=6) in float aFlags;
layout(location=7) in vec4 aInst; layout(location=8) in float aIScale;
uniform mat4 uVP; uniform float uPosScale; uniform float uTime; uniform float uWindAmp; uniform float uWiden; uniform int uDeform; uniform vec3 uHero;
out vec3 vWp; out vec3 vN; out vec3 vAlb; out float vSunD; out float vKv; flat out int vFlags; out float vS;
vec3 octDec(vec2 e){ vec3 v=vec3(e.xy,1.0-abs(e.x)-abs(e.y)); if(v.z<0.0){ vec2 s=vec2(v.x>=0.0?1.0:-1.0, v.y>=0.0?1.0:-1.0); v.xy=(1.0-abs(v.yx))*s; } return normalize(v); }
void main(){ vec3 p=aPos*uPosScale; int fl=int(aFlags+0.5); float c=cos(aInst.w), s=sin(aInst.w); vec3 n=octDec(aNrm);
  if(uWiden>1.0 && aS<0.999){ float sg=((fl&1)!=0)?1.0:-1.0; vec3 side=normalize(cross(vec3(0,1,0),n)); p+=side*sg*0.013*pow(1.0-aS,0.6)*(uWiden-1.0); }
  float ph=float(fl>>2)/64.0*6.2831853+0.9*p.x+0.5*p.z; float w=uWindAmp*(sin(1.7*uTime+ph)+0.5*sin(3.1*uTime+1.3*ph)); p+=vec3(0.8,0,0.6)*(w*p.y*aS);
  p*=aIScale; p=vec3(c*p.x+s*p.z, p.y, -s*p.x+c*p.z); n=vec3(c*n.x+s*n.z, n.y, -s*n.x+c*n.z);
  vec3 wp=p+aInst.xyz;
  if(uDeform==1 && aS>0.0 && uHero.z>0.5){ float dx=wp.x-uHero.x, dz=wp.z-uHero.y; float d=sqrt(dx*dx+dz*dz)+1e-4; if(d<0.42){ float k=(0.42-d)/0.42; k=k*k; vec3 disp=vec3(dx/d*k*0.2,-k*0.22,dz/d*k*0.2); wp+=disp*aS*aS; } }
  vWp=wp; vN=n; vAlb=aAlb; vSunD=aSunD; vKv=aKv; vFlags=fl; vS=aS; gl_Position=uVP*vec4(wp,1.0); }`;
const FS_DIODE=`#version 300 es
precision highp float; precision highp int;
in vec3 vWp; in vec3 vN; in vec3 vAlb; in float vSunD; in float vKv; flat in int vFlags; in float vS;
uniform float uEnc; uniform int uGround; uniform vec3 uFarAlb; uniform vec2 uFarSK; uniform int uUseCanopy;
out vec4 o;
${COMMON}
void main(){ vec3 n=normalize(vN); bool front=dot(n,uCam-vWp)>=0.0; vec3 ns=front?n:-n; bool sunFront=(vFlags&2)!=0;
  vec3 alb=vAlb; float sunD=vSunD; float kv=vKv; vec2 cv=(uUseCanopy==1)?canopy(vWp):vec2(1.0); sunD*=mix(cv.r,1.0,0.2); kv*=mix(1.0,cv.g,0.5);
  if(uGround==1){ float dist=length(vWp-uCam); float k=smoothstep(14.0,40.0,dist); alb=mix(alb,uFarAlb,k); sunD=mix(sunD,uFarSK.x,k); kv=mix(kv,uFarSK.y,k); }
  vec3 trans=alb*vec3(1.4,1.5,0.9); vec3 v=normalize(uCam-vWp); float nv=max(dot(ns,v),1e-4);
  float sh=shadowAt(vWp,ns); vec3 sunL=uSunCol*sunD*sh; vec3 col;
  if(front==sunFront){ col=sunL*alb/PI; float ndl=max(dot(ns,uSun),0.0); float vis=clamp(sunD/max(ndl,0.08),0.0,1.0);
    vec3 h=normalize(v+uSun); float nh=max(dot(ns,h),0.0), vh=max(dot(v,h),0.0); float a=0.1024; float spec=fres(vh,0.035)*ggxD(nh,a)*ggxG1(nv,a)*ggxG1(max(ndl,1e-4),a)/(4.0*nv+1e-6); col+=uSunCol*vis*sh*spec*0.6; }
  else col=sunL*trans*0.8/PI;
  col+=alb*ambientSky(ns)*kv*(1.0+0.15*pow(1.0-nv,2.0)); col+=trans*vec3(0.17,0.26,0.06)*uSkyK*0.35*kv;
  o=vec4(col*uEnc,1.0); }`;
// --- кот: кожа / нос / шарф (скиннинг двумя костями) ---
const SKIN_FN=`
uniform mat4 uBones[11];
vec3 skinP(vec3 p,int a,int b,float w){ vec3 pa=(uBones[a]*vec4(p,1.0)).xyz; vec3 pb=(uBones[b]*vec4(p,1.0)).xyz; return mix(pa,pb,w); }
vec3 skinN(vec3 n,int a,int b,float w){ vec3 na=mat3(uBones[a])*n; vec3 nb=mat3(uBones[b])*n; return normalize(mix(na,nb,w)); }
vec3 octDec(vec2 e){ vec3 v=vec3(e.xy,1.0-abs(e.x)-abs(e.y)); if(v.z<0.0){ vec2 s=vec2(v.x>=0.0?1.0:-1.0, v.y>=0.0?1.0:-1.0); v.xy=(1.0-abs(v.yx))*s; } return normalize(v); }`;
const VS_SKIN=`#version 300 es
precision highp float; precision highp int;
layout(location=0) in vec3 aPos; layout(location=1) in vec2 aNrm; layout(location=2) in vec3 aCol; layout(location=3) in float aBA; layout(location=4) in float aBB; layout(location=5) in float aW; layout(location=6) in float aFur; layout(location=7) in float aAO;
uniform mat4 uVP; uniform float uPosScale; ${SKIN_FN}
out vec3 vWp; out vec3 vN; out vec3 vCol; out float vFur; out float vAO;
void main(){ int a=int(aBA+0.5), b=int(aBB+0.5); vec3 p=skinP(aPos*uPosScale,a,b,aW); vec3 n=skinN(octDec(aNrm),a,b,aW); vWp=p; vN=n; vCol=aCol; vFur=aFur; vAO=aAO; gl_Position=uVP*vec4(p,1.0); }`;
const VS_MESH=`#version 300 es
precision highp float; precision highp int;
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm; layout(location=3) in float aBA; layout(location=4) in float aBB; layout(location=5) in float aW;
uniform mat4 uVP; ${SKIN_FN}
out vec3 vWp; out vec3 vN; out vec3 vCol; out float vFur; out float vAO;
void main(){ int a=int(aBA+0.5), b=int(aBB+0.5); vec3 p=skinP(aPos,a,b,aW); vec3 n=skinN(aNrm,a,b,aW); vWp=p; vN=n; vCol=vec3(0.0); vFur=0.0; vAO=1.0; gl_Position=uVP*vec4(p,1.0); }`;
const FS_CAT=`#version 300 es
precision highp float; in vec3 vWp; in vec3 vN; in vec3 vCol; in float vFur; in float vAO; uniform float uEnc; uniform int uMat; uniform float uCanopy; out vec4 o;
${COMMON}
void main(){ vec3 n=normalize(vN); vec3 v=normalize(uCam-vWp); if(dot(n,v)<0.0) n=-n; float nv=max(dot(n,v),1e-4); vec3 alb; float rough=0.6, f0=0.03, ao=1.0;
  if(uMat==0){ alb=vCol*0.9; ao=vFur>0.5?0.55:1.0; rough=0.75; }           // кожа (под шерстью — подшёрсток)
  else if(uMat==1){ alb=vec3(0.36,0.2,0.22); rough=0.25; f0=0.05; }          // нос
  else { alb=vec3(0.12,0.32,0.82); rough=0.7; f0=0.03; }                     // шарф
  vec2 cv=canopy(vWp); float cav=(uMode==0)?1.0:mix(1.0,vAO,0.75); ao*=cav;
  float sh=shadowAt(vWp,n)*(uMode==0?uCanopy:mix(cv.r,1.0,0.5))*(0.35+0.65*cav); float ndl=dot(n,uSun); float wrap=clamp((ndl+0.3)/1.3,0.0,1.0);
  vec3 col=uSunCol*sh*alb/PI*wrap; float ambK=(uMode==0)?1.0:1.8;
  vec3 h=normalize(v+uSun); float nh=max(dot(n,h),0.0), vh=max(dot(v,h),0.0); float a=max(0.03,rough*rough); float spec=fres(vh,f0)*ggxD(nh,a)*ggxG1(nv,a)*ggxG1(max(ndl,1e-4),a)/(4.0*nv+1e-6); col+=uSunCol*sh*spec*max(ndl,0.0);
  float skyM=mix(1.0,cv.g,0.6)*ambK; col+=alb*ambientSky(n)*ao*0.95*skyM; col+=alb*vec3(0.17,0.26,0.06)*uSkyK*0.25*(0.5-0.5*n.y)*ao*ambK;
  if(uMat==0 && vFur>0.5) col*=0.85;
  o=vec4(col*uEnc,1.0); }`;
// --- шерсть: лента по 4 точкам, повёрнутая к камере ---
const VS_FUR=`#version 300 es
precision highp float; precision highp int;
layout(location=0) in vec2 aT;    // x: сегмент 0..3, y: сторона -1/+1
layout(location=1) in vec3 aP0; layout(location=2) in vec3 aP1; layout(location=3) in vec3 aP2; layout(location=4) in vec3 aP3;
layout(location=5) in vec2 aNrm; layout(location=6) in vec3 aCol; layout(location=7) in float aBA; layout(location=8) in float aBB; layout(location=9) in float aW; layout(location=10) in float aRad; layout(location=11) in float aReg; layout(location=12) in float aAO;
uniform mat4 uVP; uniform float uPosScale; uniform float uPixWorld; uniform vec3 uCamPos; uniform float uTime; ${SKIN_FN}
out vec3 vWp; out vec3 vN; out vec3 vT; out vec3 vCol; out float vTt; out float vEdge; out float vAO;
void main(){ int k=int(aT.x+0.5); int a=int(aBA+0.5), b=int(aBB+0.5);
  vec3 P[4]; P[0]=aP0*uPosScale; P[1]=aP1*uPosScale; P[2]=aP2*uPosScale; P[3]=aP3*uPosScale;
  vec3 p=P[k]; vec3 pn=(k<3)?P[k+1]:P[k]; vec3 pp=(k>0)?P[k-1]:P[k];
  // лёгкое дыхание ветра на кончиках
  float t=float(k)/3.0; float sway=0.0015*t*t*sin(uTime*2.3+p.x*40.0+p.z*31.0);
  p=skinP(p,a,b,aW); pn=skinP(pn,a,b,aW); pp=skinP(pp,a,b,aW); p.x+=sway;
  vec3 T=normalize(pn-pp); vec3 view=normalize(uCamPos-p); vec3 side=normalize(cross(T,view));
  float d=length(uCamPos-p); float rad=aRad*0.00002; float wdt=max(rad*(1.1-0.6*t), uPixWorld*d*0.45);
  p+=side*(aT.y*wdt);
  vWp=p; vN=skinN(octDec(aNrm),a,b,aW); vT=T; vCol=aCol; vTt=t; vEdge=aT.y; vAO=aAO; gl_Position=uVP*vec4(p,1.0); }`;
const FS_FUR=`#version 300 es
precision highp float; in vec3 vWp; in vec3 vN; in vec3 vT; in vec3 vCol; in float vTt; in float vEdge; in float vAO; uniform float uEnc; uniform float uCanopy; out vec4 o;
${COMMON}
void main(){ vec3 n=normalize(vN); vec3 v=normalize(uCam-vWp); vec3 T=normalize(vT); float nv=max(dot(n,v),0.0);
  vec2 cv=canopy(vWp); float cav=(uMode==0)?1.0:mix(1.0,vAO,0.75);
  float sh=shadowAt(vWp,n)*(uMode==0?uCanopy:mix(cv.r,1.0,0.5))*(0.4+0.6*cav); float ndl=dot(n,uSun); float wrap=clamp((ndl+0.45)/1.45,0.0,1.0); float ambK=(uMode==0)?1.0:1.8;
  float root=(0.42+0.58*vTt)*(uMode==0?1.0:(0.55+0.45*cav));   // корни темнее — шерсть сама себя затеняет; в складках ещё темнее
  vec3 alb=vCol;
  vec3 col=uSunCol*sh*alb/PI*wrap*root;
  vec3 h=normalize(v+uSun); float th=dot(T,h); float sheen=pow(max(0.0,sqrt(1.0-th*th)),28.0); col+=uSunCol*sh*(alb*0.5+vec3(0.3,0.26,0.2))*sheen*0.22*max(ndl+0.3,0.0);
  float rim=pow(1.0-nv,2.5)*clamp(-ndl+0.25,0.0,1.0); col+=uSunCol*sh*alb*vec3(1.1,0.85,0.6)*rim*0.5*vTt;   // просвет на контровом свете
  col+=alb*ambientSky(n)*root*0.95*mix(1.0,cv.g,0.6)*ambK; col+=alb*vec3(0.17,0.26,0.06)*uSkyK*0.25*(0.5-0.5*n.y)*root*ambK;
  float alpha=(uMode==0)?1.0:(1.0-0.8*smoothstep(0.5,1.0,vTt));   // кончики полупрозрачные (alpha-to-coverage)
  o=vec4(col*uEnc,alpha); }`;
// --- глаза ---
const VS_EYE=`#version 300 es
precision highp float; layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm; layout(location=2) in vec2 aUv; uniform mat4 uVP; uniform mat4 uM; uniform mat4 uBone; out vec3 vWp; out vec3 vN; out vec3 vL;
void main(){ vec3 lp=aPos; vL=lp; vec4 wp=uBone*uM*vec4(lp,1.0); vWp=wp.xyz; vN=normalize(mat3(uBone)*mat3(uM)*aNrm); gl_Position=uVP*wp; }`;
const FS_EYE=`#version 300 es
precision highp float; in vec3 vWp; in vec3 vN; in vec3 vL; uniform float uEnc; uniform vec3 uFwd; uniform mat4 uBone; uniform int uLid; uniform float uLidLevel; out vec4 o;
${COMMON}
void main(){ vec3 n=normalize(vN); vec3 v=normalize(uCam-vWp); float nv=max(dot(n,v),1e-4); vec3 d=normalize(vL); float c=dot(d,uFwd);
  if(uLid==1){ if(d.y<uLidLevel) discard; if(dot(n,v)<0.0) n=-n; vec3 alb=vec3(0.92,0.6,0.28); vec2 cv=canopy(vWp); float ndl=dot(n,uSun); vec3 col=uSunCol*mix(cv.r,1.0,0.5)*alb/PI*clamp((ndl+0.3)/1.3,0.0,1.0)+alb*ambientSky(n)*1.6*mix(1.0,cv.g,0.6); o=vec4(col*uEnc,1.0); return; }
  vec3 base; float ang=atan(d.y, dot(d,normalize(cross(uFwd,vec3(0,1,0)))));
  if(c>0.935) base=vec3(0.02,0.015,0.015);

// ============ управление ============
$('bMode').onclick=()=>{ st.mode=st.mode?0:1; $('bMode').textContent=st.mode?'Стало':'Было'; $('bMode').classList.toggle('on',!!st.mode); };
$('bCam').onclick=()=>{ st.free=!st.free; $('bCam').textContent=st.free?'Свободная камера':'Кино-камера'; $('bCam').classList.toggle('on',st.free); };
$('bWalk').onclick=()=>{ st.walk=!st.walk; $('bWalk').textContent=st.walk?'Идёт':'Стоит'; $('bWalk').classList.toggle('on',st.walk); };
$('bRays').onclick=()=>{ st.rays=!st.rays; $('bRays').classList.toggle('on',st.rays); };
$('bQ').onclick=()=>{ quality=quality?0:1; $('bQ').textContent=quality?'Качество: полное':'Качество: лёгкое'; $('bQ').classList.toggle('on',!!quality); resize(); };
$('fog').oninput=e=>{ st.fog=e.target.value/1000; $('fogV').textContent=(e.target.value/100).toFixed(2); };
$('tod').oninput=e=>{ st.tod=e.target.value/1000; $('todV').textContent=st.tod<0.1?'день':st.tod<0.5?'к закату':st.tod<0.9?'закат':'сумерки'; };
$('furD').oninput=e=>{ st.furD=e.target.value/100; $('furV').textContent=e.target.value+'%'; };
$('wind').oninput=e=>{ st.wind=e.target.value/100; $('windV').textContent=st.wind.toFixed(1); };
const wrap=$('wrap'); const touches=new Map(); let pinch0=null;
wrap.addEventListener('pointerdown',e=>{ touches.set(e.pointerId,{x:e.clientX,y:e.clientY,yaw:st.yaw,pitch:st.pitch}); wrap.setPointerCapture(e.pointerId); if(touches.size===2){ const [a,b]=[...touches.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),dist:st.dist}; } });
wrap.addEventListener('pointermove',e=>{ const tch=touches.get(e.pointerId); if(!tch) return; const r=wrap.getBoundingClientRect(); if(touches.size>=2){ tch.cx=e.clientX; tch.cy=e.clientY; const arr=[...touches.values()]; const ax=arr[0].cx??arr[0].x, ay=arr[0].cy??arr[0].y, bx=arr[1].cx??arr[1].x, by=arr[1].cy??arr[1].y; const d=Math.hypot(ax-bx,ay-by); if(pinch0) st.dist=Math.max(0.7,Math.min(8,pinch0.dist*pinch0.d/Math.max(d,1))); return; }
  if(st.free){ st.yaw=tch.yaw+(e.clientX-tch.x)/r.width*3.2; st.pitch=tch.pitch+(e.clientY-tch.y)/r.height*1.6; } });
const up=e=>{ touches.delete(e.pointerId); if(touches.size<2) pinch0=null; for(const t of touches.values()){ t.x=t.cx??t.x; t.y=t.cy??t.y; t.yaw=st.yaw; t.pitch=st.pitch; } };
wrap.addEventListener('pointerup',up); wrap.addEventListener('pointercancel',up);
wrap.addEventListener('wheel',e=>{ st.dist=Math.max(0.7,Math.min(8,st.dist*Math.exp(e.deltaY*0.001))); e.preventDefault(); },{passive:false});
